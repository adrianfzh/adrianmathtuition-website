# Generate the Xcode project with:  xcodegen generate   (run in this folder)
name: Notebook
options:
  bundleIdPrefix: com.adrianmath
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing: automatic, no team yet. Add the company's team id here once the
    # Apple Developer Program enrolment clears (SPEC-STUDENT-APP.md §3).
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  NotebookApp:
    type: application
    platform: iOS
    sources:
      - path: NotebookApp
    # Lets other apps (Files, WhatsApp, Mail) offer "Open in Notebook" for a PDF.
    # Merged with the keys Xcode generates below.
    info:
      path: NotebookApp/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_NAME: NotebookApp
        PRODUCT_BUNDLE_IDENTIFIER: com.adrianmath.notebook
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # The brand: the ONE place the app's home-screen name is set.
        INFOPLIST_KEY_CFBundleDisplayName: Notebook
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  NotebookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NotebookTests
    dependencies:
      - target: NotebookApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.adrianmath.notebook.tests
  NotebookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NotebookUITests
    dependencies:
      - target: NotebookApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.adrianmath.notebook.uitests
        TEST_TARGET_NAME: NotebookApp
schemes:
  NotebookApp:
    build:
      targets:
        NotebookApp: all
        NotebookTests: [test]
        NotebookUITests: [test]
    test:
      targets:
        - NotebookTests
        - NotebookUITests
