<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="340" height="220" fill="#fff"/>
  <defs>
    <marker id="hn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e2a4a"/></marker>
    <marker id="hr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c0442d"/></marker>
    <marker id="hb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2c6e8f"/></marker>
  </defs>
  <!-- mantle and core -->
  <rect x="10" y="60" width="320" height="128" fill="#e9a66b"/>
  <rect x="10" y="188" width="320" height="24" fill="#d9772f"/>
  <!-- rising magma in the gap -->
  <rect x="154" y="61" width="32" height="21" fill="#c0442d"/>
  <!-- plates -->
  <rect x="10" y="60" width="146" height="22" fill="#8a8f9c" stroke="#1e2a4a" stroke-width="1.2"/>
  <rect x="184" y="60" width="146" height="22" fill="#8a8f9c" stroke="#1e2a4a" stroke-width="1.2"/>
  <rect x="10" y="60" width="320" height="152" fill="none" stroke="#1e2a4a" stroke-width="1.2"/>
  <line x1="10" y1="188" x2="330" y2="188" stroke="#1e2a4a" stroke-width="1.2"/>
  <!-- plate movement -->
  <line x1="120" y1="44" x2="52" y2="44" stroke="#1e2a4a" stroke-width="2" marker-end="url(#hn)"/>
  <line x1="220" y1="44" x2="288" y2="44" stroke="#1e2a4a" stroke-width="2" marker-end="url(#hn)"/>
  <!-- left current -->
  <g fill="none" stroke-width="2">
    <path d="M156 172 L156 108" stroke="#c0442d" marker-end="url(#hr)"/>
    <path d="M150 98 L52 98" stroke="#c0442d" marker-end="url(#hr)"/>
    <path d="M40 108 L40 166" stroke="#2c6e8f" marker-end="url(#hb)"/>
    <path d="M50 176 L146 176" stroke="#2c6e8f" marker-end="url(#hb)"/>
    <path d="M184 172 L184 108" stroke="#c0442d" marker-end="url(#hr)"/>
    <path d="M190 98 L288 98" stroke="#c0442d" marker-end="url(#hr)"/>
    <path d="M300 108 L300 166" stroke="#2c6e8f" marker-end="url(#hb)"/>
    <path d="M290 176 L194 176" stroke="#2c6e8f" marker-end="url(#hb)"/>
  </g>
  <text x="243" y="141" font-size="11" text-anchor="middle" fill="#1e2a4a">mantle</text>
  <text x="170" y="204" font-size="11" text-anchor="middle" fill="#1e2a4a">core (very hot)</text>
  <line x1="98" y1="129" x2="98" y2="100" stroke="#1e2a4a" stroke-width="1.2"/>
  <g font-size="11" font-weight="700" text-anchor="middle" fill="#fff">
    <circle cx="86" cy="71" r="8" fill="#1e2a4a"/><text x="86" y="75">A</text>
    <circle cx="254" cy="71" r="8" fill="#1e2a4a"/><text x="254" y="75">B</text>
    <circle cx="98" cy="137" r="8" fill="#1e2a4a"/><text x="98" y="141">C</text>
  </g>
</svg>
