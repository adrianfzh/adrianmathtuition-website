<title>Bar model builder</title>
<style>
  :root{
    --bg:#F8FAFC; --ink:#142033; --muted:#5A6B80;
    --rose:#B04A62; --teal:#1F6F84; --orange:#C85A2E; --plum:#6B4E9C;
    --grid:#E3E9F1; --line:#AEBDCE;
    --panel:#FFFFFF; --panelb:#DDE3EC;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Georgia","Times New Roman",serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh;
  }
  header{padding:16px 20px 6px 116px}
  h1{font-size:19px; font-weight:600; margin:0; letter-spacing:.2px}
  .sub{font-size:13px; color:var(--muted); margin-top:3px; max-width:72ch}

  main{width:100%; max-width:1080px; margin:0 auto; padding:6px 16px 46px; flex:1 1 auto}

  /* problem chips */
  .chips{display:flex; flex-wrap:wrap; gap:8px; padding:8px 0 2px}
  .chips button{
    font:inherit; font-size:13px; color:var(--ink); background:var(--panel);
    border:1px solid var(--panelb); border-radius:999px; padding:8px 14px;
    cursor:pointer; min-height:44px;
  }
  .chips button:hover{border-color:var(--muted)}
  .chips button.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
  /* .45 was fine on warm paper; on the lighter background a locked chip fell
     under 3:1, so it reads as damage rather than as "not yet unlocked" */
  .chips button:disabled{opacity:.6; cursor:default}
  .chips button:disabled:hover{border-color:var(--panelb)}
  .chips .star{color:var(--orange); margin-left:5px}
  .chips button.on .star{color:#EDA98A}
  .chips .tick{color:var(--teal); margin-left:5px}
  .chips button.on .tick{color:#8FC6D6}

  .story{font-size:15px; line-height:1.58; margin:10px 0 6px; max-width:74ch}

  button{
    font:inherit; font-size:13px; color:var(--ink); background:var(--panel);
    border:1px solid var(--panelb); border-radius:8px; padding:7px 13px; cursor:pointer;
  }
  button:hover{border-color:var(--muted)}
  button:focus-visible{outline:2px solid var(--orange); outline-offset:1px}
  button:disabled{opacity:.4; cursor:default}
  button:disabled:hover{border-color:var(--panelb)}
  button.primary{background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600}
  button.primary:hover{background:#000}

  .stagegrid{display:grid; grid-template-columns:minmax(0,1fr) 212px; gap:14px; align-items:start}

  .toolbar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:4px 0 10px}
  .toolbar button{min-height:44px}
  .toolbar .spacer{margin-left:auto}
  .toolbar .pc{font-weight:700}
  .toolbar #bUnit .pc{color:var(--teal)}
  .toolbar #bNum .pc{color:var(--orange)}

  .modelwrap{
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    background:var(--panel); border:1px solid var(--panelb); border-radius:14px;
    box-shadow:0 1px 0 rgba(0,0,0,.03);
  }
  svg{display:block; touch-action:pan-x}

  .notebar{min-height:1.7em; padding:8px 2px 0; font-size:13.5px; font-style:italic;
           color:var(--muted); line-height:1.5; max-width:74ch}
  .notebar.good{color:var(--teal)}
  .notebar.bad{color:var(--rose)}

  /* solve card */
  .qcard{
    background:var(--panel); border:1px solid var(--panelb); border-radius:14px;
    padding:13px 16px 14px; margin-top:14px;
  }
  .qhead{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
  .slines{padding:6px 0 2px}
  .sline{
    font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
    font-size:14.5px; line-height:1.7; padding:3px 0; color:var(--ink);
  }
  .sline.dim{color:var(--muted)}
  .sline.enter-anim{animation:lin .38s ease}
  @keyframes lin{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none}}
  .ansslot{
    min-width:64px; min-height:44px; border:1.6px dashed var(--muted); border-radius:10px;
    font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace; font-size:15px;
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--bg); vertical-align:middle; margin-left:2px; padding:4px 10px;
  }
  .ansslot.active{border-style:solid; border-color:var(--orange); color:var(--orange)}
  .ansslot.okk{border-style:solid; border-color:var(--teal); color:var(--teal); font-weight:700}
  .ansslot.shown{border-style:solid; border-color:var(--muted); color:var(--muted); font-weight:700}
  .qfeed{min-height:1.5em; font-size:13.5px; font-style:italic; margin-top:6px; line-height:1.5}
  .qfeed.good{color:var(--teal)} .qfeed.bad{color:var(--rose)}

  /* algebra echo */
  .echo{
    margin-top:12px; border-left:3px solid var(--plum); background:var(--panel);
    border-radius:0 12px 12px 0; padding:10px 15px; max-width:64ch;
    animation:lin .5s ease;
  }
  .echo .ehead{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
  .echo .eline{color:var(--plum); font-size:15.5px; font-style:italic; margin-top:4px; line-height:1.5}

  .donebar{margin-top:12px; font-size:14px; color:var(--teal);
           display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .donebar .starline{color:var(--orange)}

  /* keypad (probability-tree idiom) */
  .kp{
    background:var(--panel); border:1px solid var(--panelb); border-radius:14px;
    padding:10px; position:sticky; top:10px;
  }
  .kphint{font-size:12px; color:var(--muted); font-style:italic; text-align:center; min-height:2.6em; margin-bottom:6px; line-height:1.3}
  .kpprev{
    min-height:40px; display:flex; align-items:center; justify-content:center;
    font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace; font-size:17px;
    background:var(--bg); border:1px solid var(--panelb); border-radius:9px; margin-bottom:8px; padding:3px;
  }
  .kpgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
  .kpgrid button{
    min-height:46px; font-size:17px; border-radius:9px;
    font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  }
  .kpgrid button.op{color:var(--teal); font-weight:700}
  .kpgrid button.enter{grid-column:span 2; background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:700}
  .kpgrid button.enter:hover{background:#000}

  /* SVG bits */
  .rowhit{cursor:pointer}
  .rowhit:focus{outline:none}
  .rowg.inert .rowhit{cursor:default}
  .rowg.wrong{animation:shake .35s ease 1}
  @keyframes shake{0%,100%{transform:translateX(0)} 30%{transform:translateX(-4px)} 60%{transform:translateX(4px)}}
  .brk{fill:none; stroke:var(--ink); stroke-width:1.8}
  .brk.preview{stroke:var(--muted); stroke-dasharray:5 4; stroke-width:1.4}
  .brk.draw{stroke-dasharray:1; stroke-dashoffset:1; transition:stroke-dashoffset .8s ease .12s}
  .brk.draw.go{stroke-dashoffset:0}
  .brklab{transition:opacity .4s ease .55s; opacity:0}
  .brklab.go{opacity:1}
  .fadein{animation:fin .4s ease 1}
  @keyframes fin{from{opacity:0} to{opacity:1}}

  @media (max-width:860px){
    .stagegrid{grid-template-columns:1fr}
    .kp{
      position:fixed; left:0; right:0; bottom:0; top:auto; z-index:60;
      border-radius:16px 16px 0 0; box-shadow:0 -4px 18px rgba(0,0,0,.14);
      max-width:420px; margin:0 auto;
      padding-bottom:calc(10px + env(safe-area-inset-bottom));
      transform:translateY(108%); transition:transform .25s ease;
    }
    .kp.open{transform:translateY(0)}
    body.kpopen main{padding-bottom:340px}
  }
  @media (max-width:560px){
    header{padding:50px 16px 6px 16px}
    .story{font-size:14px}
  }
  .mono{font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition:none !important; animation:none !important}
  }
</style>
</head>

<header>
  <h1>Bar model builder</h1>
  <div class="sub">Draw the problem before you solve it. Units you can see beat algebra you can&rsquo;t — and in two years this IS your algebra.</div>
</header>

<main>
  <div class="chips" id="chips" role="tablist" aria-label="Problems"></div>
  <div class="story" id="story"></div>

  <div class="stagegrid">
    <div>
      <div class="toolbar" id="toolbar">
        <button id="bUnit" type="button"><span class="pc">+</span> unit</button>
        <button id="bNum" type="button"><span class="pc">+</span> number</button>
        <button id="bSpent" type="button" hidden>✕ spent</button>
        <button id="bUndo" type="button">undo piece</button>
        <button id="bClear" type="button">↺ start again</button>
        <span class="spacer"></span>
        <button id="bCheck" type="button" class="primary">Check my model</button>
      </div>

      <div class="modelwrap" id="modelwrap">
        <svg id="model" xmlns="http://www.w3.org/2000/svg" aria-label="Bar model drawing area"></svg>
      </div>
      <div class="notebar" id="notebar" aria-live="polite"></div>

      <section class="qcard" id="solveCard" hidden>
        <div class="qhead">Now solve it</div>
        <div class="slines" id="slines"></div>
        <div class="qfeed" id="sfeed" aria-live="polite"></div>
      </section>

      <div class="echo" id="echo" hidden>
        <div class="ehead">the same model, written as algebra</div>
        <div class="eline" id="echoLine"></div>
      </div>

      <div class="donebar" id="donebar" hidden>
        <span id="doneMsg"></span>
        <button id="nextBtn" type="button" class="primary" hidden>Next problem ›</button>
      </div>
    </div>

    <div class="kp" id="kp" aria-label="number keypad">
      <div class="kphint" id="kpHint"></div>
      <div class="kpprev" id="kpPrev">&nbsp;</div>
      <div class="kpgrid" id="kpGrid"></div>
    </div>
  </div>
  <noscript><div style="color:#5A6B80;padding:18px 0">This tool needs JavaScript to draw the bars.</div></noscript>
</main>

<script>
(function(){
  "use strict";

  /* ── tiny helpers ─────────────────────────────────────────────── */
  const $ = id => document.getElementById(id);
  const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
  const lerp = (a,b,t) => a + (b-a)*t;
  const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const MINUS = '−';
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function trimNum(v){ const r = Math.round(v*100)/100; return String(r).replace('-', MINUS); }
  function fmtVal(v, kind){
    if (kind === '$')  return '$' + trimNum(v);
    if (kind === '$2') return '$' + v.toFixed(2);
    if (kind === 'g')  return trimNum(v) + ' g';
    if (kind === 'm')  return trimNum(v) + ' m';
    return trimNum(v);
  }

  const SVGNS = 'http://www.w3.org/2000/svg';
  function el(name, attrs, parent){
    const e = document.createElementNS(SVGNS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function tEl(parent, x, y, str, o){
    o = o || {};
    const t = el('text', {x:x, y:y, 'text-anchor':o.anchor||'middle',
      'font-size':o.size||13, fill:o.fill||'var(--ink)'}, parent);
    t.setAttribute('font-family', o.mono ? 'SFMono-Regular,ui-monospace,Menlo,Consolas,monospace' : 'Georgia,serif');
    if (o.italic) t.setAttribute('font-style','italic');
    if (o.bold) t.setAttribute('font-weight','600');
    if (o.ls) t.setAttribute('letter-spacing', o.ls);
    if (o.halo){ t.setAttribute('paint-order','stroke'); t.setAttribute('stroke','var(--panel)'); t.setAttribute('stroke-width','3.5'); }
    t.textContent = str;
    return t;
  }
  // curly braces: vertical "}" (nib right) and horizontal (nib up)
  function braceV(x, y0, y1, w){
    const m = (y0+y1)/2;
    return 'M '+x+' '+y0+' C '+(x+w)+' '+y0+', '+x+' '+m+', '+(x+w)+' '+m+
           ' C '+x+' '+m+', '+(x+w)+' '+y1+', '+x+' '+y1;
  }
  function braceH(x0, x1, y, w){
    const m = (x0+x1)/2;
    return 'M '+x0+' '+y+' C '+x0+' '+(y-w)+', '+m+' '+y+', '+m+' '+(y-w)+
           ' C '+m+' '+y+', '+x1+' '+(y-w)+', '+x1+' '+y;
  }

  /* ── the problem bank ─────────────────────────────────────────────
     Row: {name, panel, u (units), x (spent units), s (stub sum),
           hint (units/spent wrong), hintNum (stub wrong)}.
     Check compares unit counts, spent counts and stub SUMS per row —
     order of pieces and how a stub total is split do not matter.    */
  const PROBLEMS = [
    {
      id:'p1', chip:'1 · Ali &amp; Ben', fmt:'$', unitVal:21, answer:21,
      story:'Ali has <b>3 times</b> as much money as Ben. Together they have <b>$84</b>. How much does Ben have?',
      note:'Ben first: he’s the ‘1’. Then build Ali out of Ben’s unit.',
      rows:[
        {name:'Ben', u:1, x:0, s:0, hint:'Ben is the smaller share — one unit is enough.'},
        {name:'Ali', u:3, x:0, s:0, hint:'Ali is ‘3 times’ Ben — how many of Ben’s units make Ali?'}
      ],
      brackets:[{t:'totalV', rows:[0,1], label:'$84'}],
      solve:{
        lines:['Ben + Ali = 1 unit + 3 units = 4 units', '4 units = $84'],
        uPre:'1 unit = 84 ÷ 4 = ', fPre:'Ben = 1 unit = ',
        fDone:'Ben has $21.'
      },
      echo:'Let Ben = u. Then 4u = 84, so u = 21.'
    },
    {
      id:'p2', chip:'2 · $18 more', fmt:'$', unitVal:18, answer:18,
      story:'Meera has <b>$18 more</b> than Sam. Together they have <b>$54</b>. How much does Sam have?',
      note:'Sam is plain units. Meera is Sam’s unit plus a number.',
      rows:[
        {name:'Sam', u:1, x:0, s:0, hint:'Sam is the plain one — just his unit, nothing stuck on.'},
        {name:'Meera', u:1, x:0, s:18, hint:'Meera is Sam’s unit AND the extra — one unit, then the number.',
         hintNum:'The bars match — but how much more does Meera have? Check the number.'}
      ],
      brackets:[{t:'totalV', rows:[0,1], label:'$54'}],
      solve:{
        lines:['Sam + Meera: 2 units + $18 = $54', '2 units = 54 − 18 = $36'],
        uPre:'1 unit = 36 ÷ 2 = ', fPre:'Sam = 1 unit = ',
        fDone:'Sam has $18 — the same size as Meera’s extra. Coincidence? Check the picture.'
      },
      echo:'Let Sam = u. Then 2u + 18 = 54, so u = 18.'
    },
    {
      id:'p3', chip:'3 · Boys &amp; girls', fmt:'plain', unitVal:12, answer:60,
      story:'<b>2/5</b> of the pupils in a class are boys. There are <b>12 more girls</b> than boys. How many pupils are there?',
      note:'Fifths are same-size units — boys take 2 of them, girls take the rest.',
      rows:[
        {name:'Boys', u:2, x:0, s:0, hint:'2 fifths are boys — two units.'},
        {name:'Girls', u:3, x:0, s:0, hint:'If 2 fifths are boys, the girls take the other 3 — three units, same size.',
         hintNum:'No fixed numbers here — the 12 is the GAP between the rows, and the bracket will draw it for you.'}
      ],
      brackets:[{t:'diff', a:0, b:1, label:'12'}],
      solve:{
        lines:['Girls − Boys = 3 units − 2 units = 1 unit', 'That 1 unit is exactly the 12 extra girls'],
        uPre:'1 unit = ', fPre:'Whole class = 5 units = 5 × 12 = ',
        fDone:'60 pupils in the class.'
      },
      echo:'Let 1 unit = u. Then 3u − 2u = 12, so u = 12 and the class is 5u = 60.'
    },
    {
      id:'p4', chip:'4 · The ratio mix', fmt:'g', unitVal:80, answer:240,
      story:'Sugar, flour and butter are mixed in the ratio <b>2 : 3 : 5</b>. The mixture is <b>800 g</b>. How much flour is there?',
      note:'One unit per ratio part — 2, then 3, then 5.',
      rows:[
        {name:'Sugar', u:2, x:0, s:0, hint:'The ratio gives sugar 2 parts — two units.'},
        {name:'Flour', u:3, x:0, s:0, hint:'Flour is the ‘3’ in 2 : 3 : 5.'},
        {name:'Butter', u:5, x:0, s:0, hint:'Butter is the big one — 5 parts.'}
      ],
      brackets:[{t:'totalV', rows:[0,1,2], label:'800 g'}],
      solve:{
        lines:['2 + 3 + 5 = 10 units', '10 units = 800 g'],
        uPre:'1 unit = 800 ÷ 10 = ', fPre:'Flour = 3 units = ',
        fDone:'240 g of flour.'
      },
      echo:'Let 1 part = u. Then 10u = 800, so u = 80 and flour = 3u = 240 g.'
    },
    {
      id:'p5', chip:'5 · The transfer', fmt:'$', unitVal:30, answer:60,
      story:'Ken had <b>twice</b> as much money as Lin. After Ken gave Lin <b>$15</b>, they had the <b>same</b> amount. How much did Ken have at first?',
      note:'Build BEFORE first. In AFTER, the $15 leaves Ken (± turns a number into a take-away) and lands on Lin.',
      panels:['Before', 'After — Ken gives Lin $15'],
      rows:[
        {name:'Ken', panel:0, u:2, x:0, s:0, hint:'‘Twice as much’ — two units for Ken before anything moves.'},
        {name:'Lin', panel:0, u:1, x:0, s:0, hint:'Lin starts as the single unit.'},
        {name:'Ken', panel:1, u:2, x:0, s:-15,
         hint:'After giving $15 away Ken still shows his two units — with a $15 chunk taken out (+ number, then ±).',
         hintNum:'Ken’s $15 goes OUT — type 15, then press ± so it reads −15.'},
        {name:'Lin', panel:1, u:1, x:0, s:15,
         hint:'Lin’s one unit just gained $15 — add the number on.',
         hintNum:'Lin RECEIVES the $15 — it should be a plain +15, not a take-away.'}
      ],
      brackets:[{t:'same', a:2, b:3, label:'same'}],
      transfer:{from:2, to:3, label:'$15'},
      solve:{
        lines:['Before: Ken sits exactly 1 unit ahead of Lin',
               'The $15 left Ken AND landed on Lin — the gap closed by 15 + 15 = $30',
               'That closed gap is the 1 unit'],
        uPre:'1 unit = ', fPre:'Ken at first = 2 units = ',
        fDone:'Ken had $60 at first.'
      },
      echo:'Let Lin = u at first. Then 2u − 15 = u + 15, so u = 30 and Ken had 2u = $60.'
    },
    {
      id:'p6', chip:'6 · Percent left', fmt:'$', unitVal:8, answer:80, spent:true,
      story:'After spending <b>30%</b> of her money, Nadia had <b>$56 left</b>. How much did she start with?',
      note:'Cut her money into ten 10% units: + unit keeps one, ✕ spent crosses one out.',
      rows:[
        {name:'Nadia', u:7, x:3, s:0,
         hint:'Ten units of 10% each — 7 kept, 3 crossed out as spent (✕).',
         hintNum:'No fixed numbers on this row — every piece is a 10% unit; the $56 lives on the bracket.'}
      ],
      brackets:[{t:'part', row:0, seg:'plain', label:'$56'}, {t:'part', row:0, seg:'spent', label:'spent', small:true}],
      solve:{
        lines:['3 units spent, 7 units kept', '7 units = $56'],
        uPre:'1 unit = 56 ÷ 7 = ', fPre:'Start = all 10 units = ',
        fDone:'She started with $80.'
      },
      echo:'Let her start be x. Then 0.7x = 56, so x = $80.'
    },
    {
      id:'p7', chip:'7 · Pens &amp; rulers', fmt:'$2', unitVal:1.2, answer:1.2, money:true,
      story:'<b>3 pens</b> and <b>2 rulers</b> cost <b>$9</b>. A pen costs <b>$1 more</b> than a ruler. Find the cost of a ruler.',
      note:'Let a ruler be 1 unit. A pen is a unit and a bit more — build all three pens.',
      rows:[
        {name:'Pens', u:3, x:0, s:3,
         hint:'Each pen is a ruler-unit plus $1 — three units, and $3 of extras in any split.',
         hintNum:'Three pens each carry an extra $1 — the numbers on this row should total $3.'},
        {name:'Rulers', u:2, x:0, s:0, hint:'Two rulers, two plain units — no extras.'}
      ],
      brackets:[{t:'totalV', rows:[0,1], label:'$9'}],
      solve:{

    {

               'The $24 closed that gap by 24 + 24 = $48', '2 units = $48'],

      ],
      brackets:[{t:'totalV', rows:[0,1,2], label:'39 m'}],
      solve:{
        lines:['1 + 2 + 2 units, plus the extra 4 m:  5 units + 4 = 39', '5 units = 39 − 4 = 35 m'],
        uPre:'1 unit = 35 ÷ 5 = ', fPre:'Longest = third piece = 2 units + 4 = ',
        fDone:'The longest piece is 18 m.'
      },
      echo:'Let the first piece = u. Then u + 2u + (2u + 4) = 39, so 5u + 4 = 39, u = 7 — longest = 2u + 4 = 18 m.'
    }
  ];

  /* ── state ────────────────────────────────────────────────────── */
  const STATES = {};
  function stateFor(p){
    if (!STATES[p.id]) STATES[p.id] = {
      pieces: p.rows.map(() => []),   // per row: {k:'unit'|'spent'|'stub', v}
      sel: 0, phase: 'build',         // build | solve | done
      attempts: 0, star: false, done: false,
      sPhase: null,                   // unit | final | done
      uDone: false, uShown: false, fShown: false,
      sTries: 0, bracketsDrawn: false,
      solveVisible: false             // card stays hidden until the reveal finishes
    };
    return STATES[p.id];
  }
  let cur = 0;
  const prob = () => PROBLEMS[cur];
  const st = () => stateFor(prob());

  // progress (persisted so the unlock chain survives a refresh)
  function saveProg(){
    try{
      localStorage.setItem('barmodel_prog', JSON.stringify({
        done: PROBLEMS.map(p => !!(STATES[p.id] && STATES[p.id].done)),
        star: PROBLEMS.map(p => !!(STATES[p.id] && STATES[p.id].star))
      }));
    }catch(e){}
  }
  function loadProg(){
    try{
      const d = JSON.parse(localStorage.getItem('barmodel_prog') || 'null');
      if (!d || !d.done) return;
      PROBLEMS.forEach((p, i) => {
        if (d.done[i]){
          const s = stateFor(p);
          s.done = true; s.star = !!(d.star && d.star[i]);
          s.phase = 'done'; s.sPhase = 'done'; s.uDone = true; s.solveVisible = true;
          s.pieces = p.rows.map(r => {
            const arr = [];
            for (let k=0;k<r.u;k++) arr.push({k:'unit'});
            for (let k=0;k<r.x;k++) arr.push({k:'spent'});
            if (r.s) arr.push({k:'stub', v:r.s});
            return arr;
          });
          s.bracketsDrawn = true;
        }
      });
    }catch(e){}
  }
  function unlocked(i){
    if (i === 0) return true;
    const gate = i < 4 ? i - 1 : 3;              // P1–P4 in order, then free choice
    return !!(STATES[PROBLEMS[gate].id] && STATES[PROBLEMS[gate].id].done);
  }

  /* ── DOM refs ─────────────────────────────────────────────────── */
  const chipsEl=$('chips'), storyEl=$('story'), noteEl=$('notebar');
  const svg=$('model'), wrap=$('modelwrap');
  const bUnit=$('bUnit'), bNum=$('bNum'), bSpent=$('bSpent'), bUndo=$('bUndo'),
        bClear=$('bClear'), bCheck=$('bCheck');
  const solveCard=$('solveCard'), slinesEl=$('slines'), sfeedEl=$('sfeed');
  const echoEl=$('echo'), echoLine=$('echoLine');
  const donebar=$('donebar'), doneMsg=$('doneMsg'), nextBtn=$('nextBtn');
  const kpEl=$('kp'), kpHint=$('kpHint'), kpPrev=$('kpPrev'), kpGrid=$('kpGrid');

  let timers = [];
  function later(fn, ms){ timers.push(setTimeout(fn, REDUCED ? 0 : ms)); }
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

  const AFFIRM = ['Nice drawing.','That’s the picture.','Clean bars.','Good eye.','Tidy work.'];
  let affirmI = 0;
  const pickAffirm = () => AFFIRM[(affirmI++) % AFFIRM.length];
  function note(msg, mood){
    noteEl.textContent = msg;
    noteEl.className = 'notebar' + (mood ? ' ' + mood : '');
  }

  /* ── keypad ───────────────────────────────────────────────────── */
  let kpTarget = null, buf = '';
  const KP_KEYS = ['7','8','9','4','5','6','1','2','3','.','0','±','C','↵'];
  KP_KEYS.forEach(k => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = k;
    if (k==='.' || k==='±') b.className = 'op';
    if (k==='↵'){ b.className = 'enter'; b.textContent = '↵ enter'; b.setAttribute('aria-label','enter'); }
    if (k==='C') b.setAttribute('aria-label','clear entry');
    b.addEventListener('click', () => kpPress(k));
    kpGrid.appendChild(b);
  });
  function kpPress(k){
    if (!kpTarget) return;
    if (k==='↵'){ commitEntry(); return; }
    if (k==='C'){ buf=''; syncKp(); return; }
    if (k==='±'){
      if (kpTarget.t !== 'stub') return;                 // signs only make sense on pieces
      buf = buf.startsWith('-') ? buf.slice(1) : '-'+buf;
      syncKp(); return;
    }
    if (k==='.'){
      if (!prob().money || buf.indexOf('.')>=0) return;  // decimals only in money mode
      buf += (buf==='' || buf==='-') ? '0.' : '.';
      syncKp(); return;
    }
    const digits = buf.replace('-','');
    if (digits.length >= 7) return;
    buf += k; syncKp();
  }
  function openKeypad(target){
    kpTarget = target; buf = '';
    kpEl.classList.add('open');
    document.body.classList.add('kpopen');
    syncKp();
    if (target.t !== 'stub') renderSolve(false);
  }
  function closeKeypad(){
    kpTarget = null; buf = '';
    kpEl.classList.remove('open');
    document.body.classList.remove('kpopen');
    syncKp();
  }
  function syncKp(){
    const P = prob();
    if (!kpTarget){
      kpHint.textContent = st().phase==='build'
        ? 'tap a row, add pieces — + number opens this keypad'
        : 'tap the dashed ? in the working';
      kpPrev.innerHTML = '&nbsp;';
    } else if (kpTarget.t === 'stub'){
      kpHint.textContent = (P.panels ? 'value of the fixed piece — ± flips it to a take-away' : 'value of the fixed piece');
      kpPrev.textContent = buf ? buf.replace('-', MINUS) : '…';
    } else {
      kpHint.textContent = kpTarget.t==='unit' ? 'what is 1 unit worth?' : 'the final answer';
      kpPrev.textContent = buf || '…';
    }
    const slot = document.querySelector('.ansslot.active');
    if (slot && kpTarget && kpTarget.t !== 'stub') slot.textContent = buf || '?';
  }
  function parseBuf(){
    if (!buf || buf==='-' || buf==='.' || buf==='-.') return null;
    const v = parseFloat(buf);
    return isFinite(v) ? v : null;
  }

  /* ── build actions ────────────────────────────────────────────── */
  function selRowPieces(){ return st().pieces[st().sel]; }
  function addPiece(piece){
    const S = st();
    if (S.phase !== 'build') return;
    if (selRowPieces().length >= 14){ note('That’s plenty of pieces — try Check.', 'bad'); return; }
    selRowPieces().push(piece);
    note(piece.k==='unit' ? 'One unit on ' + prob().rows[S.sel].name + '.'
       : piece.k==='spent' ? 'Crossed out — that 10% is spent.'
       : 'Fixed piece of ' + trimNum(piece.v) + ' added.');
    renderSVG();
  }
  bUnit.addEventListener('click', () => addPiece({k:'unit'}));
  bSpent.addEventListener('click', () => addPiece({k:'spent'}));
  bNum.addEventListener('click', () => {
    if (st().phase !== 'build') return;
    openKeypad({t:'stub'});
    renderSVG();
  });
  bUndo.addEventListener('click', () => {
    const S = st();
    if (S.phase !== 'build') return;
    if (!selRowPieces().length){ note('Nothing to undo on ' + prob().rows[S.sel].name + '’s row.'); return; }
    selRowPieces().pop();
    note('Undone.');
    renderSVG();
  });
  bClear.addEventListener('click', () => {
    const S = st();
    if (S.phase !== 'build') return;
    S.pieces = prob().rows.map(() => []);
    note('Fresh page. ' + prob().note);
    renderSVG();
  });

  /* ── model check ──────────────────────────────────────────────── */
  function rowCounts(pieces){
    let u=0, x=0, s=0;
    pieces.forEach(p => { if (p.k==='unit') u++; else if (p.k==='spent') x++; else s += p.v; });
    return {u:u, x:x, s:s};
  }
  function rowMatches(want, got){
    return got.u===want.u && got.x===want.x && Math.abs(got.s - want.s) <= 0.001;
  }
  bCheck.addEventListener('click', () => {
    const P = prob(), S = st();
    if (S.phase !== 'build') return;
    closeKeypad();
    const counts = S.pieces.map(rowCounts);
    if (counts.every(c => c.u+c.x===0 && c.s===0)){
      note('Nothing drawn yet — tap a row, then + unit.', 'bad');
      return;                                            // an empty press doesn’t burn the star
    }
    const wrongs = [];
    P.rows.forEach((r, i) => { if (!rowMatches(r, counts[i])) wrongs.push(i); });
    if (!wrongs.length){
      S.star = S.attempts === 0;
      S.phase = 'solve'; S.sPhase = 'unit';
      note('✓ ' + pickAffirm() + ' Watch the brackets.', 'good');
      renderAll();                                       // draws brackets with the draw-in animation
      S.bracketsDrawn = true;
      const wait = REDUCED ? 0 : 950;
      if (P.transfer) later(() => runTransfer(openSolve), wait);
      else later(openSolve, wait);
    } else {
      S.attempts++;
      const i = wrongs[0], r = P.rows[i], got = counts[i];
      let msg;
      if (got.u + got.x === 0 && got.s === 0) msg = r.name + '’s row is still empty — give it some pieces.';
      else if (got.u !== r.u || got.x !== r.x) msg = r.hint;
      else msg = r.hintNum || ('The bars are right — it’s the fixed number on ' + r.name + '’s row that’s off.');
      S.flashRow = i;
      note(msg, 'bad');
      renderSVG();
      later(() => { S.flashRow = null; }, 700);
    }
  });

  /* ── SVG rendering ────────────────────────────────────────────── */
  const X0 = 84, ROWH = 34, ROWGAP = 24;
  const TEAL_F = 'rgba(31,111,132,.25)';
  const ORANGE_F = 'rgba(200,90,46,.26)';
  let GEO = null;

  function stubW(v, U){ return clamp(Math.abs(v) / prob().unitVal * U, 24, 3*U); }

  function renderSVG(){
    const P = prob(), S = st();
    const wrapW = wrap.clientWidth || 640;
    const hasPart = P.brackets.some(b => b.t==='part');
    const topPad = hasPart ? 40 : 16;
    const canonLen = Math.max.apply(null, P.rows.map(r => r.u + r.x + Math.max(0, r.s)/P.unitVal));
    const U = clamp((wrapW - X0 - 100) / (canonLen + 0.8), 34, 64);

    // per-row piece geometry (sorted: units, spent, +stubs; negatives overlay the end)
    const geo = {U:U, rowTop:[], posEnd:[], effEnd:[], negBox:[], stubBox:[], rects:[]};
    let maxEnd = X0 + U;
    P.rows.forEach((r, i) => {
      const c = rowCounts(S.pieces[i]);
      const pos = [], negs = [];
      S.pieces[i].forEach(p => {
        if (p.k==='stub' && p.v < 0) negs.push(p);
      });
      let len = (c.u + c.x) * U;
      S.pieces[i].forEach(p => { if (p.k==='stub' && p.v > 0) len += stubW(p.v, U); });
      const negW = negs.reduce((a,p) => a + stubW(p.v, U), 0);
      geo.posEnd[i] = X0 + len;
      geo.effEnd[i] = X0 + len - negW;
      maxEnd = Math.max(maxEnd, X0 + len);
    });

    const W = Math.max(wrapW - 2, maxEnd + 96);
    // vertical layout (panel captions)
    let y = topPad, lastPanel = -1;
    const capt = [];
    P.rows.forEach((r, i) => {
      const pn = r.panel == null ? -9 : r.panel;
      if (P.panels && pn !== lastPanel){
        if (lastPanel !== -1) y += 10;
        capt.push({y: y + 12, text: P.panels[pn]});
        y += 24; lastPanel = pn;
      }
      geo.rowTop[i] = y;
      y += ROWH + ROWGAP;
    });
    const H = y - ROWGAP + 26;

    svg.setAttribute('viewBox', '0 0 '+W+' '+H);
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    // hatch patterns
    const defs = el('defs', {}, svg);
    [['hT','var(--teal)','rgba(31,111,132,.10)'], ['hO','var(--orange)','rgba(200,90,46,.14)']].forEach(d => {
      const pat = el('pattern', {id:d[0], width:7, height:7, patternUnits:'userSpaceOnUse',
                                 patternTransform:'rotate(45)'}, defs);
      el('rect', {width:7, height:7, fill:d[2]}, pat);
      el('line', {x1:0, y1:0, x2:0, y2:7, stroke:d[1], 'stroke-width':1.6, opacity:.5}, pat);
    });

    capt.forEach(c => tEl(svg, X0, c.y, c.text.toUpperCase(),
      {anchor:'start', size:10.5, mono:1, fill:'var(--muted)', ls:'.14em'}));

    P.rows.forEach((r, i) => {
      const top = geo.rowTop[i];
      const g = el('g', {'class':'rowg' + (S.phase!=='build' ? ' inert' : '') +
                                  (S.flashRow===i ? ' wrong' : '')}, svg);
      const selected = S.phase==='build' && S.sel===i;

      tEl(g, X0-10, top+ROWH/2+4.5, r.name,
          {anchor:'end', size:14, italic:1, bold:selected?1:0,
           fill:selected ? 'var(--teal)' : 'var(--ink)'});

      // pieces, sorted for display
      let x = X0;
      const c = rowCounts(S.pieces[i]);
      for (let k=0; k<c.u; k++){
        el('rect', {x:x, y:top, width:U, height:ROWH, fill:TEAL_F,
                    stroke:'var(--ink)', 'stroke-width':1.6}, g);
        x += U;
      }
      for (let k=0; k<c.x; k++){
        el('rect', {x:x, y:top, width:U, height:ROWH, fill:'url(#hT)',
                    stroke:'var(--ink)', 'stroke-width':1.6}, g);
        x += U;
      }
      let sbx0 = null;
      S.pieces[i].forEach(p => {
        if (p.k!=='stub' || p.v <= 0) return;
        const w = stubW(p.v, U);
        if (sbx0===null) sbx0 = x;
        const sg = el('g', {id:'gStub_'+i}, g);
        el('rect', {x:x, y:top, width:w, height:ROWH, fill:ORANGE_F,
                    stroke:'var(--orange)', 'stroke-width':1.8}, sg);
        if (w >= 32) tEl(sg, x+w/2, top+ROWH/2+4.5, trimNum(p.v), {size:12, mono:1, bold:1});
        else tEl(sg, x+w/2, top-5, trimNum(p.v), {size:10.5, mono:1, bold:1, fill:'var(--orange)', halo:1});
        x += w;
      });
      if (sbx0!==null) geo.stubBox[i] = {x:sbx0, y:top, w:x-sbx0, h:ROWH};

      // negative stubs: hatched take-away chunks at the end of the bar
      let nx = x, nw0 = null;
      S.pieces[i].slice().reverse().forEach(p => {
        if (p.k!=='stub' || p.v >= 0) return;
        const w = stubW(p.v, U);
        nx -= w; if (nx < X0) nx = X0;
        const ng = el('g', {id:'gNeg_'+i}, g);
        el('rect', {x:nx, y:top, width:w, height:ROWH, fill:'url(#hO)',
                    stroke:'var(--orange)', 'stroke-width':1.8, 'stroke-dasharray':'4 3'}, ng);
        if (w >= 34) tEl(ng, nx+w/2, top+ROWH/2+4.5, MINUS+trimNum(Math.abs(p.v)), {size:11.5, mono:1, bold:1, fill:'var(--orange)', halo:1});
        else tEl(ng, nx+w/2, top+ROWH+12, MINUS+trimNum(Math.abs(p.v)), {size:10.5, mono:1, bold:1, fill:'var(--orange)', halo:1});
        nw0 = {x:nx, y:top, w:w, h:ROWH};
      });
      if (nw0) geo.negBox[i] = nw0;

      if (c.u + c.x === 0 && x === X0 && !S.pieces[i].length){
        el('rect', {x:X0, y:top, width:U, height:ROWH, rx:6, fill:'none',
                    stroke:'var(--muted)', 'stroke-width':1.3, 'stroke-dasharray':'5 4', opacity:.55}, g);
        tEl(g, X0+U/2, top+ROWH/2+4.5, '+', {size:15, fill:'var(--muted)'});
      }

      if (selected){
        el('rect', {x:X0-5, y:top-5, width:Math.max(x - X0, U)+10, height:ROWH+10, rx:9,
                    fill:'none', stroke:'var(--teal)', 'stroke-width':2}, g);
      }

      // fat hit target
      const hit = el('rect', {x:0, y:top-10, width:W, height:ROWH+20,
                              fill:'#000', 'fill-opacity':0, 'class':'rowhit'}, g);
      if (S.phase==='build'){
        hit.setAttribute('tabindex', 0);
        hit.setAttribute('role', 'button');
        hit.setAttribute('aria-label', r.name + (P.panels ? ' ('+P.panels[r.panel]+')' : '') +
          ' — ' + c.u + ' unit'+(c.u===1?'':'s') +
          (c.x ? ', '+c.x+' spent' : '') + (c.s ? ', numbers totalling '+trimNum(c.s) : '') +
          (selected ? ' — selected' : ' — tap to select'));
        hit.addEventListener('pointerdown', ev => { ev.preventDefault(); S.sel = i; renderSVG(); });
        hit.addEventListener('keydown', ev => {
          if (ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); S.sel = i; renderSVG(); }
        });
      }
    });

    drawBrackets(P, S, geo, W);
    GEO = geo;
  }

  function bracketReady(P, S, b){
    const filled = i => S.pieces[i].length > 0;
    if (b.t==='totalV') return b.rows.every(filled);
    if (b.t==='diff')   return filled(b.a) && filled(b.b) && GEOend(b.b) > GEOend(b.a) + 4;
    if (b.t==='same')   return filled(b.a) && filled(b.b);
    if (b.t==='part')   return filled(b.row);
    return false;
  }
  function GEOend(i){ return GEO ? GEO.effEnd[i] : 0; }

  function drawBrackets(P, S, geo, W){
    const final = S.phase !== 'build';
    const fresh = final && !S.bracketsDrawn;      // animate only at the check moment
    P.brackets.forEach(b => {
      if (!final){
        // dashed preview once the structure is checkable
        const filled = i => S.pieces[i].length > 0;
        if (b.t==='totalV' && !b.rows.every(filled)) return;
        if ((b.t==='diff' || b.t==='same') && !(filled(b.a) && filled(b.b))) return;
        if (b.t==='part' && !filled(b.row)) return;
        if (b.t==='diff' && !(geo.effEnd[b.b] > geo.effEnd[b.a] + 4)) return;
        if (b.t==='same' && Math.abs(geo.effEnd[b.a] - geo.effEnd[b.b]) > 2.5) return;
      }
      const cls = final ? 'brk' + (fresh ? ' draw' : '') : 'brk preview';
      const labCls = final && fresh ? 'brklab' : (final ? 'brklab go' : 'brklab go');
      let path = null, lab = null;

      if (b.t==='totalV'){
        const x = Math.max.apply(null, b.rows.map(i => geo.posEnd[i])) + 12;
        const y0 = geo.rowTop[b.rows[0]] - 2;
        const y1 = geo.rowTop[b.rows[b.rows.length-1]] + ROWH + 2;
        path = el('path', {d:braceV(x, y0, y1, 11), 'class':cls}, svg);
        lab = tEl(svg, x+18, (y0+y1)/2+4.5, b.label, {anchor:'start', size:13.5, mono:1, bold:1});
      } else if (b.t==='diff'){
        const xa = geo.effEnd[b.a], xb = geo.effEnd[b.b];
        const yTopA = geo.rowTop[b.a] + ROWH, yTopB = geo.rowTop[b.b];
        el('line', {x1:xa, y1:yTopA, x2:xa, y2:yTopB+ROWH, stroke:'var(--muted)',
                    'stroke-width':1.2, 'stroke-dasharray':'4 4'}, svg);
        path = el('path', {d:braceH(xa, xb, yTopB-4, 8), 'class':cls}, svg);
        lab = tEl(svg, (xa+xb)/2, yTopB-18, b.label, {size:13, mono:1, bold:1, halo:1});
      } else if (b.t==='same'){
        const x = (geo.effEnd[b.a] + geo.effEnd[b.b]) / 2;
        const y0 = geo.rowTop[b.a] - 8, y1 = geo.rowTop[b.b] + ROWH + 8;
        path = el('path', {d:'M '+x+' '+y0+' L '+x+' '+y1, 'class':cls}, svg);
        path.setAttribute('stroke-dasharray', final ? '1' : '5 4');
        if (final){ path.style.stroke = 'var(--teal)'; }
        lab = tEl(svg, x+7, y1+11, b.label,
                  {anchor:'start', size:12, italic:1, fill: final?'var(--teal)':'var(--muted)', halo:1});
      } else if (b.t==='part'){
        const cts = rowCounts(S.pieces[b.row]);
        const U = geo.U, top = geo.rowTop[b.row];
        let x0, x1;
        if (b.seg==='plain'){ x0 = X0; x1 = X0 + cts.u*U; }
        else { x0 = X0 + cts.u*U; x1 = x0 + cts.x*U; }
        if (x1 - x0 < 4) return;
        path = el('path', {d:braceH(x0, x1, top-5, 8), 'class':cls}, svg);
        lab = tEl(svg, (x0+x1)/2, top-19, b.label,
                  b.small ? {size:11, italic:1, fill:'var(--muted)', halo:1}
                          : {size:13, mono:1, bold:1, halo:1});
      }
      if (path && final && fresh){
        path.setAttribute('pathLength', 1);
        if (b.t!=='same') path.setAttribute('stroke-dasharray', '1');
        requestAnimationFrame(() => requestAnimationFrame(() => path.classList.add('go')));
      }
      if (lab){ lab.setAttribute('class', labCls);
        if (final && fresh) requestAnimationFrame(() => requestAnimationFrame(() => lab.classList.add('go')));
      }
    });
  }

  /* ── the transfer animation (P5 / P8 flagship) ────────────────── */
  function runTransfer(then){
    const P = prob();
    const from = GEO && GEO.negBox[P.transfer.from];
    const to = GEO && GEO.stubBox[P.transfer.to];
    if (REDUCED || !from || !to){ then(); return; }
    const gN = svg.querySelector('#gNeg_'+P.transfer.from);
    const gS = svg.querySelector('#gStub_'+P.transfer.to);
    if (gS) gS.setAttribute('opacity', .15);
    const fl = el('g', {}, svg);
    const r = el('rect', {x:from.x, y:from.y, width:from.w, height:from.h,
                          fill:ORANGE_F, stroke:'var(--orange)', 'stroke-width':2, rx:4}, fl);
    const t = tEl(fl, from.x+from.w/2, from.y+from.h/2+4.5, P.transfer.label,
                  {size:12, mono:1, bold:1, fill:'var(--orange)', halo:1});
    const t0 = performance.now(), DUR = 900;
    function frame(now){
      const k = clamp((now-t0)/DUR, 0, 1);
      const e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;   // easeInOutQuad
      const x = lerp(from.x, to.x, e), y = lerp(from.y, to.y, e);
      const w = lerp(from.w, to.w, e);
      r.setAttribute('x', x); r.setAttribute('y', y); r.setAttribute('width', w);
      t.setAttribute('x', x+w/2); t.setAttribute('y', y+from.h/2+4.5);
      if (k < 1){ requestAnimationFrame(frame); return; }
      if (gS) gS.setAttribute('opacity', 1);
      if (gN) gN.setAttribute('opacity', .45);
      svg.removeChild(fl);
      then();
    }
    requestAnimationFrame(frame);
  }

  /* ── solve phase ──────────────────────────────────────────────── */
  function openSolve(){
    const S = st();
    S.solveVisible = true;
    solveCard.hidden = false;
    sfeedEl.textContent = ''; sfeedEl.className = 'qfeed';
    renderSolve(true);
    if (!REDUCED) solveCard.scrollIntoView({block:'nearest', behavior:'smooth'});
  }

  // Builds the solve card from state. animate=true staggers fresh lines in.
  function renderSolve(animate){
    const P = prob(), S = st();
    if (S.phase === 'build' || !S.solveVisible){
      solveCard.hidden = true; echoEl.hidden = true; donebar.hidden = true; return;
    }
    solveCard.hidden = false;
    slinesEl.textContent = '';
    const mk = (html, cls) => {
      const d = document.createElement('div');
      d.className = 'sline' + (cls ? ' '+cls : '');
      d.innerHTML = html;
      slinesEl.appendChild(d);
      return d;
    };
    P.solve.lines.forEach((ln, i) => {
      const d = mk(esc(ln), 'dim');
      if (animate && !REDUCED){ d.style.opacity = 0; later(() => { d.style.opacity=1; d.classList.add('enter-anim'); }, 250+i*620); }
    });
    // unit line
    const uD = mk(esc(P.solve.uPre));
    if (S.uDone || S.uShown){
      const sp = document.createElement('span');
      sp.className = 'ansslot ' + (S.uShown ? 'shown' : 'okk');
      sp.textContent = fmtVal(P.unitVal, P.fmt);
      uD.appendChild(sp);
    } else {
      const b = document.createElement('button');
      b.type='button'; b.className='ansslot' + (kpTarget && kpTarget.t==='unit' ? ' active' : '');
      b.id='uSlot'; b.textContent = (kpTarget && kpTarget.t==='unit' && buf) ? buf : '?';
      b.setAttribute('aria-label','1 unit equals — opens keypad');
      b.addEventListener('click', () => { openKeypad({t:'unit'}); });
      uD.appendChild(b);
    }
    if (animate && !REDUCED){
      uD.style.opacity = 0;
      later(() => { uD.style.opacity=1; uD.classList.add('enter-anim');
                    if (!S.uDone) openKeypad({t:'unit'}); }, 250+P.solve.lines.length*620);
    } else if (animate && !S.uDone){ openKeypad({t:'unit'}); }
    // final line
    if (S.sPhase==='final' || S.sPhase==='done'){
      const fD = mk(esc(P.solve.fPre));
      if (S.sPhase==='done'){
        const sp = document.createElement('span');
        sp.className = 'ansslot ' + (S.fShown ? 'shown' : 'okk');
        sp.textContent = fmtVal(P.answer, P.fmt);
        fD.appendChild(sp);
      } else {
        const b = document.createElement('button');
        b.type='button'; b.className='ansslot' + (kpTarget && kpTarget.t==='ans' ? ' active' : '');
        b.id='fSlot'; b.textContent = (kpTarget && kpTarget.t==='ans' && buf) ? buf : '?';
        b.setAttribute('aria-label','final answer — opens keypad');
        b.addEventListener('click', () => { openKeypad({t:'ans'}); });
        fD.appendChild(b);
      }
    }
    // echo + done
    if (S.sPhase==='done'){
      echoEl.hidden = false;
      echoLine.textContent = P.echo;
      donebar.hidden = false;
      doneMsg.innerHTML = S.star
        ? '<span class="starline">★ Model right first time.</span> Solved.'
        : '✓ Solved.';
      const nxt = PROBLEMS.findIndex((p, i) => unlocked(i) && !stateFor(p).done);
      if (nxt >= 0){ nextBtn.hidden = false; nextBtn.onclick = () => selectProblem(nxt); }
      else {
        nextBtn.hidden = true;
        doneMsg.innerHTML += ' All nine drawn and solved — the bars have done their job. Algebra is waiting.';
      }
    } else { echoEl.hidden = true; donebar.hidden = true; }
  }

  function gradeEntry(v){
    const P = prob(), S = st();
    const isUnit = kpTarget.t === 'unit';
    const want = isUnit ? P.unitVal : P.answer;
    if (Math.abs(v - want) <= 0.001){
      if (isUnit){ S.uDone = true; S.sPhase = 'final'; S.sTries = 0;
        closeKeypad();
        sfeedEl.innerHTML = '✓ 1 unit = <b>' + esc(fmtVal(want, P.fmt)) + '</b>. Now finish it.';
        sfeedEl.className = 'qfeed good';
        renderSolve(false);
        later(() => openKeypad({t:'ans'}), 150);
      } else {
        S.sPhase = 'done'; S.done = true; S.sTries = 0;
        closeKeypad();
        sfeedEl.innerHTML = '✓ ' + esc(P.solve.fDone);
        sfeedEl.className = 'qfeed good';
        saveProg();
        renderChips();
        renderSolve(false);
      }
    } else {
      S.sTries++;
      buf = ''; syncKp();
      if (S.sTries === 1){
        sfeedEl.textContent = isUnit
          ? 'Not quite — read the last line again: the bracket total, minus the fixed bits, shared among the units.'
          : 'Close, but check which pieces the question asks for — count them off the picture.';
        sfeedEl.className = 'qfeed bad';
      } else {
        if (isUnit){ S.uDone = true; S.uShown = true; S.sPhase = 'final'; S.sTries = 0;
          closeKeypad();
          sfeedEl.innerHTML = 'It’s ' + esc(fmtVal(want, P.fmt)) + ' — see how the working above lands on it. On to the answer.';
          sfeedEl.className = 'qfeed bad';
          renderSolve(false);
          later(() => openKeypad({t:'ans'}), 150);
        } else {
          S.sPhase = 'done'; S.done = true; S.fShown = true; S.sTries = 0;
          closeKeypad();
          sfeedEl.innerHTML = esc(P.solve.fDone) + ' Trace it once more before moving on.';
          sfeedEl.className = 'qfeed bad';
          saveProg();
          renderChips();
          renderSolve(false);
        }
      }
    }
  }

  /* ── keypad commit ────────────────────────────────────────────── */
  function commitEntry(){
    const v = parseBuf();
    if (!kpTarget) return;
    if (kpTarget.t === 'stub'){
      if (v === null){ kpHint.textContent = 'type a number first'; return; }
      if (v === 0){ kpHint.textContent = 'a zero piece does nothing'; buf=''; syncKp(); return; }
      if (Math.abs(v) > 999){ kpHint.textContent = 'that’s bigger than the whole story'; buf=''; syncKp(); return; }
      addPiece({k:'stub', v:v});
      closeKeypad();
    } else {
      if (v === null){ sfeedEl.textContent = 'Type a number first — the keypad is waiting.'; sfeedEl.className='qfeed'; return; }
      gradeEntry(v);
    }
  }

  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && e.target.tagName === 'INPUT') return;
    if (!kpTarget) return;
    if (/^[0-9]$/.test(e.key)){ e.preventDefault(); kpPress(e.key); }
    else if (e.key === '.'){ e.preventDefault(); kpPress('.'); }
    else if (e.key === '-'){ e.preventDefault(); kpPress('±'); }
    else if (e.key === 'Enter'){ e.preventDefault(); commitEntry(); }
    else if (e.key === 'Backspace'){ e.preventDefault(); buf = buf.slice(0,-1); syncKp(); }
    else if (e.key === 'Escape'){ e.preventDefault(); closeKeypad(); if (st().phase==='build') renderSVG(); else renderSolve(false); }
  });

  /* ── chips / problem switching ────────────────────────────────── */
  function renderChips(){
    chipsEl.textContent = '';
    PROBLEMS.forEach((p, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role','tab');
      b.setAttribute('aria-selected', i===cur ? 'true' : 'false');
      const s = STATES[p.id];
      const mark = s && s.done ? (s.star ? '<span class="star">★</span>' : '<span class="tick">✓</span>') : '';
      if (!unlocked(i)){
        b.disabled = true;
        b.innerHTML = '🔒 ' + p.chip;
        b.setAttribute('aria-label', 'locked — solve the earlier problems first');
      } else {
        b.innerHTML = p.chip + mark;
      }
      if (i===cur) b.classList.add('on');
      b.addEventListener('click', () => { if (i!==cur && unlocked(i)) selectProblem(i); });
      chipsEl.appendChild(b);
    });
  }

  function selectProblem(i){
    clearTimers();
    closeKeypad();
    cur = i;
    const P = prob(), S = st();
    storyEl.innerHTML = P.story;
    bSpent.hidden = !P.spent;
    if (S.phase === 'build'){
      note(P.note);
    } else {
      note('Bars drawn, brackets on — this picture is done.', 'good');
    }
    renderAll();
  }

  function renderAll(){
    const S = st();
    const building = S.phase === 'build';
    [bUnit, bNum, bSpent, bUndo, bClear, bCheck].forEach(b => { b.disabled = !building; });
    renderChips();
    renderSVG();
    renderSolve(false);
    syncKp();
  }

  /* ── resize ───────────────────────────────────────────────────── */
  let rafPending = false;
  function onResize(){
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => { rafPending = false; renderSVG(); });
  }
  window.addEventListener('resize', onResize);
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(onResize).observe(wrap);

  /* ── go ───────────────────────────────────────────────────────── */
  loadProg();
  selectProblem(0);
})();
</script>
