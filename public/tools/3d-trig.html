<style>
  :root{
    --bg:#071016; --panel:rgba(10,22,30,.72); --line:rgba(120,220,210,.18);
    --fg:#e2f3f1; --dim:#86a4a6; --faint:#557073;

    --f-display:"Arial Narrow","Avenir Next Condensed","Roboto Condensed",system-ui,sans-serif;
    --f-body:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--fg); font-family:var(--f-body);
    background-image:radial-gradient(1200px 700px at 30% 10%, rgba(95,224,207,.07), transparent 60%);

  }
  header{padding:12px 16px 10px 16px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
  body:has(.tools-backlink) header{padding-left:118px}
  .eyebrow{font:600 10.5px/1 var(--f-display); letter-spacing:.18em; text-transform:uppercase; color:var(--amber)}
  h1{margin:0; font:700 26px/1 var(--f-display); letter-spacing:.03em; text-transform:uppercase;
     background:linear-gradient(180deg,#effffc 30%,#7fe3d6); -webkit-background-clip:text; background-clip:text; color:transparent}
  .sub{font:600 10.5px/1.4 var(--f-display); letter-spacing:.14em; text-transform:uppercase; color:var(--dim)}

  .layout{display:grid; grid-template-columns:minmax(0,1fr) minmax(330px,410px); gap:14px; padding:0 16px 18px; align-items:start}
  .figure{position:sticky; top:12px; height:calc(100vh - 78px); min-height:440px; border:1px solid var(--line);
          border-radius:12px; overflow:hidden; background:radial-gradient(80% 70% at 50% 45%, #0d1e27, #071016)}
  #cv{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
  #cv.drag{cursor:grabbing}
  .side{display:flex; flex-direction:column; gap:12px; min-width:0}

  .p{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px;
     backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); min-width:0}
  .ph{display:flex; justify-content:space-between; align-items:baseline; gap:8px;
      font:600 10.5px/1 var(--f-display); letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-bottom:10px}
  .ph em{font:400 11px var(--f-mono); letter-spacing:0; text-transform:none; color:var(--teal); font-style:normal}

  /* overlays on the figure */
  .res{position:absolute; top:10px; left:10px; padding:9px 12px; pointer-events:none; min-width:96px}
  .res .ph{margin-bottom:6px}
  .res .big{font:700 32px/1 var(--f-display); font-variant-numeric:tabular-nums; color:var(--amber)}
  .res .big.q{color:var(--dim)}
  .res .what{font:600 11px/1.3 var(--f-display); letter-spacing:.06em; color:var(--dim); margin-top:5px}
  .seg{position:absolute; top:10px; right:10px; display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:rgba(8,18,24,.8)}
  .seg button{border:none; border-radius:0; background:transparent; padding:9px 12px; min-height:38px}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--teal); color:#071016}
  .reset{position:absolute; bottom:10px; right:10px}
  .hint{position:absolute; bottom:16px; left:12px; font:600 10px/1 var(--f-display); letter-spacing:.14em; text-transform:uppercase; color:var(--faint); pointer-events:none}

         min-height:40px; -webkit-tap-highlight-color:transparent}

  button:disabled{opacity:.35; cursor:default}
  button:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--amber); outline-offset:2px}

  .try{display:flex; align-items:center; gap:8px; margin-top:10px; font-size:13px; color:var(--dim); cursor:pointer}

  ol.steps p{margin:0 0 5px; font-size:14px; line-height:1.5}
  .m{font:400 13px/1.6 var(--f-mono); color:var(--fg); overflow-wrap:anywhere; margin:4px 0 2px;
     background:rgba(255,255,255,.035); border:1px solid rgba(120,220,210,.1); border-radius:6px; padding:6px 9px}
  .ans{display:inline-block; margin-top:6px; font:700 24px/1 var(--f-display); color:var(--amber); font-variant-numeric:tabular-nums}
  .cr{color:var(--rose); font-weight:700} .ct{color:var(--teal); font-weight:700} .ca{color:var(--amber); font-weight:700}
  .cv{color:var(--violet); font-weight:700} .cs{color:var(--sky); font-weight:700}
  .tryrow{display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap}
  .tryrow input{width:110px; min-height:42px; font:500 16px var(--f-mono); color:var(--fg); background:rgba(255,255,255,.05);
                border:1px solid var(--line); border-radius:7px; padding:6px 10px; text-align:center}
  .fb{font-size:13px; line-height:1.45; margin-top:6px}
  .fb.ok{color:var(--teal)} .fb.no{color:var(--rose)}
  #allBtn{display:none; margin-top:10px; width:100%}

  .dims{display:grid; gap:10px}
  .dim{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .dim label{font:600 11px var(--f-display); letter-spacing:.12em; text-transform:uppercase; color:var(--dim)}
  .dim label span{font:700 13px var(--f-mono); letter-spacing:0; color:var(--fg); margin-right:6px}
  .stp{display:flex; align-items:center; gap:4px}
  .stp button{width:42px; padding:0; font-size:18px; letter-spacing:0}
  .stp input{width:56px; min-height:40px; text-align:center; font:600 16px var(--f-mono); color:var(--fg);
             background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:7px; -moz-appearance:textfield}
  .stp input::-webkit-inner-spin-button,.stp input::-webkit-outer-spin-button{-webkit-appearance:none; margin:0}
  .note{font:400 11.5px/1.45 var(--f-mono); color:var(--faint); margin:10px 0 0}

  @media (max-width:899px){
    header{padding-top:14px; padding-bottom:8px}
    h1{font-size:22px}
    .sub{display:none}
    .layout{grid-template-columns:minmax(0,1fr); gap:10px; padding:0 12px 22px}
    .figure{position:relative; top:auto; height:min(52vh,480px); min-height:300px}
    .res{padding:7px 10px; min-width:0}
    .res .big{font-size:24px}
    ol.steps li.past{display:none}
    ol.steps.all li.past{display:block}
    #allBtn{display:block}
    .m{font-size:12.5px}
    .dots button{width:19px}
    .nav{gap:4px}
  }
</style>

<div class="layout">

    <div class="p res" aria-live="polite"><div class="ph" id="resStep">Step 1 / 6</div><div class="big q" id="big">θ = ?</div><div class="what" id="what"></div></div>
    <div class="seg" id="solidSeg"><button data-s="cuboid">Cuboid</button><button data-s="pyramid">Pyramid</button></div>

<script>
(function(){
  "use strict";

  /*GEOM-START*/
  const ROSE='#ff7a9c', TEAL='#5fe0cf', AMBER='#ffb547', VIOLET='#b39bff', SKY='#7fc8ff', FG='#e2f3f1';
  const DEG=180/Math.PI;

  // ---- exact arithmetic: rationals and surds --------------------------------
  const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;};
  function Q(n,d){ d=d||1; if(d<0){n=-n;d=-d;} const g=gcd(n,d); return {n:n/g,d:d/g}; }
  const qadd=(a,b)=>Q(a.n*b.d+b.n*a.d,a.d*b.d);
  const qsub=(a,b)=>Q(a.n*b.d-b.n*a.d,a.d*b.d);
  const qmul=(a,b)=>Q(a.n*b.n,a.d*b.d);
  const qdiv=(a,b)=>Q(a.n*b.d,a.d*b.n);
  const qv=a=>a.n/a.d;
  const minus=s=>String(s).replace(/-/g,'−');
  const qs=a=>minus(a.d===1?String(a.n):a.n+'/'+a.d);
  function simp(m){ let k=1,r=m; for(let i=2;i*i<=r;i++){ while(r%(i*i)===0){ r/=i*i; k*=i; } } return {k:k,r:r}; }
  function sf3(x){
    if(!isFinite(x)) return '—';
    if(Math.abs(x)>=1000) return String(Math.round(x));
    const s=x.toPrecision(3);
    return s.indexOf('e')>=0 ? String(Number(s)) : s;
  }
  // exact square root of a non-negative rational: k√r / d, or a rational, or null if ugly
  function sqrtQ(q){
    if(q.n===0) return {rat:true,s:'0'};
    const t=simp(q.n*q.d); let num=t.k, den=q.d; const g=gcd(num,den); num/=g; den/=g;
    if(t.r===1) return {rat:true, s: den===1?String(num):num+'/'+den};
    if(t.r>=1000) return {rat:false, s:null};
    return {rat:false, s:(num===1?'':num)+'√'+t.r+(den>1?'/'+den:'')};
  }
  function Len(nm,sq){ const e=sqrtQ(sq); return {nm:nm, sq:sq, v:Math.sqrt(qv(sq)), rat:e.rat, ex:e.s}; }
  const dec=v=>String(+v.toFixed(4));
  function disp(x){ return x.ex!=null ? x.ex : sf3(x.v); }
  function dispP(x){ const s=disp(x); return s.indexOf('/')>=0 ? '('+s+')' : s; }
  function valForm(x){
    if(x.rat) return x.ex + (x.ex.indexOf('/')>=0 ? ' = '+dec(x.v) : '');
    return x.ex ? x.ex+' ≈ '+sf3(x.v) : '≈ '+sf3(x.v);
  }
  function rootForm(x){
    const r = x.sq.d===1 ? '√'+x.sq.n : '√('+qs(x.sq)+')';
    if(x.rat) return r+' = '+valForm(x);
    if(x.ex===r) return r+' ≈ '+sf3(x.v);
    return r+' = '+valForm(x);
  }
  function sqTerm(x){ return (x.rat && x.ex.indexOf('/')<0) ? x.ex+'²' : qs(x.sq); }
  function pyth(res,a,b){
    return [res.nm+'² = '+a.nm+'² + '+b.nm+'²',
            '&nbsp;&nbsp;&nbsp;&nbsp;= '+sqTerm(a)+' + '+sqTerm(b)+' = '+qs(res.sq),
            res.nm+' = '+rootForm(res)];
  }
  function halfLine(res,whole){ return res.nm+' = ½ × '+whole.nm+' = '+valForm(res); }
  // ratio a/b written with the lengths as found, plus the simplest exact form when it exists
  // parse an exact length "k√r/d" (any part optional) → {k,r,d}
  function parts(x){
    if(x.ex==null) return null;
    const m=x.ex.match(/^(\d*)(?:√(\d+))?(?:\/(\d+))?$/); if(!m) return null;
    return {k:m[1]?+m[1]:1, r:m[2]?+m[2]:1, d:m[3]?+m[3]:1};
  }
  function frag(k,r){ return r===1 ? String(k) : (k===1?'':k)+'√'+r; }
  // a/b with the halves cleared: (3/2)/(√601/2) → 3/√601;  8/(5√5) keeps its brackets
  function ratioStr(a,b){
    const A=parts(a), B=parts(b);
    if(!A||!B) return dispP(a)+'/'+dispP(b);
    let n=A.k*B.d, d=B.k*A.d, ra=A.r, rb=B.r;
    if(ra===1 && rb>1 && n%rb===0){ n/=rb; ra=rb; rb=1; }   // 2/√2 → √2
    const g=gcd(n,d); n/=g; d/=g;
    const top=frag(n,ra), bot=frag(d,rb);
    if(bot==='1') return top;
    return top+'/'+(/^\d+√/.test(bot)?'('+bot+')':bot);
  }
  function ratio(fn,a,b){
    const A=parts(a), B=parts(b);
    // the lengths as substituted (whole-number denominators only), then simplified
    const raw = (A&&B&&A.d===1&&B.d===1) ? frag(A.k,A.r)+'/'+(/^\d+√/.test(frag(B.k,B.r))?'('+frag(B.k,B.r)+')':frag(B.k,B.r)) : null;
    const str=ratioStr(a,b);
    const e=sqrtQ(qdiv(a.sq,b.sq));
    const simple = e.rat ? e.s : null;
    const use = simple || str;
    const chain=[]; [raw,str,simple].forEach(x=>{ if(x && chain.indexOf(x)<0) chain.push(x); });
    const line = fn+' θ = '+a.nm+'/'+b.nm+' = '+chain.join(' = ');
    return {use:use, line:line};
  }
  function trunc5(d){ const t=Math.trunc(d*1e5)/1e5; return Math.abs(t-d)<1e-12 ? String(t) : t.toFixed(5)+'…'; }
  function finalLine(fn,r,deg){ return 'θ = '+fn+'⁻¹('+r+') = '+trunc5(deg)+'° ≈ '+deg.toFixed(1)+'°'; }

  // ---- html helpers for the working ----------------------------------------
  const P_=s=>'<p>'+s+'</p>';
  const M_=lines=>'<div class="m">'+lines.join('<br>')+'</div>';
  const cr=s=>'<span class="cr">'+s+'</span>', ct=s=>'<span class="ct">'+s+'</span>',
        ca=s=>'<span class="ca">'+s+'</span>', cvv=s=>'<span class="cv">'+s+'</span>',
        cs=s=>'<span class="cs">'+s+'</span>';

  // ---- figure elements ------------------------------------------------------
  const seg=(a,b,col,o)=>Object.assign({k:'seg',p:[a,b],col:col,w:2.2},o||{});
  const poly=(pts,col,o)=>Object.assign({k:'poly',p:pts,col:col,a:.16},o||{});
  const rt=(at,a,b)=>({k:'right',at:at,a:a,b:b,col:AMBER});
  const arc=(at,a,b)=>({k:'arc',at:at,a:a,b:b,col:AMBER});

  // ---- the solids -----------------------------------------------------------
  function solidModel(kind,L,W,h){
    const P={A:[0,0,0],B:[L,0,0],C:[L,W,0],D:[0,W,0]};
    let faces, main;
    if(kind==='cuboid'){
      P.E=[0,0,h]; P.F=[L,0,h]; P.G=[L,W,h]; P.H=[0,W,h];
      faces=[['A','D','C','B'],['E','F','G','H'],['A','B','F','E'],['B','C','G','F'],['C','D','H','G'],['D','A','E','H']];
      main=['A','B','C','D','E','F','G','H'];
    } else {
      P.V=[L/2,W/2,h]; P.O=[L/2,W/2,0]; P.M=[L,W/2,0]; P.N=[L/2,0,0];
      faces=[['A','D','C','B'],['A','B','V'],['B','C','V'],['C','D','V'],['D','A','V']];
      main=['A','B','C','D','V'];
    }
    const inner=[0,0,0]; main.forEach(k=>{ for(let i=0;i<3;i++) inner[i]+=P[k][i]/main.length; });
    const F=faces.map(v=>{
      const p0=P[v[0]],p1=P[v[1]],p2=P[v[2]];
      const u=[p1[0]-p0[0],p1[1]-p0[1],p1[2]-p0[2]], w=[p2[0]-p0[0],p2[1]-p0[1],p2[2]-p0[2]];
      let n=[u[1]*w[2]-u[2]*w[1], u[2]*w[0]-u[0]*w[2], u[0]*w[1]-u[1]*w[0]];
      const c=[0,0,0]; v.forEach(k=>{ for(let i=0;i<3;i++) c[i]+=P[k][i]/v.length; });
      if(n[0]*(c[0]-inner[0])+n[1]*(c[1]-inner[1])+n[2]*(c[2]-inner[2])<0) n=n.map(x=>-x);
      const m=Math.hypot(n[0],n[1],n[2]); n=n.map(x=>x/m);
      return {v:v,n:n,d:n[0]*p0[0]+n[1]*p0[1]+n[2]*p0[2]};
    });
    const em={};
    F.forEach((f,fi)=>f.v.forEach((a,i)=>{ const b=f.v[(i+1)%f.v.length]; const key=a<b?a+b:b+a;
      (em[key]=em[key]||{a:a,b:b,f:[]}).f.push(fi); }));
    return {kind:kind,P:P,faces:F,edges:Object.keys(em).map(k=>em[k]),main:main,
            centre:[L/2,W/2,h/2], R:0.5*Math.hypot(L,W,h)};
  }

  // ---- the questions --------------------------------------------------------
  function buildQuestions(kind,L,W,h){
    const out=[];
    if(kind==='cuboid'){
      const AB=Len('AB',Q(L*L)), BC=Len('BC',Q(W*W)), CG=Len('CG',Q(h*h));

      { // 1. AG and the base
        const AC=Len('AC',qadd(AB.sq,BC.sq)); const r=ratio('tan',CG,AC); const deg=Math.atan2(CG.v,AC.v)*DEG;
        out.push({id:'ag-base', label:'Diagonal AG and the base ABCD',
          title:'Find the angle between the diagonal '+cr('AG')+' and the base '+ct('ABCD')+'.',
          why:'The projection of AG onto the base is AC, so the angle sits between AG and AC.',
          els:{plane:poly(['A','B','C','D'],TEAL), aux:poly(['A','B','C'],SKY,{a:.2}), tri:poly(['A','C','G'],AMBER,{a:.24}),
            line:seg('A','G',ROSE,{w:3}), perp:seg('G','C',VIOLET,{w:2.6}), proj:seg('A','C',TEAL,{w:3}),
            sAB:seg('A','B',SKY,{tag:AB.ex}), sBC:seg('B','C',SKY,{tag:BC.ex}),
            tAC:seg('A','C',TEAL,{w:3,tag:disp(AC)}), tCG:seg('C','G',VIOLET,{w:3,tag:CG.ex}),
            right:rt('C','A','G'), arc:arc('A','C','G')},
          steps:[
            {h:'The question', add:['line','plane'], emph:['line','plane'],
             html:P_('We want the angle between the line '+cr('AG')+' and the plane '+ct('ABCD')+'.')},
            {h:'Find the projection', add:['perp','proj'], emph:['perp','proj','line'],
             html:P_('G is vertically above C — '+cvv('GC')+' is perpendicular to the base. So the projection of AG onto the base is '+ct('AC')+'.')},
            {h:'The right-angled triangle', add:['tri','right','arc'], emph:['tri','right','arc','line','proj'],
             html:P_('The angle is θ = ∠GAC. It sits in triangle '+ca('ACG')+', right-angled at C.')},
            {h:'Pythagoras for AC', add:['aux','sAB','sBC'], emph:['aux','sAB','sBC','proj'],
             html:P_('AC is a diagonal of the base, so use triangle '+cs('ABC')+':')+M_(pyth(AC,AB,BC))},
            {h:'Choose the ratio', add:['tAC','tCG'], hide:['aux','sAB','sBC'], emph:['tAC','tCG','arc'],
             html:P_('Opposite θ: '+cvv('CG = '+h)+'. Adjacent to θ: '+ct('AC')+'. Opposite and adjacent → tan.')+M_([r.line])},
            {h:'The angle', emph:['tri','arc','right','line','proj'], final:{fn:'tan',r:r.use,deg:deg}}
          ], ans:{deg:deg,name:'∠GAC'}});
      }

      { // 2. AG and the face ADHE
        const AD=Len('AD',Q(W*W)), DH=Len('DH',Q(h*h)), AH=Len('AH',Q(W*W+h*h)), HG=Len('HG',Q(L*L));
        const r=ratio('tan',HG,AH); const deg=Math.atan2(HG.v,AH.v)*DEG;
        out.push({id:'ag-side', label:'Diagonal AG and the face ADHE', view:[0.62,0.36],
          title:'Find the angle between the diagonal '+cr('AG')+' and the face '+ct('ADHE')+'.',
          why:'G drops straight onto H in face ADHE, so the projection of AG is AH and the angle sits between AG and AH.',
          els:{plane:poly(['A','D','H','E'],TEAL), aux:poly(['A','D','H'],SKY,{a:.2}), tri:poly(['A','H','G'],AMBER,{a:.24}),
            line:seg('A','G',ROSE,{w:3}), perp:seg('G','H',VIOLET,{w:2.6}), proj:seg('A','H',TEAL,{w:3}),
            sAD:seg('A','D',SKY,{tag:AD.ex}), sDH:seg('D','H',SKY,{tag:DH.ex}),
            tAH:seg('A','H',TEAL,{w:3,tag:disp(AH)}), tHG:seg('H','G',VIOLET,{w:3,tag:HG.ex}),
            right:rt('H','A','G'), arc:arc('A','H','G')},
          steps:[
            {h:'The question', add:['line','plane'], emph:['line','plane'],
             html:P_('We want the angle between the line '+cr('AG')+' and the face '+ct('ADHE')+' — a side face, not the base.')},
            {h:'Find the projection', add:['perp','proj'], emph:['perp','proj','line'],
             html:P_(cvv('GH')+' is parallel to AB, so it is perpendicular to face ADHE. The perpendicular from G lands on H, so the projection of AG onto the face is '+ct('AH')+'.')},
            {h:'The right-angled triangle', add:['tri','right','arc'], emph:['tri','right','arc','line','proj'],
             html:P_('The angle is θ = ∠GAH. It sits in triangle '+ca('AHG')+', right-angled at H.')},
            {h:'Pythagoras for AH', add:['aux','sAD','sDH'], emph:['aux','sAD','sDH','proj'],
             html:P_('AH is a diagonal of face ADHE, so use triangle '+cs('ADH')+':')+M_(pyth(AH,AD,DH))},
            {h:'Choose the ratio', add:['tAH','tHG'], hide:['aux','sAD','sDH'], emph:['tAH','tHG','arc'],
             html:P_('Opposite θ: '+cvv('HG = '+L)+' (it equals AB). Adjacent to θ: '+ct('AH')+'. Opposite and adjacent → tan.')+M_([r.line])},
            {h:'The angle', emph:['tri','arc','right','line','proj'], final:{fn:'tan',r:r.use,deg:deg}}
          ], ans:{deg:deg,name:'∠GAH'}});
      }

      { // 3. plane ABGH and the base
        const r=ratio('tan',CG,BC); const deg=Math.atan2(CG.v,BC.v)*DEG;
        out.push({id:'abgh-base', label:'Plane ABGH and the base ABCD',
          title:'Find the angle between the plane '+cr('ABGH')+' and the base '+ct('ABCD')+'.',
          why:'Both planes contain AB, and BC and BG are each perpendicular to AB — so the angle between the planes is ∠GBC.',
          els:{plane:poly(['A','B','C','D'],TEAL), plane2:poly(['A','B','G','H'],ROSE,{a:.15}), tri:poly(['B','C','G'],AMBER,{a:.26}),
            common:seg('A','B',FG,{w:3.2}), pBC:seg('B','C',TEAL,{w:3}), pBG:seg('B','G',ROSE,{w:3}),
            tBC:seg('B','C',TEAL,{w:3,tag:BC.ex}), tCG:seg('C','G',VIOLET,{w:3,tag:CG.ex}),
            right:rt('C','B','G'), arc:arc('B','C','G')},
          steps:[
            {h:'The question', add:['plane2','plane'], emph:['plane2','plane'],
             html:P_('Two planes this time: the sloping plane '+cr('ABGH')+' and the base '+ct('ABCD')+'.')},
            {h:'Where they meet', add:['common'], emph:['common'],
             html:P_('Both planes contain the edge '+ca('AB')+' — that is the line they meet along.')},
            {h:'One perpendicular in each plane', add:['pBC','pBG'], emph:['pBC','pBG','common'],
             html:P_('In the base, '+ct('BC')+' ⊥ AB. In plane ABGH, '+cr('BG')+' ⊥ AB. The angle between the planes is the angle between these two lines: θ = ∠GBC.')},
            {h:'The right-angled triangle', add:['tri','right','arc'], emph:['tri','right','arc','pBC','pBG'],
             html:P_('Triangle '+ca('BCG')+' is right-angled at C, because CG is vertical.')},
            {h:'Choose the ratio', add:['tBC','tCG'], emph:['tBC','tCG','arc'],
             html:P_('Opposite θ: '+cvv('CG = '+h)+'. Adjacent to θ: '+ct('BC = '+W)+'. No Pythagoras needed.')+M_([r.line])},
            {h:'The angle', emph:['tri','arc','right','pBC','pBG'], final:{fn:'tan',r:r.use,deg:deg}}
          ], ans:{deg:deg,name:'∠GBC'}});
      }

      { // 4. angle of elevation of G from D
        const DC=Len('DC',Q(L*L)); const r=ratio('tan',CG,DC); const deg=Math.atan2(CG.v,DC.v)*DEG;
        out.push({id:'elev-dg', label:'Angle of elevation of G from D',
          title:'Find the angle of elevation of '+cr('G')+' from '+cr('D')+'.',
          why:'An angle of elevation is measured up from the horizontal, and DC is the horizontal line directly beneath DG.',
          els:{plane:poly(['A','B','C','D'],TEAL), tri:poly(['D','C','G'],AMBER,{a:.26}),
            line:seg('D','G',ROSE,{w:3}), perp:seg('G','C',VIOLET,{w:2.6}), proj:seg('D','C',TEAL,{w:3}),
            tDC:seg('D','C',TEAL,{w:3,tag:DC.ex}), tCG:seg('C','G',VIOLET,{w:3,tag:CG.ex}),
            right:rt('C','D','G'), arc:arc('D','C','G')},
          steps:[
            {h:'The question', add:['line','plane'], emph:['line','plane'],
             html:P_('Looking from D up to G along '+cr('DG')+'. Elevation is measured from the horizontal — the base '+ct('ABCD')+'.')},
            {h:'The horizontal under DG', add:['perp','proj'], emph:['perp','proj','line'],
             html:P_('G is vertically above C, so the horizontal line directly under DG is '+ct('DC')+'.')},
            {h:'The right-angled triangle', add:['tri','right','arc'], emph:['tri','right','arc','line','proj'],
             html:P_('The angle of elevation is θ = ∠GDC, in triangle '+ca('DCG')+', right-angled at C.')},
            {h:'Choose the ratio', add:['tDC','tCG'], emph:['tDC','tCG','arc'],
             html:P_('Opposite θ: '+cvv('CG = '+h)+'. Adjacent to θ: '+ct('DC = '+L)+' (it equals AB).')+M_([r.line])},
            {h:'The angle', emph:['tri','arc','right','line','proj'], final:{fn:'tan',r:r.use,deg:deg}}
          ], ans:{deg:deg,name:'∠GDC'}});
      }

      { // 5. angle GAB (between AG and AB)
        const BG=Len('BG',Q(W*W+h*h)), AG=Len('AG',Q(L*L+W*W+h*h));
        const r=ratio('cos',AB,AG); const deg=Math.acos(AB.v/AG.v)*DEG;
        out.push({id:'gab', label:'Angle between AG and the edge AB',
          title:'Find ∠GAB, the angle between the diagonal '+cr('AG')+' and the edge '+cs('AB')+'.',
          why:'AB is perpendicular to the whole face BCGF, so triangle ABG has its right angle at B.',
          els:{plane:poly(['B','C','G','F'],TEAL,{a:.13}), aux:poly(['B','C','G'],SKY,{a:.2}), tri:poly(['A','B','G'],AMBER,{a:.24}),
            line:seg('A','G',ROSE,{w:3}), line2:seg('A','B',SKY,{w:3}), pBG:seg('B','G',TEAL,{w:2.6}),
            sBC:seg('B','C',SKY,{tag:BC.ex}), sCG:seg('C','G',SKY,{tag:CG.ex}),
            tBG:seg('B','G',TEAL,{w:3,tag:disp(BG)}), tAB:seg('A','B',SKY,{w:3,tag:AB.ex}), tAG:seg('A','G',ROSE,{w:3,tag:disp(AG)}),
            right:rt('B','A','G'), arc:arc('A','B','G')},
          steps:[
            {h:'The question', add:['line','line2'], emph:['line','line2'],
             html:P_('Two lines that meet at A: the diagonal '+cr('AG')+' and the edge '+cs('AB')+'. We want θ = ∠GAB.')},
            {h:'Where is the right angle?', add:['plane','pBG','tri','right','arc'], emph:['plane','pBG','tri','right'],
             html:P_('AB is perpendicular to the whole face '+ct('BCGF')+', so it is perpendicular to every line in it — including BG. Triangle '+ca('ABG')+' is right-angled at B.')},
            {h:'Pythagoras for BG', add:['aux','sBC','sCG'], hide:['plane'], emph:['aux','sBC','sCG','pBG'],
             html:P_('BG is a diagonal of face BCGF — use triangle '+cs('BCG')+':')+M_(pyth(BG,BC,CG))},
            {h:'Pythagoras for AG', add:['tBG','tAB','tAG'], hide:['aux','sBC','sCG','pBG'], emph:['tBG','tAB','tAG','right'],
             html:P_('Now in triangle ABG, right-angled at B:')+M_(pyth(AG,AB,BG))},
            {h:'Choose the ratio', emph:['tAB','tAG','arc'],
             html:P_('Adjacent to θ: '+cs('AB = '+L)+'. Hypotenuse: '+cr('AG')+'. Adjacent and hypotenuse → cos.')+M_([r.line])},
            {h:'The angle', emph:['tri','arc','right','line','line2'], final:{fn:'cos',r:r.use,deg:deg}}
          ], ans:{deg:deg,name:'∠GAB'}});
      }
    } else {
      const AB=Len('AB',Q(L*L)), BC=Len('BC',Q(W*W)), VO=Len('VO',Q(h*h));
      const AC=Len('AC',Q(L*L+W*W)), OA=Len('OA',Q(L*L+W*W,4)), VA=Len('VA',qadd(Q(L*L+W*W,4),Q(h*h)));

      { // 1. VA and the base
        const r=ratio('tan',VO,OA); const deg=Math.atan2(VO.v,OA.v)*DEG;
        out.push({id:'va-base', label:'Edge VA and the base ABCD',
          title:'Find the angle between the slant edge '+cr('VA')+' and the base '+ct('ABCD')+'.',
          why:'V is directly above O, so the projection of VA onto the base is AO and the angle sits between VA and AO.',
          els:{plane:poly(['A','B','C','D'],TEAL), aux:poly(['A','B','C'],SKY,{a:.18}), tri:poly(['A','O','V'],AMBER,{a:.26}),
            diag:seg('A','C',SKY,{w:1.6}), line:seg('V','A',ROSE,{w:3}), perp:seg('V','O',VIOLET,{w:2.4,dash:1}), proj:seg('A','O',TEAL,{w:3}),
            sAB:seg('A','B',SKY,{tag:AB.ex}), sBC:seg('B','C',SKY,{tag:BC.ex}),
            tOA:seg('A','O',TEAL,{w:3,tag:disp(OA)}), tVO:seg('V','O',VIOLET,{w:3,tag:VO.ex}),
            right:rt('O','A','V'), arc:arc('A','O','V')},
          steps:[
            {h:'The question', add:['line','plane'], emph:['line','plane'],
             html:P_('We want the angle between the slant edge '+cr('VA')+' and the base '+ct('ABCD')+'.')},
            {h:'Find the projection', add:['perp','proj'], emph:['perp','proj','line'],
             html:P_('In a right pyramid V is directly above O, the centre of the base — '+cvv('VO')+' is vertical. So the projection of VA onto the base is '+ct('AO')+'.')},
            {h:'The right-angled triangle', add:['tri','right','arc'], emph:['tri','right','arc','line','proj'],
             html:P_('The angle is θ = ∠VAO, in triangle '+ca('VOA')+', right-angled at O.')},
            {h:'Pythagoras, then halve', add:['aux','diag','sAB','sBC'], emph:['aux','diag','sAB','sBC','proj'],
             html:P_('O is the midpoint of the diagonal AC. Find AC from triangle '+cs('ABC')+', then halve it:')+M_(pyth(AC,AB,BC).concat([halfLine(OA,AC)]))},
            {h:'Choose the ratio', add:['tOA','tVO'], hide:['aux','diag','sAB','sBC'], emph:['tOA','tVO','arc'],
             html:P_('Opposite θ: '+cvv('VO = '+h)+'. Adjacent to θ: '+ct('OA')+'. Opposite and adjacent → tan.')+M_([r.line])},
            {h:'The angle', emph:['tri','arc','right','line','proj'], final:{fn:'tan',r:r.use,deg:deg}}
          ], ans:{deg:deg,name:'∠VAO'}});
      }

      // 2 & 3. a sloping face and the base (M = midpoint of BC, N = midpoint of AB)
      [{F:['V','B','C'],e:['B','C'],mid:'M',edge:'BC',par:AB,parNm:'AB',val:L,id:'vbc-base'},
       {F:['V','A','B'],e:['A','B'],mid:'N',edge:'AB',par:BC,parNm:'BC',val:W,id:'vab-base'}].forEach(c=>{
        const OX=Len('O'+c.mid,Q(c.val*c.val,4)); const r=ratio('tan',VO,OX); const deg=Math.atan2(VO.v,OX.v)*DEG;
        const fname='V'+c.edge, X=c.mid;
        const parSeg = c.parNm==='AB' ? seg('A','B',SKY,{w:2.6,tag:AB.ex}) : seg('B','C',SKY,{w:2.6,tag:BC.ex});
        out.push({id:c.id, label:'Face '+fname+' and the base ABCD',
          title:'Find the angle between the face '+cr(fname)+' and the base '+ct('ABCD')+'.',
          why:'The faces meet along '+c.edge+'; '+X+' (the midpoint of '+c.edge+') gives a line perpendicular to '+c.edge+' in each face, so the angle is ∠V'+X+'O.',
          els:{plane:poly(['A','B','C','D'],TEAL), plane2:poly(c.F,ROSE,{a:.16}), tri:poly(['O',X,'V'],AMBER,{a:.28}),
            common:seg(c.e[0],c.e[1],FG,{w:3.2}), pOX:seg('O',X,TEAL,{w:3}), pVX:seg('V',X,ROSE,{w:3}),
            perp:seg('V','O',VIOLET,{w:2.4,dash:1}), par:parSeg,
            tOX:seg('O',X,TEAL,{w:3,tag:disp(OX)}), tVO:seg('V','O',VIOLET,{w:3,tag:VO.ex}),
            right:rt('O',X,'V'), arc:arc(X,'O','V')},
          steps:[
            {h:'The question', add:['plane2','plane'], emph:['plane2','plane'],
             html:P_('Two planes: the sloping face '+cr(fname)+' and the base '+ct('ABCD')+'.')},
            {h:'Where they meet', add:['common'], emph:['common'],
             html:P_('The face meets the base along the edge '+ca(c.edge)+'.')},
            {h:'One perpendicular in each plane', add:['pOX','pVX'], emph:['pOX','pVX','common'],
             html:P_('Let '+X+' be the midpoint of '+c.edge+'. V'+c.e[0]+' = V'+c.e[1]+', so the face is isosceles and '+cr('V'+X)+' ⊥ '+c.edge+'. In the base, '+ct('O'+X)+' ⊥ '+c.edge+'. The angle between the planes is θ = ∠V'+X+'O.')},
            {h:'The right-angled triangle', add:['perp','tri','right','arc'], emph:['tri','right','arc','perp'],
             html:P_('VO is vertical, so triangle '+ca('VO'+X)+' is right-angled at O.')},
            {h:'Length O'+X, add:['par','tOX'], emph:['par','tOX'],
             html:P_('O'+X+' runs parallel to '+c.parNm+' and is half as long:')+M_([OX.nm+' = ½ × '+c.parNm+' = ½ × '+c.val+' = '+valForm(OX)])},
            {h:'Choose the ratio', add:['tVO'], hide:['par'], emph:['tVO','tOX','arc'],
             html:P_('Opposite θ: '+cvv('VO = '+h)+'. Adjacent to θ: '+ct('O'+X)+'.')+M_([r.line])},
            {h:'The angle', emph:['tri','arc','right','pVX','pOX'], final:{fn:'tan',r:r.use,deg:deg}}
          ], ans:{deg:deg,name:'∠V'+X+'O'}});
      });

      { // 4. angle AVC — cosine rule
        const cq=qdiv(qsub(qadd(VA.sq,VA.sq),AC.sq),qmul(Q(2),VA.sq)); const deg=Math.acos(qv(cq))*DEG;
        out.push({id:'avc', label:'Angle AVC between VA and VC',
          title:'Find ∠AVC, the angle between the slant edges '+cr('VA')+' and '+cr('VC')+'.',
          why:'Triangle VAC is not right-angled, so find all three sides first and use the cosine rule.',
          els:{aux:poly(['A','B','C'],SKY,{a:.18}), aux2:poly(['V','O','A'],SKY,{a:.2}), tri:poly(['V','A','C'],AMBER,{a:.22}),
            l1:seg('V','A',ROSE,{w:3}), l2:seg('V','C',ROSE,{w:3}), diag:seg('A','C',TEAL,{w:3,tag:disp(AC)}),
            sAB:seg('A','B',SKY,{tag:AB.ex}), sBC:seg('B','C',SKY,{tag:BC.ex}),
            perp:seg('V','O',VIOLET,{w:2.4,dash:1}), tVO:seg('V','O',VIOLET,{w:2.6,tag:VO.ex}), tOA:seg('O','A',TEAL,{w:2.6,tag:disp(OA)}),
            tVA:seg('V','A',ROSE,{w:3,tag:disp(VA)}), tVC:seg('V','C',ROSE,{w:3,tag:disp(VA)}),
            right:rt('O','A','V'), arc:arc('V','A','C')},
          steps:[
            {h:'The question', add:['l1','l2'], emph:['l1','l2'],
             html:P_('Two slant edges meeting at V: '+cr('VA')+' and '+cr('VC')+'. We want θ = ∠AVC.')},
            {h:'The triangle', add:['tri','arc','diag'], emph:['tri','arc'],
             html:P_('θ sits in triangle '+ca('VAC')+'. It is <em>not</em> right-angled, so we need the cosine rule — and for that, all three sides.')},
            {h:'Pythagoras for AC', add:['aux','sAB','sBC'], emph:['aux','sAB','sBC','diag'],
             html:P_('AC is the diagonal of the base — use triangle '+cs('ABC')+':')+M_(pyth(AC,AB,BC))},
            {h:'Pythagoras for VA', add:['perp','aux2','right','tOA','tVO'], hide:['aux','sAB','sBC'], emph:['aux2','right','tOA','tVO'],
             html:P_('O is the midpoint of AC and VO is vertical, so use triangle '+cs('VOA')+', right-angled at O:')+M_([halfLine(OA,AC)].concat(pyth(VA,OA,VO)))+P_('V is above the centre, so all four slant edges are equal: VC = VA.')},
            {h:'Cosine rule', add:['tVA','tVC'], hide:['perp','aux2','right','tOA','tVO'], emph:['tVA','tVC','diag','arc'],
             html:M_(['cos θ = (VA² + VC² − AC²) / (2 × VA × VC)',
                      '&nbsp;&nbsp;&nbsp;&nbsp;= ('+qs(VA.sq)+' + '+qs(VA.sq)+' − '+qs(AC.sq)+') / (2 × '+qs(VA.sq)+')',
                      '&nbsp;&nbsp;&nbsp;&nbsp;= '+qs(cq)])+P_('VA × VC = VA² = '+qs(VA.sq)+', because the two edges are equal.')},
            {h:'The angle', emph:['tri','arc','l1','l2'], final:{fn:'cos',r:qs(cq),deg:deg}}
          ], ans:{deg:deg,name:'∠AVC'}});
      }

      { // 5. angle VAB
        const AN=Len('AN',Q(L*L,4)); const r=ratio('cos',AN,VA); const deg=Math.acos(AN.v/VA.v)*DEG;
        out.push({id:'vab', label:'Angle VAB between VA and AB',
          title:'Find ∠VAB, the angle between the slant edge '+cr('VA')+' and the base edge '+cs('AB')+'.',
          why:'VA = VB, so the line from V to the midpoint N of AB is perpendicular to AB — triangle VNA has its right angle at N.',
          els:{plane:poly(['V','A','B'],TEAL,{a:.12}), aux2:poly(['V','O','A'],SKY,{a:.2}), tri:poly(['A','N','V'],AMBER,{a:.26}),
            l1:seg('V','A',ROSE,{w:3}), l2:seg('A','B',SKY,{w:3}), pVN:seg('V','N',VIOLET,{w:2.4}),
            diag:seg('A','C',SKY,{w:1.6}), perp:seg('V','O',VIOLET,{w:2.4,dash:1}),
            tAN:seg('A','N',TEAL,{w:3,tag:disp(AN)}), tVA:seg('V','A',ROSE,{w:3,tag:disp(VA)}),
            right:rt('N','A','V'), right2:rt('O','A','V'), arc:arc('A','N','V')},
          steps:[
            {h:'The question', add:['l1','l2'], emph:['l1','l2'],
             html:P_('Two lines meeting at A: the slant edge '+cr('VA')+' and the base edge '+cs('AB')+'. We want θ = ∠VAB.')},
            {h:'Where is the right angle?', add:['plane','pVN','tri','right','arc'], emph:['pVN','tri','right','arc'],
             html:P_('Let N be the midpoint of AB. VA = VB, so face VAB is isosceles and '+cvv('VN')+' ⊥ AB. Triangle '+ca('VNA')+' is right-angled at N.')},
            {h:'Pythagoras for VA', add:['diag','perp','aux2','right2'], hide:['plane'], emph:['diag','perp','aux2','right2'],
             html:P_('VA comes from triangle '+cs('VOA')+' (right-angled at O), and OA is half the diagonal AC:')+M_(pyth(AC,AB,BC).concat([halfLine(OA,AC)]).concat(pyth(VA,OA,VO)))},
            {h:'Choose the ratio', add:['tAN','tVA'], hide:['diag','perp','aux2','right2'], emph:['tAN','tVA','arc'],

  // ---- canvas sizing & projection -------------------------------------------

  // ---- drawing --------------------------------------------------------------

  function draw(){

    const P=model.P, sp={};
    Object.keys(P).forEach(k=>sp[k]=S(P[k]));

    const alphaOf=name=>{ let a=(emph.size && !emph.has(name)) ? 0.4 : 1; if(newSet.has(name)) a*=fadeK; return a; };

      ctx.beginPath(); f.v.forEach((k,i)=>{ const s=sp[k]; i?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y); }); ctx.closePath();
      ctx.fillStyle='rgba(120,220,210,.035)'; ctx.fill(); });

      ctx.fillStyle=rgba(e.col, e.a*(emph.size&&!emph.has(n)?0.55:1)*(newSet.has(n)?fadeK:1)); ctx.fill();

    ctx.lineCap='round';
    ctx.setLineDash([5,5]); ctx.strokeStyle='rgba(134,164,166,.55)'; ctx.lineWidth=1.3;

    ctx.setLineDash([]); ctx.strokeStyle='rgba(214,240,236,.82)'; ctx.lineWidth=1.7;

      const a=alphaOf(n); if(a<=0) return;
      const at=P[e.at], va=sub3(P[e.a],at), vb=sub3(P[e.b],at);
      const u1=unit3(va), u2=unit3(vb), lim=0.35*Math.min(len3(va),len3(vb));

        ctx.beginPath();
        for(let i=0;i<=N;i++){ const t=th*i/N; const p=S(add3(at,add3(mul3(u1,r*Math.cos(t)),mul3(w,r*Math.sin(t))))); i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); }

    const overlaps=(b,c)=>!(b.x+b.w<=c.x||c.x+c.w<=b.x||b.y+b.h<=c.y||c.y+c.h<=b.y);

    ctx.font=LF;

    order.forEach(k=>{ const s=sp[k];

      const w=ctx.measureText(k).width+9;

  }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

         '<div class="tryrow"><input id="guess" inputmode="decimal" autocomplete="off" placeholder="θ in °" value="'+st.guess.replace(/"/g,'')+'"><button class="prime" id="check">Check</button></div>'+

  function render(){

    sel.value=String(st.qi[st.kind]);
    $('qCount').textContent=(st.qi[st.kind]+1)+' of '+qlist.length;
    $('qTitle').innerHTML=q.title;
    $('why').innerHTML='<b>Why this triangle</b>'+q.why;
    document.querySelectorAll('#solidSeg button').forEach(b=>b.classList.toggle('on',b.dataset.s===st.kind));
    // dots

  function checkGuess(raw){

  function selectQuestion(i){

  // ---- dimension steppers ---------------------------------------------------
  const DIMLAB={cuboid:[['L','AB','length'],['W','BC','width'],['h','AE','height']],

  function buildDims(){
    $('solidName').textContent=st.kind==='cuboid'?'cuboid ABCDEFGH':'right pyramid VABCD';
    $('dims').innerHTML=DIMLAB[st.kind].map(([k,nm,word])=>
      '<div class="dim"><label for="d_'+k+'"><span>'+nm+'</span>'+word+'</label><div class="stp">'+
      '<button data-k="'+k+'" data-d="-1" aria-label="Decrease '+nm+'">−</button>'+
      '<input id="d_'+k+'" data-k="'+k+'" type="number" inputmode="numeric" min="1" max="30" step="1" value="'+st.dims[st.kind][k]+'">'+
      '<button data-k="'+k+'" data-d="1" aria-label="Increase '+nm+'">+</button></div></div>').join('');
  }
  function setDim(k,v){

    v=Math.max(1,Math.min(30,v));
    st.dims[st.kind][k]=v; const inp=$('d_'+k); if(inp) inp.value=v;
    rebuild(true); newSet=new Set(); render(); draw();
  }
  $('dims').addEventListener('click',e=>{ const b=e.target.closest('button[data-k]'); if(!b) return;
    setDim(b.dataset.k, st.dims[st.kind][b.dataset.k]+Number(b.dataset.d)); });
  $('dims').addEventListener('change',e=>{ const i=e.target.closest('input[data-k]'); if(i) setDim(i.dataset.k,i.value); });

  // ---- wiring ---------------------------------------------------------------
  $('solidSeg').addEventListener('click',e=>{ const b=e.target.closest('button[data-s]'); if(!b||b.dataset.s===st.kind) return;
    stopPlay(); st.kind=b.dataset.s; rebuild(false); buildDims(); selectQuestion(st.qi[st.kind]); });
  $('qSel').addEventListener('change',e=>selectQuestion(Number(e.target.value)));
  $('prev').addEventListener('click',()=>goStep(st.step-1));
  $('next').addEventListener('click',()=>goStep(st.step+1));
  $('play').addEventListener('click',play);
  $('dots').addEventListener('click',e=>{ const b=e.target.closest('button[data-i]'); if(b) goStep(Number(b.dataset.i)); });
  $('tryIt').addEventListener('change',e=>{ st.tryIt=e.target.checked; st.solved=false; st.fb=''; render(); draw(); });
  $('allBtn').addEventListener('click',()=>{ const ol=$('steps'); const on=!ol.classList.contains('all'); ol.classList.toggle('all',on);
    $('allBtn').textContent=on?'Hide earlier steps':'Show earlier steps'; });
  $('resetView').addEventListener('click',()=>viewTo(q.view||VIEW0[st.kind]));
  document.addEventListener('keydown',e=>{
    const t=e.target; if(t && (t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA')) return;
    if(e.key==='ArrowRight'){ goStep(st.step+1); e.preventDefault(); }
    else if(e.key==='ArrowLeft'){ goStep(st.step-1); e.preventDefault(); }
  });

  // orbit by dragging
  let drag=null;
  cv.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    tween=null; drag={id:e.pointerId,x:e.clientX,y:e.clientY,az:st.az,el:st.el};
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    cv.classList.add('drag'); $('hint').style.opacity='0';
  });
  cv.addEventListener('pointermove',e=>{
    if(!drag || e.pointerId!==drag.id) return;
    st.az=drag.az+(e.clientX-drag.x)*0.009;
    st.el=Math.max(-1.45,Math.min(1.45,drag.el+(e.clientY-drag.y)*0.009));
    if(!raf) raf=requestAnimationFrame(frame);
  });
  const endDrag=e=>{ if(drag && e.pointerId===drag.id){ drag=null; cv.classList.remove('drag'); draw(); } };
  cv.addEventListener('pointerup',endDrag);
  cv.addEventListener('pointercancel',endDrag);

  if(window.ResizeObserver) new ResizeObserver(()=>resize()).observe(fig);
  window.addEventListener('resize',resize);

  // ---- start ----------------------------------------------------------------
  rebuild(false); buildDims();
  newSet=new Set(shownAt(0)); fadeT0=performance.now();
  render(); resize(); schedule();
})();
</script>
</body>
</html>
