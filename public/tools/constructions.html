<style>
  :root{
    --bg:#F8FAFC; --ink:#142033; --muted:#5A6B80;
    --rose:#B04A62; --teal:#1F6F84; --orange:#C85A2E; --plum:#6B4E9C;
    --grid:#E3E9F1; --line:#AEBDCE;
    --panel:#FFFFFF; --panelb:#DDE3EC;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Georgia","Times New Roman",serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh;
  }
  header{padding:16px 20px 6px 116px}
  h1{font-size:19px; font-weight:600; margin:0; letter-spacing:.2px}
  .sub{font-size:13px; color:var(--muted); margin-top:3px; max-width:76ch}

  button{
    font:inherit; font-size:13px; color:var(--ink); background:var(--panel);
    border:1px solid var(--panelb); border-radius:8px; padding:7px 13px; cursor:pointer;
  }
  button:hover{border-color:var(--muted)}
  button:focus-visible{outline:2px solid var(--orange); outline-offset:1px}
  button:disabled{opacity:.4; cursor:default}
  button:disabled:hover{border-color:var(--panelb)}
  .seg{display:inline-flex; flex-wrap:wrap; border:1px solid var(--panelb); border-radius:8px; overflow:hidden}
  .seg button{border:none; border-right:1px solid var(--panelb); border-radius:0; background:var(--panel); min-height:38px}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--ink); color:var(--bg)}
  .seg.mode button.on{background:var(--orange); color:#fff}
  .seg.small button{font-size:12px; padding:6px 10px; min-height:34px}

  .picker{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:8px 18px 0}

  .stage{position:relative; flex:1 1 auto; min-height:320px}
  canvas{display:block; width:100%; height:100%; touch-action:none; cursor:default}
  canvas.grabbable{cursor:grab}
  canvas.dragging{cursor:grabbing}

  .badge{
    position:absolute; top:12px; right:12px; max-width:min(46vw,320px);
    background:rgba(255,255,255,.94); border:1px solid var(--panelb);
    border-left:3px solid var(--teal); border-radius:10px; padding:8px 11px;
    font-size:12.5px; line-height:1.5; color:var(--ink);
    transition:opacity .3s; pointer-events:none;
  }
  .badge.off{opacity:0}
  .badge.warn{border-left-color:var(--rose); color:var(--rose)}
  /* on narrow screens the badge is moved out of the stage (see placeBadge) so
     it stops covering the drawing */
  .badge.inflow{position:static; max-width:none; margin:10px 14px 2px; background:var(--panel)}
  .badge b{font-weight:700}
  .hint{position:absolute; bottom:8px; right:12px; font-size:11.5px; color:var(--muted);
        font-family:ui-monospace,monospace; text-align:right; pointer-events:none}

  /* ---- video transport ---- */
  .lessonbar{border-top:1px solid var(--line); background:var(--bg)}
  .transport{display:flex; align-items:center; gap:10px; padding:10px 18px 0; flex-wrap:wrap}
  .play{
    width:44px; height:44px; min-width:44px; border-radius:50%; padding:0;
    background:var(--ink); color:var(--bg); border-color:var(--ink);
    font-size:15px; line-height:1; display:inline-flex; align-items:center; justify-content:center;
  }
  .play:hover{background:#000}
  .round{width:38px; height:38px; min-width:38px; border-radius:50%; padding:0; font-size:15px;
         display:inline-flex; align-items:center; justify-content:center}
  .scrubwrap{flex:1 1 220px; min-width:150px; display:flex; align-items:center}
  input[type=range]{accent-color:var(--orange); cursor:pointer; width:100%; min-height:32px}
  .tlbl{font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace; font-size:12px;
        color:var(--muted); min-width:88px; text-align:right}

  .chapters{display:flex; gap:7px; flex-wrap:wrap; padding:9px 18px 0}
  .chap{
    font-size:11.5px; padding:5px 10px; border-radius:999px; min-height:30px;
    background:var(--panel); border:1px solid var(--panelb); color:var(--muted);
  }
  .chap .n{font-family:ui-monospace,monospace; margin-right:4px; opacity:.75}
  .chap.done{color:var(--ink)}
  .chap.on{background:var(--orange); border-color:var(--orange); color:#fff}
  .chap.on .n{opacity:.9}

  .caption{padding:9px 18px 2px; font-size:14.5px; line-height:1.58; max-width:900px; min-height:4.6em}
  .caption b{font-weight:700}
  .caption .c-arc{color:var(--teal); font-weight:600}
  .caption .c-res{color:var(--orange); font-weight:600}
  .caption .c-why{color:var(--plum); font-weight:600}
  .caption .c-bad{color:var(--rose); font-weight:600}

  .ctlrow{display:flex; align-items:center; gap:10px 16px; flex-wrap:wrap; padding:2px 18px 16px}
  .ctlrow label{font-size:12px; color:var(--muted)}
  .ctlrow .slid{display:flex; align-items:center; gap:9px; min-width:210px; flex:0 1 300px}
  .ctlrow .slid input{width:100%}
  /* the value sits in a flex row, so without a floor it wraps to three cramped
     lines ("r =" / "0.62 x" / "AB") once the label is long */
  .mono{font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace; font-size:12px;

  .spacer{margin-left:auto}

  @media (max-width:640px){
    header{padding:50px 16px 6px 16px}
    .picker{padding:8px 14px 0}

    .seg button{border:1px solid var(--panelb); border-radius:8px}
    .seg button:last-child{border-right:1px solid var(--panelb)}
    .caption{font-size:13.6px; min-height:6.2em; padding:9px 14px 2px}
    .transport{padding:10px 14px 0}
    .chapters{padding:9px 14px 0}
    .ctlrow{padding:2px 14px 14px}
    .badge{max-width:62vw; font-size:11.5px}
    .tlbl{min-width:78px}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition-duration:.01ms !important; animation:none !important}
  }

<header>

<script>
(function(){
  "use strict";

  /* ===================================================================
     A construction "video": the whole picture is a pure function of the
     clock t, so scrubbing backwards is free — nothing is stored as
     "already drawn". Each mode supplies a list of steps (name, duration,
     caption) and a draw(t) that reads its own progress out of t via p().
     =================================================================== */

  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
  const badgeEl = $('badge'), hintEl = $('hint'), capEl = $('caption');
  const chapEl = $('chapters'), scrub = $('scrub'), timeLbl = $('timeLbl');
  const playBtn = $('playBtn'), restartBtn = $('restartBtn');
  const rSlider = $('rSlider'), rVal = $('rVal'), rLabel = $('rLabel');
  const whyBtn = $('whyBtn'), resetBtn = $('resetBtn');

  const REDUCED = !!(window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  const C = { ink:'#142033', muted:'#5A6B80', rose:'#B04A62', teal:'#1F6F84',
              orange:'#C85A2E', plum:'#6B4E9C', grid:'#E3E9F1', line:'#AEBDCE',
              paper:'#F8FAFC', halo:'rgba(248,250,252,.9)',
              brass:'#6B7A8C', steel:'#5A6B80' };

  // ---- small vector helpers (board coordinates, y grows downward) -----
  const V = (x,y) => ({x,y});
  const add = (a,b) => V(a.x+b.x, a.y+b.y);
  const sub = (a,b) => V(a.x-b.x, a.y-b.y);
  const mul = (a,k) => V(a.x*k, a.y*k);
  const len = a => Math.hypot(a.x, a.y);
  const norm = a => { const l = len(a) || 1; return V(a.x/l, a.y/l); };
  const perp = a => V(-a.y, a.x);
  const mid = (a,b) => V((a.x+b.x)/2, (a.y+b.y)/2);
  const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
  const ang = a => Math.atan2(a.y, a.x);
  const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
  const smooth = t => { t = clamp(t,0,1); return t*t*(3-2*t); };
  const lerp = (a,b,t) => a + (b-a)*t;

  // ---- canvas sizing --------------------------------------------------
  let W = 0, H = 0, DPR = 1;
  function resize(){
    const r = cv.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = r.width; H = r.height;
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(stage);

  // ---- view: fit the figure's bounding box, damped so drags don't jolt
  let vw = null;                       // {s, ox, oy} board -> screen
  function fitTo(pts, padX, padTop, padBottom){
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of pts){
      if (!p || !isFinite(p.x) || !isFinite(p.y)) continue;
      x0 = Math.min(x0,p.x); x1 = Math.max(x1,p.x);
      y0 = Math.min(y0,p.y); y1 = Math.max(y1,p.y);
    }
    if (!isFinite(x0)) { x0=0; y0=0; x1=100; y1=100; }
    // padTop is headroom for the compass, which stands above its feet;
    // padBottom keeps the figure clear of the badge on narrow screens
    const bw = Math.max(1, x1-x0), bh = Math.max(1, y1-y0);
    const avail = Math.max(60, H - padTop - padBottom);
    const s = Math.min((W-2*padX)/bw, avail/bh);
    const t = { s, ox:(W - bw*s)/2 - x0*s, oy: padTop + (avail - bh*s)/2 - y0*s };
    if (!vw) vw = t;
    else {
      const k = 0.16;                 // exponential ease toward the target
      vw = { s: lerp(vw.s, t.s, k), ox: lerp(vw.ox, t.ox, k), oy: lerp(vw.oy, t.oy, k) };
    }
  }
  const PX = p => V(vw.ox + p.x*vw.s, vw.oy + p.y*vw.s);
  const unPX = p => V((p.x - vw.ox)/vw.s, (p.y - vw.oy)/vw.s);

  // ---- drawing primitives (all take alpha so steps can fade in) -------
  let GA = 1;
  function ga(a){ ctx.globalAlpha = GA * (a==null ? 1 : clamp(a,0,1)); }
  function seg(a, b, color, w, alpha, dash){
    if (!a || !b) return;
    const A = PX(a), B = PX(b);
    ga(alpha); ctx.strokeStyle = color; ctx.lineWidth = w||1.6; ctx.lineCap = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
  // a line through p in direction u, drawn from p+u*t0 to p+u*t1 (board units)
  function ray(p, u, t0, t1, color, w, alpha, dash){
    seg(add(p, mul(u,t0)), add(p, mul(u,t1)), color, w, alpha, dash);
  }
  function arcTrail(c, r, a0, a1, color, w, alpha, dash){
    if (!(r > 0)) return;
    const P = PX(c);
    ga(alpha); ctx.strokeStyle = color; ctx.lineWidth = w||2; ctx.lineCap = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.arc(P.x, P.y, r*vw.s, a0, a1, a1 < a0);
    ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
  function dot(p, rpx, fill, ring, alpha){
    if (!p) return;
    const P = PX(p);
    ga(alpha); ctx.fillStyle = fill;
    ctx.beginPath(); ctx.arc(P.x, P.y, rpx, 0, Math.PI*2); ctx.fill();
    if (ring){ ctx.strokeStyle = ring; ctx.lineWidth = 1.8; ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  function txt(str, p, o){
    o = o || {};
    const P = PX(p), dx = o.dx||0, dy = o.dy||0;
    ga(o.a);
    ctx.font = (o.italic?'italic ':'') + (o.bold?'600 ':'') + (o.size||14) + 'px Georgia, serif';
    ctx.textAlign = o.align || 'left';
    ctx.textBaseline = o.base || 'middle';
    if (o.halo !== false){
      ctx.strokeStyle = C.halo; ctx.lineWidth = 4.5; ctx.lineJoin = 'round';
      ctx.strokeText(str, P.x+dx, P.y+dy);
    }
    ctx.fillStyle = o.color || C.ink;
    ctx.fillText(str, P.x+dx, P.y+dy);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.globalAlpha = 1;
  }
  function poly(pts, fill, alpha){
    ga(alpha); ctx.fillStyle = fill; ctx.beginPath();
    pts.forEach((p,i) => { const P = PX(p); i ? ctx.lineTo(P.x,P.y) : ctx.moveTo(P.x,P.y); });
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
  }
  // n little cross-ticks across the middle of a segment (equal-length marks)
  function ticks(a, b, n, color, alpha){
    const u = norm(sub(b,a)), q = perp(u), m = mid(a,b);
    const gapPx = 5, halfPx = 6.5;
    for (let i = 0; i < n; i++){
      const off = (i - (n-1)/2) * gapPx / vw.s;
      const c = add(m, mul(u, off));
      seg(add(c, mul(q,  halfPx/vw.s)), add(c, mul(q, -halfPx/vw.s)), color, 1.8, alpha);
    }
  }
  function rightAngle(c, u1, u2, color, alpha){
    const s = 15/vw.s;
    const p1 = add(c, mul(u1,s)), p2 = add(c, mul(u2,s));
    seg(p1, add(p1, mul(u2,s)), color, 1.6, alpha);
    seg(p2, add(p2, mul(u1,s)), color, 1.6, alpha);
  }
  function angleArc(c, u1, u2, rPx, color, alpha, w){
    const P = PX(c);
    let a0 = ang(u1), a1 = ang(u2);
    let d = a1 - a0;
    while (d >  Math.PI) d -= 2*Math.PI;
    while (d < -Math.PI) d += 2*Math.PI;
    ga(alpha); ctx.strokeStyle = color; ctx.lineWidth = w||1.8;
    ctx.beginPath(); ctx.arc(P.x, P.y, rPx, a0, a0+d, d < 0); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---- the instruments ------------------------------------------------
  // A pair of compasses seen from above: two legs meeting at a hinge that
  // stands "up the page" from the midpoint of the feet.
  function compass(centre, r, a, alpha){
    if (!(r > 0) || alpha <= 0) return;
    const foot = add(centre, V(r*Math.cos(a), r*Math.sin(a)));
    const N = PX(centre), F = PX(foot);
    const legPx = Math.max(dist(centre,foot)*vw.s*0.62, 118);
    const half = dist(centre,foot)*vw.s/2;
    const up = Math.sqrt(Math.max(legPx*legPx - half*half, 36*36));
    const M = { x:(N.x+F.x)/2, y:(N.y+F.y)/2 };
    const Hg = { x:M.x, y:M.y - up };

    ctx.save();
    ctx.globalAlpha = GA * clamp(alpha,0,1);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // legs
    ctx.strokeStyle = C.steel; ctx.lineWidth = 4.6;
    ctx.beginPath(); ctx.moveTo(Hg.x,Hg.y); ctx.lineTo(N.x,N.y);
    ctx.moveTo(Hg.x,Hg.y); ctx.lineTo(F.x,F.y); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(Hg.x,Hg.y); ctx.lineTo(N.x,N.y);
    ctx.moveTo(Hg.x,Hg.y); ctx.lineTo(F.x,F.y); ctx.stroke();
    // handle above the hinge
    ctx.strokeStyle = C.brass; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(Hg.x,Hg.y); ctx.lineTo(Hg.x,Hg.y-22); ctx.stroke();
    ctx.fillStyle = C.brass;
    ctx.beginPath(); ctx.arc(Hg.x, Hg.y-25, 5.2, 0, Math.PI*2); ctx.fill();
    // hinge
    ctx.fillStyle = '#D3DBE5'; ctx.strokeStyle = C.steel; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(Hg.x, Hg.y, 6.2, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    // needle foot
    const un = { x:(N.x-Hg.x), y:(N.y-Hg.y) }, ln = Math.hypot(un.x,un.y)||1;
    un.x /= ln; un.y /= ln;
    ctx.fillStyle = C.steel;
    ctx.beginPath();
    ctx.moveTo(N.x, N.y);
    ctx.lineTo(N.x - un.x*13 - un.y*4.2, N.y - un.y*13 + un.x*4.2);
    ctx.lineTo(N.x - un.x*13 + un.y*4.2, N.y - un.y*13 - un.x*4.2);
    ctx.closePath(); ctx.fill();
    // pencil foot
    const uf = { x:(F.x-Hg.x), y:(F.y-Hg.y) }, lf = Math.hypot(uf.x,uf.y)||1;
    uf.x /= lf; uf.y /= lf;
    ctx.fillStyle = C.orange;
    ctx.beginPath();
    ctx.moveTo(F.x, F.y);
    ctx.lineTo(F.x - uf.x*15 - uf.y*5, F.y - uf.y*15 + uf.x*5);
    ctx.lineTo(F.x - uf.x*15 + uf.y*5, F.y - uf.y*15 - uf.x*5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // A straightedge lying along p->q, offset sideways by `off` board units.
  function ruler(p, q, off, alpha){
    if (alpha <= 0) return;
    const u = norm(sub(q,p)), n = perp(u);
    const L = dist(p,q);
    const a = add(add(p, mul(u,-L*0.34)), mul(n,off));
    const b = add(add(q, mul(u, L*0.34)), mul(n,off));
    const wpx = 46;
    const A = PX(a), B = PX(b);
    const nn = { x:(B.y-A.y), y:-(B.x-A.x) };
    const l = Math.hypot(nn.x,nn.y)||1; nn.x/=l; nn.y/=l;
    ctx.save();
    ctx.globalAlpha = GA * clamp(alpha,0,1);
    ctx.beginPath();
    ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y);
    ctx.lineTo(B.x - nn.x*wpx, B.y - nn.y*wpx);
    ctx.lineTo(A.x - nn.x*wpx, A.y - nn.y*wpx);
    ctx.closePath();
    ctx.fillStyle = 'rgba(226,236,238,.42)'; ctx.fill();
    ctx.strokeStyle = 'rgba(31,111,132,.55)'; ctx.lineWidth = 1.4; ctx.stroke();
    // graduations along the working edge
    ctx.strokeStyle = 'rgba(31,111,132,.5)'; ctx.lineWidth = 1;
    const total = Math.hypot(B.x-A.x, B.y-A.y), ux = (B.x-A.x)/total, uy = (B.y-A.y)/total;
    for (let d = 12; d < total-6; d += 16){
      const h = (Math.round(d/16) % 5 === 0) ? 11 : 6;
      ctx.beginPath();
      ctx.moveTo(A.x+ux*d - nn.x*1, A.y+uy*d - nn.y*1);
      ctx.lineTo(A.x+ux*d - nn.x*h, A.y+uy*d - nn.y*h);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // ===================================================================
  //  GEOMETRY OF THE TWO CONSTRUCTIONS
  // ===================================================================

  // Perpendicular bisector of AB with compass radius r = rf·|AB|.
  // P (one side) and Q (other side) are where the arc pairs cross; they
  // only exist when rf > 0.5 — that is the whole "open it past half" rule.
  function pbGeom(A, B, rf){
    const d = dist(A,B), M = mid(A,B), u = norm(sub(B,A)), n = perp(u);
    const r = rf*d, hh = r*r - (d/2)*(d/2);
    const ok = hh > 1;
    const h = ok ? Math.sqrt(hh) : 0;
    const P = ok ? add(M, mul(n,-h)) : null;   // n points to +y, so -n is "up"
    const Q = ok ? add(M, mul(n, h)) : null;
    return {A,B,d,M,u,n,r,h,ok,P,Q};
  }

  // Angle bisector at V between arms towards E1 and E2, first arc radius r1.
  function abGeom(V0, E1, E2, r1){
    const u1 = norm(sub(E1,V0)), u2 = norm(sub(E2,V0));
    const X = add(V0, mul(u1,r1)), Y = add(V0, mul(u2,r1));
    const bis = norm(add(u1,u2));              // the true bisector direction
    const Mxy = mid(X,Y);
    const half = dist(X,Y)/2, r2 = r1;
    const back = Math.sqrt(Math.max(r2*r2 - half*half, 0));
    const Z = add(Mxy, mul(bis, back));
    return {V:V0, E1, E2, u1, u2, r1, r2, X, Y, Z, bis, armLen: Math.max(dist(V0,E1), dist(V0,E2))};
  }

  // ---- reusable animated construction painters ------------------------
  // ph = progress of each phase in 0..1; anything at 0 is not drawn yet.
  const SW = 0.34;                    // half-width of an arc sweep, radians

  function paintPBArcs(g, ph, o){
    o = o || {};
    const arcCol = o.arcCol || C.teal;
    const showCompass = o.compass !== false;
    if (!g.ok){
      // Arcs that will never meet — still worth drawing, because the gap IS
      // the lesson. Aim them at each other around the midpoint so the miss
      // reads as a miss rather than as two unrelated scribbles.
      const wide = SW*1.5;
      for (const s of [{c:g.A, ph:ph.arcA}, {c:g.B, ph:ph.arcB}]){
        if (s.ph <= 0) continue;
        for (const side of [-1, 1]){
          const local = clamp(side < 0 ? s.ph*2.1 : s.ph*2.1 - 1.1, 0, 1);
          if (local <= 0) continue;
          const a = ang(sub(add(g.M, mul(g.n, side*g.r*0.5)), s.c));
          arcTrail(s.c, g.r, a-wide, a-wide + 2*wide*local, arcCol, 2.1, .95);
          if (local < 1 && showCompass) compass(s.c, g.r, a-wide + 2*wide*local, 1);
        }
      }
      return;
    }
    const sweeps = [
      { c:g.A, target:g.P, ph:ph.arcA, half:0 },
      { c:g.A, target:g.Q, ph:ph.arcA, half:1 },
      { c:g.B, target:g.P, ph:ph.arcB, half:0 },
      { c:g.B, target:g.Q, ph:ph.arcB, half:1 }
    ];
    let live = null;
    for (const s of sweeps){
      // each centre draws its two arcs one after the other
      const local = clamp(s.half === 0 ? s.ph*2.1 : s.ph*2.1 - 1.1, 0, 1);
      if (local <= 0) continue;
      const a = ang(sub(s.target, s.c));
      arcTrail(s.c, g.r, a-SW, a-SW + 2*SW*local, arcCol, 2.1, .95);
      if (local < 1) live = { c:s.c, a: a-SW + 2*SW*local };
    }
    if (showCompass && live) compass(live.c, g.r, live.a, 1);
  }

  function paintABArcs(g, ph, o){
    o = o || {};
    const arcCol = o.arcCol || C.teal;
    let live = null;
    // 1 · the arc across both arms, swept from arm 1 to arm 2.
    // Always take the SHORT way round: the raw atan2 of the second arm can
    // sit a full turn away (arms straddling ±π), which sweeps a whole circle.
    if (ph.arc1 > 0){
      const a0 = ang(g.u1);
      let d = ang(g.u2) - a0;
      while (d >  Math.PI) d -= 2*Math.PI;
      while (d < -Math.PI) d += 2*Math.PI;
      const pad = 0.16*Math.sign(d || 1);
      const s0 = a0 - pad, s1 = a0 + d + pad;
      const cur = s0 + (s1-s0)*ph.arc1;
      arcTrail(g.V, g.r1, s0, cur, arcCol, 2.1, .95);
      if (ph.arc1 < 1) live = { c:g.V, r:g.r1, a:cur };
    }
    // 2 · equal arcs from X and from Y, crossing at Z
    const pairs = [ {c:g.X, ph:ph.arc2}, {c:g.Y, ph:ph.arc3} ];
    for (const s of pairs){
      if (s.ph <= 0) continue;
      const a = ang(sub(g.Z, s.c));
      arcTrail(s.c, g.r2, a-SW, a-SW + 2*SW*s.ph, arcCol, 2.1, .95);
      if (s.ph < 1) live = { c:s.c, r:g.r2, a: a-SW + 2*SW*s.ph };
    }
    if (o.compass !== false && live) compass(live.c, live.r, live.a, 1);
  }

  // ===================================================================
  //  STATE
  // ===================================================================
  const DEFAULTS = {
    pb: { A:V(250,360), B:V(740,318), rf:0.62 },
    ab: { V:V(300,500), E1:V(770,392), E2:V(524,88), r1f:0.42 },
    loci:{ A:V(215,505), B:V(795,505), C:V(470,105), rf:0.62, r1f:0.34 }
  };
  const st = JSON.parse(JSON.stringify(DEFAULTS));
  let mode = 'pb';
  let why = false;

  // ===================================================================
  //  MODES — each is a little film
  // ===================================================================
  const MODES = {};

  // ---------------- perpendicular bisector ---------------------------
  MODES.pb = {
    slider: { label:'compass opening', min:0.34, max:0.86, step:0.005,
              get:()=>st.pb.rf, set:v=>{ st.pb.rf = v; },
              fmt:v => 'r = ' + v.toFixed(2) + ' × AB' },
    steps: [
      { d:2.4, n:'The segment', cap:
        'Here is the segment <b>AB</b>. The job: find the line that cuts it exactly in half <b>and</b> meets it at 90° — using only a pair of compasses and a straight edge. No ruler measuring, no protractor.' },
      { d:3.2, n:'Open the compass', cap:
        'Open the compasses to <b>more than half of AB</b>. That is the one rule people forget — slide the opening below ½ and the arcs will never meet. Any radius past half works; keep it fixed from now on.' },
      { d:4.2, n:'Arcs from A', cap:
        'Sharp point on <b>A</b>. Swing a <span class="c-arc">short arc above the line and one below it</span>. You are marking every point that sits exactly r from A.' },
      { d:4.2, n:'Arcs from B', cap:
        'Same opening — do not touch the compasses. Sharp point on <b>B</b>, and swing the two arcs again. Where they cut the first pair you get <span class="c-arc">P</span> and <span class="c-arc">Q</span>: the only points that are the same distance from A <em>and</em> from B.' },
      { d:3.0, n:'Join P to Q', cap:
        'Straight edge on <span class="c-arc">P</span> and <span class="c-arc">Q</span>, and rule the line right through. <b>Leave your arcs on the page</b> — the construction marks carry a mark of their own.' },
      { d:5.0, n:'What you get', cap:
        'That line is the <span class="c-res">perpendicular bisector of AB</span>: it crosses AB at its midpoint M, at 90°. And every point on it is equidistant from A and B — which is exactly how the loci questions phrase it: <em>“the locus of points equidistant from A and B”</em>.' }
    ],
    geom(){ return pbGeom(st.pb.A, st.pb.B, st.pb.rf); },
    fitPts(g){
      const out = [g.A, g.B];
      if (g.ok){ out.push(g.P, g.Q, add(g.M, mul(g.n, g.h*1.28)), add(g.M, mul(g.n, -g.h*1.28))); }
      else out.push(add(g.M, mul(g.n, g.r*0.85)), add(g.M, mul(g.n, -g.r*0.85)));
      out.push(add(g.A, mul(g.u, -g.d*0.12)), add(g.B, mul(g.u, g.d*0.12)));
      return out;
    },
    handles(g){ return [ {p:st.pb.A, set:p=>{st.pb.A = p;}}, {p:st.pb.B, set:p=>{st.pb.B = p;}} ]; },
    hint: 'drag A or B · space = play/pause',
    draw(t, g, p){
      // 0 · the segment
      const gr = REDUCED ? 1 : smooth(p(0)/0.7);
      seg(g.A, add(g.A, mul(g.u, g.d*gr)), C.ink, 2.6, 1);
      dot(g.A, 5.4, C.ink, C.paper, gr>0.05?1:0);
      dot(g.B, 5.4, C.ink, C.paper, gr>0.95?1:0);
      txt('A', g.A, {dx:-13, dy:-11, bold:true, size:15, a:gr>0.05?1:0});
      txt('B', g.B, {dx: 13, dy:-11, bold:true, size:15, a:gr>0.95?1:0});

      // 1 · opening the compass, with the half-AB test drawn in
      const op = p(1);
      if (op > 0){
        const show = smooth(op/0.35), fade = 1 - smooth((p(2)-0.25)/0.5);
        const a = op*0.35;
        arcTrail(g.A, g.d/2, -Math.PI, Math.PI, C.rose, 1.5, 0.55*show*fade, [6,6]);
        txt('½ AB', add(g.A, V(0, -g.d/2)), {dy:-9, size:12, color:C.rose, align:'center',
                                             a:0.85*show*fade});
        if (fade > 0.02){
          const grow = smooth(clamp(op/0.5,0,1));
          compass(g.A, g.r*grow, -Math.PI/2 + 0.9*Math.sin(op*7), show*fade);
        }
      }

      // 2,3 · the four arcs
      const ph = { arcA: p(2), arcB: p(3) };
      paintPBArcs(g, ph, {});

      if (!g.ok) return;               // nothing further exists

      // crossings pop in as soon as both arcs through them are drawn
      const pIn = smooth((p(3)-0.52)/0.25), qIn = smooth((p(3)-0.92)/0.2);
      if (pIn > 0){ dot(g.P, 4.8, C.teal, C.paper, pIn);
                    txt('P', g.P, {dx:11, dy:-9, bold:true, size:14, color:C.teal, a:pIn}); }
      if (qIn > 0){ dot(g.Q, 4.8, C.teal, C.paper, qIn);
                    txt('Q', g.Q, {dx:11, dy:11, bold:true, size:14, color:C.teal, a:qIn}); }

      // 4 · rule the line
      const jn = p(4);
      if (jn > 0){
        const ext = g.h*0.34;
        const from = add(g.P, mul(g.n, -ext)), to = add(g.Q, mul(g.n, ext));
        const grow = REDUCED ? 1 : smooth(clamp((jn-0.18)/0.62, 0, 1));
        if (grow > 0) seg(from, add(from, mul(sub(to,from), grow)), C.orange, 2.8, 1);
        const slide = 1 - smooth(clamp(jn/0.3, 0, 1));
        const out = 1 - smooth(clamp((jn-0.82)/0.18, 0, 1));
        if (out > 0.02) ruler(from, to, (10 + 240*slide)/1, 0.9*out);
      }

      // 5 · the payoff
      const fn = p(5);
      if (fn > 0){
        const a1 = smooth(fn/0.28);
        rightAngle(g.M, g.u, g.n, C.orange, a1);
        rightAngle(g.M, mul(g.u,-1), mul(g.n,-1), C.orange, a1);
        ticks(g.A, g.M, 2, C.rose, a1);
        ticks(g.M, g.B, 2, C.rose, a1);
        dot(g.M, 4.4, C.orange, C.paper, a1);
        txt('M', g.M, {dx:0, dy:20, bold:true, size:13, color:C.orange, align:'center', a:a1});
        const a2 = smooth((fn-0.2)/0.25);
        txt('perpendicular bisector of AB', add(g.P, mul(g.n, -g.h*0.44)),
            {size:13.5, bold:true, color:C.orange, align:'center', a:a2});

        // the locus reading: a point sliding along it stays equidistant
        const a3 = smooth((fn-0.42)/0.2);
        if (a3 > 0){
          const k = REDUCED ? 0.55 : 0.5 + 0.42*Math.sin((fn-0.42)*5.4);
          const S = add(g.M, mul(g.n, (k*2-1)*g.h*1.02));
          seg(S, g.A, C.plum, 2, 0.9*a3, [7,5]);
          seg(S, g.B, C.plum, 2, 0.9*a3, [7,5]);
          dot(S, 5, C.plum, C.paper, a3);
          txt('SA = SB', S, {dx:14, dy:-14, size:12.5, bold:true, color:C.plum, a:a3});
        }
      }

      // "why it works" overlay: APBQ has four equal sides
      if (why){
        poly([g.A, g.P, g.B, g.Q], 'rgba(107,78,156,.10)', 1);
        [[g.A,g.P],[g.P,g.B],[g.B,g.Q],[g.Q,g.A]].forEach(e => seg(e[0], e[1], C.plum, 1.8, 0.8, [6,4]));
        [[g.A,g.P],[g.P,g.B],[g.B,g.Q],[g.Q,g.A]].forEach(e => ticks(e[0], e[1], 1, C.plum, 0.95));
      }
    },
    badge(g){
      if (!g.ok) return {warn:true, html:
        '<b>The arcs miss.</b> The opening is only ' + st.pb.rf.toFixed(2) +
        ' × AB — anything at or below <b>½ AB</b> leaves a gap, so there is no P and no Q. Open it wider.'};
      if (why) return {html:
        '<b>Why it works.</b> All four sides AP, PB, BQ, QA equal the compass radius r, so <b>APBQ is a rhombus</b> — and a rhombus’s diagonals cut each other in half at right angles. PQ is that other diagonal.'};
      return {html:
        '<b>r = ' + st.pb.rf.toFixed(2) + ' × AB</b><br>P and Q are each r from A <em>and</em> r from B — two points equidistant from A and B, and two points fix a line.'};
    }
  };

  // ---------------- angle bisector -----------------------------------
  MODES.ab = {
    slider: { label:'compass opening', min:0.20, max:0.62, step:0.005,
              get:()=>st.ab.r1f, set:v=>{ st.ab.r1f = v; },
              fmt:v => 'first arc r = ' + v.toFixed(2) + ' × arm' },
    steps: [
      { d:2.4, n:'The angle', cap:
        'An angle at <b>B</b>, arms BA and BC. The job: cut it into two equal halves with compasses only — no protractor, and it has to be exact.' },
      { d:3.8, n:'Arc across both arms', cap:
        'Sharp point on the <b>vertex B</b>. Any convenient radius: swing an arc that <span class="c-arc">cuts both arms</span>, at X and at Y. Those two points are now the same distance from B — that is the whole trick.' },
      { d:3.6, n:'Arc from X', cap:
        'Move the sharp point to <b>X</b> and swing an arc into the middle of the angle. Keep this opening for the next one — <b>equal radii</b> is what makes the halves equal.' },
      { d:3.6, n:'Arc from Y', cap:
        'Same opening, sharp point on <b>Y</b>, arc into the middle again. The two arcs cross at <span class="c-arc">Z</span>.' },
      { d:3.0, n:'Join B to Z', cap:
        'Rule the line from the vertex <b>B</b> through <span class="c-arc">Z</span>, and carry it past. Arcs stay on the page.' },
      { d:5.0, n:'What you get', cap:
        'BZ is the <span class="c-res">bisector of angle ABC</span> — two equal angles, marked. In loci language it is the set of points <em>equidistant from the two lines BA and BC</em>: the perpendicular distances to each arm are equal all the way along.' }
    ],
    geom(){
      const a = st.ab;
      return abGeom(a.V, a.E1, a.E2, a.r1f * Math.max(dist(a.V,a.E1), dist(a.V,a.E2)));
    },
    fitPts(g){
      return [g.V, g.E1, g.E2, g.X, g.Y, g.Z,
              add(g.V, mul(g.bis, g.armLen*0.92)),
              add(g.V, V(0,-g.r1*0.4))];
    },
    handles(g){ return [ {p:st.ab.E1, set:p=>{st.ab.E1 = p;}}, {p:st.ab.E2, set:p=>{st.ab.E2 = p;}} ]; },
    hint: 'drag either arm end · space = play/pause',
    draw(t, g, p){
      const gr = REDUCED ? 1 : smooth(p(0)/0.75);
      const L = g.armLen;
      seg(g.V, add(g.V, mul(g.u1, dist(g.V,g.E1)*gr)), C.ink, 2.6, 1);
      seg(g.V, add(g.V, mul(g.u2, dist(g.V,g.E2)*gr)), C.ink, 2.6, 1);
      dot(g.V, 5.4, C.ink, C.paper, gr>0.05?1:0);
      txt('B', g.V, {dx:-15, dy:12, bold:true, size:15, a:gr>0.05?1:0});
      txt('A', g.E1, {dx:13, dy:2,  bold:true, size:15, a:gr>0.9?1:0});
      txt('C', g.E2, {dx:6, dy:-14, bold:true, size:15, a:gr>0.9?1:0});

      const ph = { arc1:p(1), arc2:p(2), arc3:p(3) };
      paintABArcs(g, ph, {});

      const xIn = smooth((p(1)-0.25)/0.25), yIn = smooth((p(1)-0.85)/0.15);
      if (xIn > 0){ dot(g.X, 4.8, C.teal, C.paper, xIn);
                    txt('X', g.X, {dx:13, dy:8, bold:true, size:14, color:C.teal, a:xIn}); }
      if (yIn > 0){ dot(g.Y, 4.8, C.teal, C.paper, yIn);
                    txt('Y', g.Y, {dx:-13, dy:-6, bold:true, size:14, color:C.teal, align:'right', a:yIn}); }
      const zIn = smooth((p(3)-0.72)/0.28);
      if (zIn > 0){ dot(g.Z, 4.8, C.teal, C.paper, zIn);
                    txt('Z', g.Z, {dx:-13, dy:15, bold:true, size:14, color:C.teal, align:'right', a:zIn}); }

      // rule B -> Z, extended
      const jn = p(4);
      if (jn > 0){
        const to = add(g.V, mul(g.bis, L*0.92));
        const grow = REDUCED ? 1 : smooth(clamp((jn-0.18)/0.62, 0, 1));
        if (grow > 0) seg(g.V, add(g.V, mul(sub(to,g.V), grow)), C.orange, 2.8, 1);
        const slide = 1 - smooth(clamp(jn/0.3, 0, 1));
        const out = 1 - smooth(clamp((jn-0.82)/0.18, 0, 1));
        if (out > 0.02) ruler(g.V, to, (10 + 220*slide), 0.9*out);
      }

      const fn = p(5);
      if (fn > 0){
        const a1 = smooth(fn/0.3);
        const rr = Math.max(46, g.r1*vw.s*0.42);
        angleArc(g.V, g.u1, g.bis, rr, C.orange, a1, 2);
        angleArc(g.V, g.bis, g.u2, rr*1.16, C.orange, a1, 2);
        const h1 = add(g.V, mul(norm(add(g.u1,g.bis)), rr/vw.s*1.24));
        const h2 = add(g.V, mul(norm(add(g.bis,g.u2)), rr/vw.s*1.46));
        txt('×', h1, {size:15, bold:true, color:C.orange, align:'center', a:a1});
        txt('×', h2, {size:15, bold:true, color:C.orange, align:'center', a:a1});
        const a2 = smooth((fn-0.2)/0.25);
        txt('angle bisector', add(g.V, mul(g.bis, L*0.96)),
            {dy:-18, size:13.5, bold:true, color:C.orange, align:'center', a:a2});

        // equidistant-from-the-two-arms reading
        const a3 = smooth((fn-0.42)/0.2);
        if (a3 > 0){
          const k = REDUCED ? 0.6 : 0.55 + 0.3*Math.sin((fn-0.42)*5.0);
          const S = add(g.V, mul(g.bis, L*0.86*k));
          const f1 = footOn(g.V, g.u1, S), f2 = footOn(g.V, g.u2, S);
          seg(S, f1, C.plum, 2, 0.9*a3, [6,5]);
          seg(S, f2, C.plum, 2, 0.9*a3, [6,5]);
          rightAngle(f1, mul(g.u1,-1), norm(sub(S,f1)), C.plum, 0.8*a3);
          rightAngle(f2, g.u2, norm(sub(S,f2)), C.plum, 0.8*a3);
          dot(S, 5, C.plum, C.paper, a3);
          txt('equal distances', S, {dx:12, dy:-14, size:12.5, bold:true, color:C.plum, a:a3});
        }
      }

      if (why){
        poly([g.V, g.X, g.Z, g.Y], 'rgba(107,78,156,.10)', 1);
        [[g.V,g.X],[g.X,g.Z],[g.Z,g.Y],[g.Y,g.V]].forEach(e => seg(e[0], e[1], C.plum, 1.8, 0.8, [6,4]));
        ticks(g.V, g.X, 1, C.plum, .95); ticks(g.V, g.Y, 1, C.plum, .95);
        ticks(g.X, g.Z, 2, C.plum, .95); ticks(g.Y, g.Z, 2, C.plum, .95);
        seg(g.V, g.Z, C.plum, 1.8, 0.8, [6,4]);
      }
    },
    badge(g){
      if (why) return {html:
        '<b>Why it works.</b> BX = BY (same first arc), XZ = YZ (same second opening), and BZ is shared — so triangles BXZ and BYZ are <b>congruent (SSS)</b>. Congruent triangles ⇒ angle XBZ = angle YBZ.'};
      return {html:
        '<b>Two equal radii, twice.</b> BX = BY fixes a symmetric pair on the arms; equal arcs from X and Y put Z on the axis of symmetry. BZ is that axis.'};
    }
  };

  // foot of the perpendicular from S onto the ray from O in direction u
  function footOn(O, u, S){
    const k = (S.x-O.x)*u.x + (S.y-O.y)*u.y;
    return add(O, mul(u, k));
  }

  // ---------------- loci: shade the region ----------------------------
  MODES.loci = {
    slider: { label:'compass opening', min:0.34, max:0.80, step:0.005,
              get:()=>st.loci.rf, set:v=>{ st.loci.rf = v; },
              fmt:v => 'r = ' + v.toFixed(2) + ' × AB' },
    steps: [
      { d:2.6, n:'The question', cap:
        'The exam wording: <em>“Shade the region inside triangle ABC that is <b>nearer to A than to B</b> and <b>nearer to AB than to BC</b>.”</em> Two conditions, two constructions — and the marks are for the construction lines, not the shading alone.' },
      { d:4.6, n:'Nearer to A than B', cap:
        '<b>Nearer to A than to B</b> ⇒ the boundary is the <span class="c-arc">perpendicular bisector of AB</span>. Same four arcs as before. Everything on A’s side of that line is nearer to A.' },
      { d:3.0, n:'Shade side 1', cap:
        'Keep the half that contains <b>A</b>. On the line itself you are the same distance from both — the boundary is usually drawn solid and the exam takes either reading unless it says <em>strictly</em> nearer.' },
      { d:4.6, n:'Nearer to AB than BC', cap:
        '<b>Nearer to line AB than to line BC</b> ⇒ the boundary is the <span class="c-arc">bisector of the angle between them</span>, angle B. Arc across both arms, then two equal arcs, then rule it.' },
      { d:3.0, n:'Shade side 2', cap:
        'Keep the half nearer <b>AB</b> — the side the bisector leaves next to AB. Two overlapping conditions now.' },
      { d:4.4, n:'The answer region', cap:
        'The region satisfying <b>both</b> is the overlap. That is what you shade — and you leave every arc visible. <span class="c-res">Construction marks first, shading second.</span>' }
    ],
    geom(){
      const a = st.loci;
      const g1 = pbGeom(a.A, a.B, a.rf);
      const armLen = Math.max(dist(a.B,a.A), dist(a.B,a.C));
      const g2 = abGeom(a.B, a.A, a.C, a.r1f*armLen);
      return {a, g1, g2, tri:[a.A, a.B, a.C]};
    },
    fitPts(g){
      const out = [g.a.A, g.a.B, g.a.C, g.g2.X, g.g2.Y, g.g2.Z];
      if (g.g1.ok) out.push(g.g1.P, g.g1.Q);
      return out;
    },
    handles(g){
      return [ {p:st.loci.A, set:p=>{st.loci.A = p;}},
               {p:st.loci.B, set:p=>{st.loci.B = p;}},
               {p:st.loci.C, set:p=>{st.loci.C = p;}} ];
    },
    hint: 'drag any vertex · space = play/pause',
    draw(t, g, p){
      const {g1, g2, a} = g;
      const tri = [a.A, a.B, a.C];

      // triangle
      const gr = REDUCED ? 1 : smooth(p(0)/0.7);
      poly(tri, 'rgba(255,255,255,.34)', gr);
      seg(a.A, a.B, C.ink, 2.4, gr); seg(a.B, a.C, C.ink, 2.4, gr); seg(a.C, a.A, C.ink, 2.4, gr);
      ['A','B','C'].forEach((nm,i) => {
        const q = tri[i], cen = V((a.A.x+a.B.x+a.C.x)/3, (a.A.y+a.B.y+a.C.y)/3);
        const o = mul(norm(sub(q,cen)), 26);
        txt(nm, add(q,o), {bold:true, size:15, align:'center', a:gr});
        dot(q, 5, C.ink, C.paper, gr);
      });

      // shading first so the lines sit on top
      const s1 = smooth((p(2))/0.8), s2 = smooth((p(4))/0.8), both = smooth(p(5)/0.55);
      // the half-planes are named by their NORMAL, not by the boundary's
      // direction: the perpendicular bisector runs along n, so its normal is u
      if (g1.ok && s1 > 0) clipTri(tri, () => halfPlane(g1.M, g1.u, a.A, 'rgba(31,111,132,.26)', s1*(1-both*0.5)));
      if (s2 > 0) clipTri(tri, () => halfPlane(g2.V, perp(g2.bis), a.A, 'rgba(200,90,46,.24)', s2*(1-both*0.5)));
      if (both > 0 && g1.ok){
        clipTri(tri, () => {
          ctx.save();
          clipHalf(g1.M, g1.u, a.A);
          clipHalf(g2.V, perp(g2.bis), a.A);
          bigFill('rgba(107,78,156,.22)', both);
          hatch('rgba(107,78,156,.6)', both);
          ctx.restore();
        });
      }

      // construction 1 — perpendicular bisector of AB
      const c1 = { arcA: clamp(p(1)*2.15, 0, 1), arcB: clamp(p(1)*2.15-1.15, 0, 1) };
      paintPBArcs(g1, c1, {});
      if (g1.ok && p(1) > 0.92){
        const ext = g1.h*0.3;
        seg(add(g1.P, mul(g1.n,-ext)), add(g1.Q, mul(g1.n, ext)), C.teal, 2.6, 1);
        dot(g1.P, 4.2, C.teal, C.paper, 1); dot(g1.Q, 4.2, C.teal, C.paper, 1);
      }

      // construction 2 — bisector of angle B
      const q = p(3);
      const c2 = { arc1: clamp(q*3.3, 0, 1), arc2: clamp(q*3.3-1.05, 0, 1), arc3: clamp(q*3.3-2.1, 0, 1) };
      paintABArcs(g2, c2, {arcCol:C.orange});
      if (q > 0.05){
        const aX = smooth((q-0.1)/0.15);
        dot(g2.X, 4.2, C.orange, C.paper, aX); dot(g2.Y, 4.2, C.orange, C.paper, clamp(q*3.3-0.9,0,1));
      }
      if (q > 0.95){
        dot(g2.Z, 4.2, C.orange, C.paper, 1);
        seg(g2.V, add(g2.V, mul(g2.bis, g2.armLen*0.95)), C.orange, 2.6, 1);
      }

      if (both > 0.6){
        const cen = centroidOfRegion(tri, g1, g2, a.A);
        if (cen) txt('shade here', cen, {size:13.5, bold:true, color:'#5b4485', align:'center', a:(both-0.6)/0.4});
      }
    },
    badge(g){
      if (!g.g1.ok) return {warn:true, html:'<b>Open the compasses past ½ AB</b> — below that the arcs miss and there is no perpendicular bisector to draw.'};
      return {html:
        '<b>Read the words, pick the tool.</b><br>“nearer to <em>a point</em> than a point” ⇒ perpendicular bisector.<br>“nearer to <em>a line</em> than a line” ⇒ angle bisector.<br>“within d of a point” ⇒ circle.'};
    }
  };

  // ---- half-plane helpers used by the loci mode ----------------------
  function clipTri(tri, fn){
    ctx.save(); ctx.beginPath();
    tri.forEach((p,i) => { const P = PX(p); i ? ctx.lineTo(P.x,P.y) : ctx.moveTo(P.x,P.y); });
    ctx.closePath(); ctx.clip(); fn(); ctx.restore();
  }
  // the half-plane through `p0` with normal `n`, on the side containing `keep`
  function halfPoly(p0, n, keep){
    const u = perp(n), big = 6000/ (vw ? vw.s : 1);
    const sign = ((keep.x-p0.x)*n.x + (keep.y-p0.y)*n.y) >= 0 ? 1 : -1;
    const nn = mul(n, sign);
    return [ add(p0, mul(u,-big)), add(p0, mul(u, big)),
             add(add(p0, mul(u, big)), mul(nn,big)), add(add(p0, mul(u,-big)), mul(nn,big)) ];
  }
  function halfPlane(p0, n, keep, fill, alpha){
    poly(halfPoly(p0, n, keep), fill, alpha);
  }
  function clipHalf(p0, n, keep){
    const pts = halfPoly(p0, n, keep);
    ctx.beginPath();
    pts.forEach((p,i) => { const P = PX(p); i ? ctx.lineTo(P.x,P.y) : ctx.moveTo(P.x,P.y); });
    ctx.closePath(); ctx.clip();
  }
  function bigFill(color, alpha){
    ctx.save(); ctx.globalAlpha = GA * clamp(alpha,0,1);
    ctx.fillStyle = color; ctx.fillRect(0,0,W,H);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  function hatch(color, alpha){
    ctx.save();
    ctx.globalAlpha = GA * clamp(alpha,0,1);
    ctx.strokeStyle = color; ctx.lineWidth = 1.6;
    const step = 11;
    for (let d = -H; d < W + H; d += step){
      ctx.beginPath(); ctx.moveTo(d, 0); ctx.lineTo(d + H, H); ctx.stroke();
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }
  // rough centre of the doubly-shaded region, for the "shade here" tag
  function centroidOfRegion(tri, g1, g2, keep){
    let sx = 0, sy = 0, k = 0;
    const inTri = (p) => {
      const s = (a,b,c) => (a.x-c.x)*(b.y-c.y) - (b.x-c.x)*(a.y-c.y);
      const d1 = s(p,tri[0],tri[1]), d2 = s(p,tri[1],tri[2]), d3 = s(p,tri[2],tri[0]);
      const neg = (d1<0)||(d2<0)||(d3<0), pos = (d1>0)||(d2>0)||(d3>0);
      return !(neg && pos);
    };
    const side = (p, p0, n) => {
      const a = (p.x-p0.x)*n.x + (p.y-p0.y)*n.y;
      const b = (keep.x-p0.x)*n.x + (keep.y-p0.y)*n.y;
      return a*b >= 0;
    };
    for (let i = 0; i <= 24; i++) for (let j = 0; j <= 24; j++){
      const p = V(tri[0].x + (tri[1].x-tri[0].x)*i/24 + (tri[2].x-tri[0].x)*j/24,
                  tri[0].y + (tri[1].y-tri[0].y)*i/24 + (tri[2].y-tri[0].y)*j/24);
      if (i/24 + j/24 > 1) continue;
      if (!inTri(p)) continue;
      if (!side(p, g1.M, g1.u)) continue;
      if (!side(p, g2.V, perp(g2.bis))) continue;
      sx += p.x; sy += p.y; k++;
    }
    return k > 6 ? V(sx/k, sy/k) : null;
  }

  // ===================================================================
  //  TRANSPORT
  // ===================================================================
  let t = 0, playing = false, speed = 1, scrubbing = false, last = 0;
  const total = () => MODES[mode].steps.reduce((s,x) => s+x.d, 0);
  function stepStart(i){
    const S = MODES[mode].steps; let acc = 0;
    for (let k = 0; k < i; k++) acc += S[k].d;
    return acc;
  }
  function curStep(){
    const S = MODES[mode].steps; let acc = 0;
    for (let i = 0; i < S.length; i++){
      if (t < acc + S[i].d - 1e-6) return i;
      acc += S[i].d;
    }
    return S.length-1;
  }
  // progress within step i, given the global clock — the whole film is a
  // pure function of t, which is what makes scrubbing backwards work
  function mkP(){
    const S = MODES[mode].steps;
    return function(i){
      const s0 = stepStart(i);
      if (t <= s0) return 0;
      return clamp((t - s0)/S[i].d, 0, 1);
    };
  }
  const fmtT = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');

  function setPlaying(v){
    playing = v;
    playBtn.textContent = v ? '❚❚' : '▶';
    playBtn.setAttribute('aria-label', v ? 'Pause' : 'Play');
  }

  let lastChapter = -1, lastCap = '';
  function chrome(){
    const S = MODES[mode].steps, ci = curStep();
    if (ci !== lastChapter){
      lastChapter = ci;
      [...chapEl.children].forEach((b,i) => {
        b.classList.toggle('on', i === ci);
        b.classList.toggle('done', i < ci);
      });
    }
    const cap = S[ci].cap;
    if (cap !== lastCap){ lastCap = cap; capEl.innerHTML = cap; }
    if (!scrubbing) scrub.value = String(t);
    timeLbl.textContent = fmtT(t) + ' / ' + fmtT(total());
  }

  function buildChapters(){
    const S = MODES[mode].steps;
    chapEl.innerHTML = '';
    S.forEach((s,i) => {
      const b = document.createElement('button');
      b.className = 'chap'; b.type = 'button';
      b.innerHTML = '<span class="n">' + (i+1) + '</span>' + s.n;
      b.addEventListener('click', () => { t = stepStart(i) + 0.001; setPlaying(true); chrome(); });
      chapEl.appendChild(b);
    });
    scrub.max = String(total());
    lastChapter = -1; lastCap = '';
  }

  function syncSlider(){
    const sl = MODES[mode].slider;
    rSlider.min = sl.min; rSlider.max = sl.max; rSlider.step = sl.step;
    rSlider.value = String(sl.get());
    rLabel.textContent = sl.label;
    rVal.textContent = sl.fmt(sl.get());
  }

  function setMode(m){
    mode = m;
    [...$('modeSeg').children].forEach(b => b.classList.toggle('on', b.dataset.m === m));
    vw = null;                    // refit instantly for the new figure
    t = 0; buildChapters(); syncSlider(); setPlaying(!REDUCED);
    if (REDUCED) t = total() - 0.001;
    hintEl.textContent = MODES[mode].hint;
    chrome();
  }

  playBtn.addEventListener('click', () => {
    if (!playing && t >= total() - 0.02) t = 0;
    setPlaying(!playing);
  });
  restartBtn.addEventListener('click', () => { t = 0; setPlaying(true); chrome(); });
  scrub.addEventListener('pointerdown', () => { scrubbing = true; });
  scrub.addEventListener('pointerup',   () => { scrubbing = false; });
  scrub.addEventListener('input', e => {
    t = clamp(parseFloat(e.target.value)||0, 0, total());
    setPlaying(false); chrome();
  });
  $('speedSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    speed = parseFloat(b.dataset.s);
    [...$('speedSeg').children].forEach(x => x.classList.toggle('on', x === b));
  });
  $('modeSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    setMode(b.dataset.m);
  });
  rSlider.addEventListener('input', e => {
    MODES[mode].slider.set(parseFloat(e.target.value));
    rVal.textContent = MODES[mode].slider.fmt(MODES[mode].slider.get());
  });
  whyBtn.addEventListener('click', () => {
    why = !why;
    whyBtn.textContent = 'Why it works: ' + (why ? 'on' : 'off');
    whyBtn.classList.toggle('on', why);
  });
  resetBtn.addEventListener('click', () => {
    Object.assign(st, JSON.parse(JSON.stringify(DEFAULTS)));
    vw = null; syncSlider(); t = 0; setPlaying(true);
  });
  document.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.key === ' '){ e.preventDefault(); playBtn.click(); }
    else if (e.key === 'ArrowRight'){ e.preventDefault();
      const i = Math.min(curStep()+1, MODES[mode].steps.length-1);
      t = stepStart(i)+0.001; chrome(); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault();
      const i = curStep(), s0 = stepStart(i);
      t = (t - s0 < 0.35 && i > 0) ? stepStart(i-1)+0.001 : s0+0.001; chrome(); }
  });

  // ---- dragging the figure's points -----------------------------------
  let drag = null;
  function evP(e){ const r = cv.getBoundingClientRect(); return V(e.clientX-r.left, e.clientY-r.top); }
  function nearestHandle(pt){
    const g = MODES[mode].geom();
    const hs = MODES[mode].handles(g);
    let best = null, bd = 26;
    for (const h of hs){
      const P = PX(h.p), d = Math.hypot(P.x-pt.x, P.y-pt.y);
      if (d < bd){ bd = d; best = h; }
    }
    return best;
  }
  cv.addEventListener('pointerdown', e => {
    const h = nearestHandle(evP(e));
    if (!h) return;
    drag = h; cv.classList.add('dragging');
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    const pt = evP(e);
    if (!drag){ cv.classList.toggle('grabbable', !!nearestHandle(pt)); return; }
    const b = unPX(pt);
    drag.set(V(clamp(b.x,-400,1400), clamp(b.y,-400,1200)));
  });
  function endDrag(){ drag = null; cv.classList.remove('dragging'); }
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  // ---- frame loop ------------------------------------------------------
  let lastBadge = '';
  function frame(now){
    const dt = last ? Math.min((now-last)/1000, 0.05) : 0;
    last = now;
    if (playing && !scrubbing && !REDUCED){
      t += dt*speed;
      if (t >= total()){ t = total(); setPlaying(false); }
    }
    resizeIfNeeded();
    ctx.clearRect(0,0,W,H);

    const M = MODES[mode], g = M.geom();
    fitTo(M.fitPts(g), Math.min(64, Math.max(26, W*0.06)), 46, 46);
    GA = 1;
    M.draw(t, g, mkP());

    // draggable handles get a soft ring so they read as grabbable
    for (const h of M.handles(g)){
      const P = PX(h.p);
      ctx.globalAlpha = drag && drag.p === h.p ? 0.9 : 0.4;
      ctx.strokeStyle = C.muted; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(P.x, P.y, 13, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    const b = M.badge(g);
    const html = (b && b.html) || '';
    if (html !== lastBadge){
      lastBadge = html;
      badgeEl.classList.toggle('off', !html);
      badgeEl.classList.toggle('warn', !!(b && b.warn));
      if (html) badgeEl.innerHTML = html;
    }
    chrome();
    requestAnimationFrame(frame);
  }
  let lastW = 0, lastH = 0;
  function resizeIfNeeded(){
    const r = cv.getBoundingClientRect();
    if (Math.abs(r.width-lastW) > 0.5 || Math.abs(r.height-lastH) > 0.5){
      lastW = r.width; lastH = r.height; resize(); placeBadge();
    }
  }
  // Below 640px the stage is only as wide as the figure, so an overlaid badge
  // covers the drawing. Move it into the lesson bar instead of shrinking the figure.
  const lessonbar = document.querySelector('.lessonbar');
  function placeBadge(){
    const narrow = window.innerWidth < 640;
    const host = narrow ? lessonbar : stage;
    if (badgeEl.parentElement === host) return;
    badgeEl.classList.toggle('inflow', narrow);
    if (narrow) host.insertBefore(badgeEl, host.firstChild);
    else host.appendChild(badgeEl);
  }

  resize();
  placeBadge();
  setMode('pb');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
