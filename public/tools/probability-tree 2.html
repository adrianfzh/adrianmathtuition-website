<style>
  :root{
    --bg:#F4EFE6; --ink:#2b2b2b; --muted:#7d756a;
    --rose:#BC5A6E; --teal:#2E7C8F; --orange:#D8693C; --plum:#7B5EA7;
    --grid:#e6ddcd; --line:#cfc6b6;
    --panel:#fbf8f1; --panelb:#e7ded0;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Georgia","Times New Roman",serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh;
  }
  header{padding:16px 20px 6px 116px}
  h1{font-size:19px; font-weight:600; margin:0; letter-spacing:.2px}
  .sub{font-size:13px; color:var(--muted); margin-top:3px; max-width:72ch}

  main{width:100%; max-width:1080px; margin:0 auto; padding:6px 16px 46px; flex:1 1 auto}

  /* scenario chips */
  .chips{display:flex; flex-wrap:wrap; gap:8px; padding:8px 0 2px}
  .chips button{
    font:inherit; font-size:13px; color:var(--ink); background:var(--panel);
    border:1px solid var(--panelb); border-radius:999px; padding:8px 14px;
    cursor:pointer; min-height:38px;
  }
  .chips button:hover{border-color:var(--muted)}
  .chips button.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
  .chips button .tk{color:var(--teal); font-weight:700; margin-left:5px}
  .chips button.on .tk{color:#9fd6c7}

  .story{font-size:14.5px; line-height:1.55; margin:10px 0 4px; max-width:74ch}
  .ctlrow{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; margin:6px 0 10px; min-height:10px}
  .ctlrow label{font-size:12.5px; color:var(--muted)}
  .ctlrow input[type=number]{
    font:inherit; font-size:14px; color:var(--ink); background:var(--panel);
    border:1px solid var(--panelb); border-radius:8px; padding:8px; width:64px; min-height:44px;
  }
  .ctlrow input[type=number]:focus-visible{outline:2px solid var(--orange); outline-offset:1px}

  button{
    font:inherit; font-size:13px; color:var(--ink); background:var(--panel);
    border:1px solid var(--panelb); border-radius:8px; padding:7px 13px; cursor:pointer;
  }
  button:hover{border-color:var(--muted)}
  button:focus-visible{outline:2px solid var(--orange); outline-offset:1px}
  button:disabled{opacity:.4; cursor:default}
  button:disabled:hover{border-color:var(--panelb)}
  button.primary{background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600; min-width:88px}
  button.primary:hover{background:#000}
  .seg{display:inline-flex; border:1px solid var(--panelb); border-radius:8px; overflow:hidden}
  .seg button{border:none; border-right:1px solid var(--panelb); border-radius:0; background:var(--panel); min-height:44px}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--ink); color:var(--bg)}

  /* tree + keypad side by side on desktop */
  .stagegrid{display:grid; grid-template-columns:minmax(0,1fr) 212px; gap:14px; align-items:start}
  .treewrap{
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    background:var(--panel); border:1px solid var(--panelb); border-radius:14px;
    box-shadow:0 1px 0 rgba(0,0,0,.03);
  }
  svg{display:block; touch-action:pan-x}
  .notebar{min-height:1.6em; padding:8px 2px 0; font-size:13.5px; font-style:italic; color:var(--muted); line-height:1.5; max-width:74ch}
  .notebar.good{color:var(--teal)}

  /* keypad */
  .kp{
    background:var(--panel); border:1px solid var(--panelb); border-radius:14px;
    padding:10px; position:sticky; top:10px;
  }
  .kphint{font-size:12px; color:var(--muted); font-style:italic; text-align:center; min-height:1.3em; margin-bottom:6px}
  .kpprev{
    min-height:40px; display:flex; align-items:center; justify-content:center;
    font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace; font-size:17px;
    background:var(--bg); border:1px solid var(--panelb); border-radius:9px; margin-bottom:8px; padding:3px
  }
  .kpgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
  .kpgrid button{
    min-height:46px; font-size:17px; border-radius:9px;
    font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  }
  .kpgrid button.op{color:var(--teal); font-weight:700}
  .kpgrid button.enter{grid-column:span 2; background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:700}
  .kpgrid button.enter:hover{background:#000}

  /* question card */
  .qcard{
    background:var(--panel); border:1px solid var(--panelb); border-radius:14px;
    padding:13px 16px 14px; margin-top:14px;
  }
  .qhead{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
  .qtext{font-size:15.5px; margin:6px 0 2px; line-height:1.5}
  .qhint{font-size:12.5px; color:var(--muted); font-style:italic; margin:2px 0 8px}
  .working{
    font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace; font-size:14.5px;
    min-height:1.9em; padding:6px 2px; line-height:2;
  }
  .working .dimx{color:var(--muted)}
  .ansrow{display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-top:4px; font-size:15px}
  .ansslot{
    min-width:78px; min-height:44px; border:1.6px dashed var(--muted); border-radius:10px;
    font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace; font-size:16px;
    display:inline-flex; align-items:center; justify-content:center; background:var(--bg);
  }
  .ansslot.active{border-style:solid; border-color:var(--orange)}
  .ansslot.okk{border-style:solid; border-color:var(--teal); color:var(--teal)}
  .qfeed{min-height:1.5em; font-size:13.5px; font-style:italic; margin-top:8px; line-height:1.5}
  .qfeed.good{color:var(--teal)} .qfeed.bad{color:var(--rose)}

  /* side-by-side compare (scenario 1) */
  .compare{
    display:none; gap:10px; flex-wrap:wrap; margin-top:12px;
  }
  .compare.show{display:flex}
  .cbox{
    flex:1 1 220px; background:var(--panel); border:1px solid var(--panelb); border-radius:12px;
    padding:10px 13px; font-size:13.5px; line-height:1.6;
  }
  .cbox h4{margin:0 0 4px; font-size:12px; color:var(--muted); font-weight:600; font-style:italic}
  .cbox .big{font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace; font-size:15px}

  /* stacked fractions in HTML */
  .frac{display:inline-flex; flex-direction:column; text-align:center; vertical-align:middle;
        margin:0 .16em; font-size:.78em; line-height:1.25;
        font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace}
  .frac .fd{border-top:1px solid currentColor; padding:0 .22em}
  .frac .fn{padding:0 .22em}

  /* SVG bits */
  .branch{stroke:var(--ink); stroke-width:2; stroke-linecap:round; transition:stroke .25s, stroke-width .25s}
  .branch.sel{stroke:var(--orange); stroke-width:3.6}
  .branch.lit{stroke:var(--orange); stroke-width:4}
  .slotg{cursor:pointer}
  .slotg .pill{fill:var(--panel); stroke:var(--muted); stroke-width:1.4; stroke-dasharray:4 3}
  .slotg.active .pill{stroke:var(--orange); stroke-width:2; stroke-dasharray:none}
  .slotg.filled .pill{stroke:none; fill:var(--panel)}
  .slotg:focus{outline:none}
  .slotg:focus-visible .pill{stroke:var(--orange); stroke-width:2.4; stroke-dasharray:none}
  .slotg.bad{animation:shake .3s ease 1}
  .leafg{cursor:pointer}
  .leafg:focus{outline:none}
  .leafg:focus-visible text{fill:var(--orange)}
  .pulse1{animation:ppulse .55s ease 1; transform-box:fill-box; transform-origin:center}
  @keyframes ppulse{0%{transform:scale(1)} 45%{transform:scale(1.22)} 100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)} 30%{transform:translateX(-4px)} 60%{transform:translateX(4px)}}
  .fadein{animation:fin .4s ease 1}
  @keyframes fin{from{opacity:0} to{opacity:1}}

  .donebar{margin-top:12px; font-size:14px; color:var(--teal)}

  @media (max-width:860px){
    .stagegrid{grid-template-columns:1fr}
    .kp{
      position:fixed; left:0; right:0; bottom:0; top:auto; z-index:60;
      border-radius:16px 16px 0 0; box-shadow:0 -4px 18px rgba(0,0,0,.14);
      max-width:420px; margin:0 auto;
      padding-bottom:calc(10px + env(safe-area-inset-bottom));
      transform:translateY(108%); transition:transform .25s ease;
    }
    .kp.open{transform:translateY(0)}
    body.kpopen main{padding-bottom:330px}
  }
  @media (max-width:560px){
    header{padding:50px 16px 6px 16px}
    .qtext{font-size:14.5px}
  }
  .mono{font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition:none !important; animation:none !important}
  }
</style>

<a href="/tools" class="tools-backlink" style="position:fixed;top:12px;left:12px;z-index:99999;display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;background:rgba(20,22,26,.82);color:#fff;font:600 13px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.28);-webkit-tap-highlight-color:transparent;">‹ All tools</a>
<header>
  <h1>Probability tree builder</h1>
  <div class="sub">Fill in every branch, then multiply along the path and add across the paths. The tree does the remembering — you do the thinking.</div>
</header>

<main>
  <div class="chips" id="chips" role="tablist" aria-label="Scenarios"></div>
  <div class="story" id="story"></div>
  <div class="ctlrow" id="ctlrow"></div>

  <div class="stagegrid">
    <div>
      <div class="treewrap" id="treewrap"><svg id="tree" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Probability tree diagram"></svg></div>
      <div class="notebar" id="notebar" aria-live="polite"></div>

      <section class="qcard" id="qcard" hidden>
        <div class="qhead" id="qhead">Question</div>
        <div class="qtext" id="qtext"></div>
        <div class="qhint" id="qhint">Tap the paths you think are involved — the working assembles here as you go.</div>
        <div class="working" id="working">—</div>
        <div class="ansrow" id="ansrow">
          <span class="entrybits"><span>P&nbsp;=&nbsp;</span><button class="ansslot" id="ansSlot" aria-label="answer slot — opens keypad">?</button>
          <button class="primary" id="checkBtn" style="margin-left:10px">Check</button></span>
          <button id="revealBtn" hidden>Reveal</button>
          <button class="primary" id="nextQBtn" hidden>Next ›</button>
        </div>
        <div class="qfeed" id="qfeed" aria-live="polite"></div>
      </section>

      <div class="compare" id="compare"></div>
      <div class="donebar" id="donebar" hidden></div>
    </div>

    <div class="kp" id="kp" aria-label="number keypad">
      <div class="kphint" id="kpHint">tap a dashed ? on the tree</div>
      <div class="kpprev" id="kpPrev">&nbsp;</div>
      <div class="kpgrid" id="kpGrid"></div>
    </div>
  </div>
</main>

<script>
(function(){
  "use strict";

  /* ══════════ tiny exact-fraction library — every expected answer flows
     through this; nothing is a hard-coded decimal ══════════ */
  function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a||1; }
  function fr(n,d){ if(d<0){ n=-n; d=-d; } const g=gcd(n,d); return {n:n/g, d:d/g}; }
  const ONE = fr(1,1);
  function fadd(a,b){ return fr(a.n*b.d + b.n*a.d, a.d*b.d); }
  function fmul(a,b){ return fr(a.n*b.n, a.d*b.d); }
  function fsub(a,b){ return fr(a.n*b.d - b.n*a.d, a.d*b.d); }
  function fcmp(a,b){ return a.n*b.d - b.n*a.d; }          // cross-multiply: unsimplified input welcome
  function feq(a,b){ return fcmp(a,b)===0; }
  function fnum(a){ return a.n/a.d; }
  function fstr(a){ return a.d===1 ? String(a.n) : a.n+'/'+a.d; }
  function fdec(a){                                         // tidy decimal, ≤4 dp
    const v = fnum(a);
    let s = (Math.round(v*10000)/10000).toString();
    return s;
  }
  function sig3(v){ if(v===0) return 0; return Number(v.toPrecision(3)); }

  // display of an exact frac in the scenario's preferred style
  function fShow(a, disp){ return disp==='dec' ? fdec(a) : fstr(a); }

  /* ---- parse a keypad entry ("5/8", "0.7", "1") → {f, dec:bool} or null */
  function parseEntry(s){
    if(!s) return null;
    if(s.indexOf('/')>=0){
      const p = s.split('/');
      if(p.length!==2 || !/^\d+$/.test(p[0]) || !/^\d+$/.test(p[1]) || +p[1]===0) return null;
      return {f: fr(+p[0], +p[1]), raw:{n:+p[0], d:+p[1]}, dec:false};
    }
    if(!/^\d*\.?\d+$/.test(s) && !/^\d+\.$/.test(s)) return null;
    const v = parseFloat(s);
    if(!isFinite(v)) return null;
    return {v, dec:true};
  }
  // does an entry match the exact value? fracs by cross-mult; decimals to 3 s.f.
  function entryMatches(ent, exact){
    if(!ent) return false;
    if(!ent.dec) return fcmp(ent.raw ? ent.raw : ent.f, exact)===0;
    const x = fnum(exact);
    return Math.abs(ent.v - x) <= 5.0e-4 || sig3(ent.v)===sig3(x);
  }

  /* ---- HTML + SVG fraction renderers ------------------------------- */
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function htmlNum(a, disp){                     // frac span or decimal text
    if(disp==='dec' || a.d===1) return '<span class="mono">'+esc(fShow(a,disp))+'</span>';
    return '<span class="frac"><span class="fn">'+a.n+'</span><span class="fd">'+a.d+'</span></span>';
  }
  function htmlEntry(s){                          // what the student typed
    if(s.indexOf('/')>=0){
      const p = s.split('/');
      return '<span class="frac"><span class="fn">'+esc(p[0])+'</span><span class="fd">'+esc(p[1])+'</span></span>';
    }
    return esc(s);
  }

  const SVGNS = 'http://www.w3.org/2000/svg';
  function el(name, attrs, parent){
    const e = document.createElementNS(SVGNS, name);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    if(parent) parent.appendChild(e);
    return e;
  }
  function tEl(parent, x, y, str, o){
    o = o||{};
    const t = el('text', {x:x, y:y, 'text-anchor':o.anchor||'middle',
      'font-size':o.size||13, fill:o.fill||'var(--ink)'}, parent);
    t.setAttribute('font-family', o.mono ? 'SFMono-Regular,ui-monospace,Menlo,Consolas,monospace' : 'Georgia,serif');
    if(o.italic) t.setAttribute('font-style','italic');
    if(o.bold) t.setAttribute('font-weight','600');
    if(o.halo){ t.setAttribute('paint-order','stroke'); t.setAttribute('stroke','var(--panel)'); t.setAttribute('stroke-width','3.5'); }
    t.textContent = str;
    return t;
  }
  // stacked fraction (or plain value) centred at (x,y) inside parent <g>
  function svgValue(parent, x, y, str, o){
    o = o||{};
    const fs = o.size||12.5, fill = o.fill||'var(--ink)';
    if(str.indexOf('/')>=0){
      const p = str.split('/');
      const w = Math.max(p[0].length, p[1].length)*fs*0.62 + 6;
      el('rect', {x:x-w/2-2, y:y-fs-4, width:w+4, height:2*fs+8, fill:'var(--panel)'}, parent);
      tEl(parent, x, y-3, p[0], {mono:1, size:fs, fill:fill});
      el('line', {x1:x-w/2, y1:y, x2:x+w/2, y2:y, stroke:fill, 'stroke-width':1}, parent);
      tEl(parent, x, y+fs, p[1], {mono:1, size:fs, fill:fill});
    } else {
      const w = str.length*fs*0.62 + 8;
      el('rect', {x:x-w/2, y:y-fs*0.8, width:w, height:fs*1.6, fill:'var(--panel)'}, parent);
      tEl(parent, x, y+fs*0.36, str, {mono:1, size:fs, fill:fill});
    }
  }

  /* ══════════ scenario generators ══════════
     A tree spec: { disp:'frac'|'dec', headers:[...], levels } plus
     branchesFor(path) → [{label, color, p}] where path is the outcome
     indices taken so far. Leaves get pathword letters coloured per branch. */

  const CV = {rose:'var(--rose)', teal:'var(--teal)', orange:'var(--orange)', plum:'var(--plum)'};

  function countersSpec(r, b, rep){
    const T = r + b;
    return {
      disp:'frac', levels:2,
      headers:['1st draw', rep ? '2nd draw — back to '+T : '2nd draw — '+(T-1)+' left'],
      branchesFor(path){
        if(path.length===0) return [
          {label:'R', color:CV.rose, p:fr(r,T)},
          {label:'B', color:CV.teal, p:fr(b,T)}
        ];
        const firstRed = path[0]===0;
        const rl = rep ? r : (firstRed ? r-1 : r);
        const bl = rep ? b : (firstRed ? b : b-1);
        const tl = rep ? T : T-1;
        return [
          {label:'R', color:CV.rose, p:fr(rl,tl)},
          {label:'B', color:CV.teal, p:fr(bl,tl)}
        ];
      }
    };
  }
  function countersQuestions(r, b, c1, c2){       // c1/c2 = colour names
    return [
      { text:'P(both '+c1+')', paths:[0],
        note:'Multiply along the one path that works: first '+c1+', then '+c1+' again.' },
      { text:'P(different colours)', paths:[1,2],
        note:'Two paths qualify — '+c1+' then '+c2+', or '+c2+' then '+c1+'. Multiply along each, add across.' },
      { text:'P(second counter is '+c2+')', paths:[1,3],
        note:'Same as P(first '+c2+'). Not a coincidence — symmetry.' }
    ];
  }

  function throwsSpec(){
    return {
      disp:'dec', levels:2,
      headers:['1st attempt','2nd attempt'],
      branchesFor(){
        return [
          {label:'S', color:CV.rose, p:fr(7,10)},
          {label:'M', color:CV.teal, p:fr(3,10)}
        ];
      }
    };
  }

  function rainSpec(){
    return {
      disp:'dec', levels:2,
      headers:['Weather','Bus'],
      branchesFor(path){
        if(path.length===0) return [
          {label:'Rain', color:CV.rose, p:fr(3,10)},
          {label:'Dry',  color:CV.teal, p:fr(7,10)}
        ];
        const late = path[0]===0 ? fr(8,10) : fr(1,10);
        return [
          {label:'Late',    color:CV.orange, p:late},
          {label:'On time', color:CV.plum,   p:fsub(ONE, late)}
        ];
      }
    };
  }

  function coinsSpec(){
    return {
      disp:'frac', levels:3,
      headers:['1st flip','2nd flip','3rd flip'],
      branchesFor(){
        return [
          {label:'H', color:CV.rose, p:fr(1,2)},
          {label:'T', color:CV.teal, p:fr(1,2)}
        ];
      }
    };
  }

  /* ---- build the flat tree model from a spec ------------------------ */
  function buildTree(spec){
    const branches = [], leaves = [];
    let leafSlot = 0;
    function grow(path, probSoFar, labels){
      const kids = spec.branchesFor(path);
      const out = {children:[]};
      kids.forEach(function(k, i){
        const br = {
          id: path.concat(i).join(''),
          path: path.concat(i),
          label: k.label, color: k.color, p: k.p,
          depth: path.length,
          node: null            // filled by layout
        };
        branches.push(br);
        out.children.push(br);
        if(path.length + 1 === spec.levels){
          br.leafIndex = leaves.length;
          br.slot = leafSlot++;
          const lv = {
            branch: br,
            letters: labels.concat([{t:k.label, c:k.color}]),
            prob: fmul(probSoFar, k.p),
            pathBranches: null
          };
          leaves.push(lv);
        } else {
          br.sub = grow(path.concat(i), fmul(probSoFar, k.p), labels.concat([{t:k.label, c:k.color}]));
        }
      });
      return out;
    }
    const root = grow([], ONE, []);
    // record each leaf's chain of branch ids for path highlighting
    leaves.forEach(function(lv){
      const chain = [];
      for(let d=1; d<=lv.branch.path.length; d++) chain.push(lv.branch.path.slice(0,d).join(''));
      lv.pathBranches = chain;
    });
    // groups for the sum-to-1 chips: root + each internal branch's children
    const groups = [{parentId:null, children:root.children}];
    branches.forEach(function(br){ if(br.sub) groups.push({parentId:br.id, children:br.sub.children}); });
    return {spec:spec, branches:branches, leaves:leaves, groups:groups, root:root};
  }

  /* ---- layout + render into the SVG --------------------------------- */
  const svg = document.getElementById('tree');
  const treewrap = document.getElementById('treewrap');
  const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  function layoutTree(tree, width){
    const L = tree.spec.levels;
    const leafGap = L===3 ? 48 : 64;
    const topPad = 34, botPad = 22;
    const H = topPad + botPad + (tree.leaves.length-1)*leafGap;
    const rightPad = L===3 ? 118 : 148;
    const x0 = 24;
    const cols = [x0];
    for(let d=1; d<=L; d++) cols.push(x0 + (width - x0 - rightPad) * d/L);

    // leaves first, parents at the mean of their children
    tree.branches.forEach(function(br){
      if(br.leafIndex!=null) br.node = {x:cols[br.depth+1], y:topPad + br.slot*leafGap};
    });
    for(let d=L-2; d>=0; d--){
      tree.branches.forEach(function(br){
        if(br.depth===d && br.sub){
          const ys = br.sub.children.map(function(c){ return c.node.y; });
          br.node = {x:cols[br.depth+1], y:(Math.min.apply(null,ys)+Math.max.apply(null,ys))/2};
        }
      });
    }
    const rys = tree.root.children.map(function(c){ return c.node.y; });
    tree.rootNode = {x:cols[0], y:(Math.min.apply(null,rys)+Math.max.apply(null,rys))/2};
    tree.branches.forEach(function(br){
      br.from = br.depth===0 ? tree.rootNode
              : tree.branches.find(function(p){ return p.id===br.path.slice(0,-1).join(''); }).node;
    });
    tree.cols = cols; tree.H = H; tree.W = width;
  }

  // one full render of the current tree + state (cheap: few dozen nodes)
  function renderTree(){
    const tree = V.tree, st = V.state;
    const wrapW = treewrap.clientWidth || 600;
    const minW = tree.spec.levels===3 ? 620 : 380;
    const W = Math.max(minW, wrapW - 2);
    layoutTree(tree, W);
    svg.setAttribute('viewBox', '0 0 '+W+' '+tree.H);
    svg.setAttribute('width', W); svg.setAttribute('height', tree.H);
    while(svg.firstChild) svg.removeChild(svg.firstChild);

    // stage headers
    tree.spec.headers.forEach(function(h, i){
      tEl(svg, tree.cols[i+1], 15, h, {size:11, mono:1, fill:'var(--muted)'});
    });

    // root dot
    el('circle', {cx:tree.rootNode.x, cy:tree.rootNode.y, r:3.4, fill:'var(--ink)'}, svg);

    // branches (lines first so labels sit on top)
    tree.branches.forEach(function(br){
      br.lineEl = el('line', {x1:br.from.x, y1:br.from.y, x2:br.node.x, y2:br.node.y, 'class':'branch'}, svg);
    });

    // internal node dots + outcome letters above them
    tree.branches.forEach(function(br){
      if(br.sub){
        el('circle', {cx:br.node.x, cy:br.node.y, r:3, fill:'var(--ink)'}, svg);
        tEl(svg, br.node.x, br.node.y-9, br.label, {size:13.5, italic:1, bold:1, fill:br.color, halo:1});
      }
    });

    // sum chips per group
    tree.groups.forEach(function(g){
      const parent = g.parentId===null ? tree.rootNode
                   : tree.branches.find(function(b){ return b.id===g.parentId; }).node;
      const entries = g.children.map(function(c){ return st.entries[c.id]; }).filter(Boolean);
      if(!entries.length) return;
      let sum = fr(0,1);
      let allIn = true;
      g.children.forEach(function(c){
        const e = st.entries[c.id];
        if(e) sum = fadd(sum, c.p); else allIn = false;   // entries are only stored when correct
      });
      const done = allIn && feq(sum, ONE);
      const g2 = el('g', {}, svg);
      tEl(g2, parent.x+2, parent.y+17,
          done ? 'sum = 1 ✓' : 'sum '+fShow(sum, tree.spec.disp),
          {size:10.5, mono:1, fill: done ? 'var(--teal)' : 'var(--muted)', anchor:'start', halo:1});
    });

    // probability slots at branch midpoints
    tree.branches.forEach(function(br){
      const mx = (br.from.x+br.node.x)/2, my = (br.from.y+br.node.y)/2;
      const g = el('g', {'class':'slotg', tabindex:0, role:'button'}, svg);
      br.slotEl = g;
      const entry = st.entries[br.id];
      const active = V.kpTarget && V.kpTarget.type==='branch' && V.kpTarget.id===br.id;
      if(entry){
        g.classList.add('filled');
        svgValue(g, mx, my, entry, {size:12.5});
      } else {
        if(active) g.classList.add('active');
        el('rect', {x:mx-21, y:my-13, width:42, height:26, rx:13, 'class':'pill'}, g);
        tEl(g, mx, my+4.5, '?', {size:14, mono:1, fill: active ? 'var(--orange)' : 'var(--muted)'});
      }
      // fat transparent hit target (≥44px)
      const hit = el('rect', {x:mx-26, y:my-24, width:52, height:48, fill:'#000', 'fill-opacity':0}, g);
      hit.style.pointerEvents = 'all';
      g.setAttribute('aria-label', 'probability of '+br.label+' at stage '+(br.depth+1)+
        (entry ? ', entered '+entry : ', empty — activate to type'));
      g.addEventListener('pointerdown', function(ev){ ev.preventDefault(); openKeypad({type:'branch', id:br.id}); });
      g.addEventListener('keydown', function(ev){
        if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); openKeypad({type:'branch', id:br.id}); }
      });
    });

    // leaves: pathword + (during questions) selection + products
    tree.leaves.forEach(function(lv, li){
      const n = lv.branch.node;
      el('circle', {cx:n.x, cy:n.y, r:3, fill:'var(--ink)'}, svg);
      const g = el('g', {'class':'leafg', tabindex: V.phase==='questions' ? 0 : -1}, svg);
      lv.gEl = g;
      let x = n.x + 10;
      lv.letters.forEach(function(L2){
        const t = tEl(g, x, n.y+4.5, L2.t, {size:13.5, italic:1, bold:1, fill:L2.c, anchor:'start'});
        x += (L2.t.length>1 ? L2.t.length*7.2+6 : 12);
      });
      lv.labelEndX = x;
      if(V.selected.has(li)){
        el('rect', {x:n.x+4, y:n.y-11, width:x-n.x-0, height:22, rx:6, fill:'none',
                    stroke:'var(--orange)', 'stroke-width':1.6}, g);
      }
      if(V.products[li]){
        const pg = el('g', {'class': V.products[li]==='new' ? 'fadein' : ''}, svg);
        tEl(pg, x+4, n.y+4.5, '=', {size:12, mono:1, fill:'var(--muted)', anchor:'start'});
        svgValue(pg, x+18+(fShow(lv.prob, tree.spec.disp).length*3.6), n.y,
                 fShow(lv.prob, tree.spec.disp), {size:11.5, fill:'var(--orange)'});
        if(V.products[li]==='new') V.products[li] = true;
      }
      const hit = el('rect', {x:n.x-4, y:n.y-22, width:Math.max(96, x-n.x+56), height:44,
                              fill:'#000', 'fill-opacity':0}, g);
      hit.style.pointerEvents = 'all';
      g.setAttribute('role','button');
      g.setAttribute('aria-label','path '+lv.letters.map(function(l){return l.t;}).join(' then ')+
        (V.phase==='questions' ? ' — toggle selection' : ''));
      g.addEventListener('pointerdown', function(ev){ ev.preventDefault(); toggleLeaf(li); });
      g.addEventListener('keydown', function(ev){
        if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); toggleLeaf(li); }
      });
      // mark selected path lines
      if(V.selected.has(li)) lv.pathBranches.forEach(function(bid){
        const b = tree.branches.find(function(x2){ return x2.id===bid; });
        if(b && b.lineEl) b.lineEl.classList.add('sel');
      });
    });
  }

  /* ══════════ scenarios ══════════ */
  const SCEN = [
    {
      id:'counters', chip:'Counters, no replacement',
      story:function(){
        return V.rep
          ? 'A bag has <b>5 red</b> and <b>3 blue</b> counters. Two are drawn one after another, each counter going <b>back in</b> before the next draw.'
          : 'A bag has <b>5 red</b> and <b>3 blue</b> counters. Two are drawn one after another <b>without replacement</b>.';
      },
      variant:function(){ return 'counters-'+(V.rep?'rep':'norep'); },
      spec:function(){ return countersSpec(5,3,V.rep); },
      questions:function(){ return countersQuestions(5,3,'red','blue'); },
      treeNote:function(){
        return V.rep
          ? 'The bag resets every time — the second draw never changes. Independence looks like repetition.'
          : 'One counter gone — every second denominator drops to 7.';
      },
      controls:'repToggle',
      wrongHint:function(br){
        if(!V.rep && br.depth===1) return 'Count what is actually left in the bag after that first draw.';
        return 'Check the branch against the story, then try again.';
      }
    },
    {
      id:'throws', chip:'Two free throws',
      story:function(){ return 'A player scores a free throw with probability <b>0.7</b>, independently each time. Two attempts: <b>S</b>core or <b>M</b>iss.'; },
      variant:function(){ return 'throws'; },
      spec:throwsSpec,
      questions:function(){
        return [
          { text:'P(scores both)', paths:[0],
            note:'0.7 × 0.7 — independence means the second branch never changes.' },
          { text:'P(scores exactly one)', paths:[1,2],
            note:'Score-then-miss OR miss-then-score. Two paths, added — order matters enough to double it.' },
          { text:'P(scores at least one)', paths:[0,1,2], complementLeaf:3,
            note:'1 − P(none) is faster than adding three paths.' }
        ];
      },
      treeNote:function(){ return 'Same two numbers on every fan — that is what “independent” looks like on a tree.'; },
      controls:null,
      wrongHint:function(){ return 'The two attempts do not affect each other — same probabilities each time.'; }
    },
    {
      id:'rain', chip:'Rain and the bus',
      story:function(){ return 'P(rain) = <b>0.3</b>. If it rains, the bus is late with probability <b>0.8</b>; if it stays dry, only <b>0.1</b>.'; },
      variant:function(){ return 'rain'; },
      spec:rainSpec,
      questions:function(){
        return [
          { text:'P(rain <em>and</em> bus late)', paths:[0],
            note:'One path: 0.3 × 0.8. Multiplying along a path is the word “and”.' },
          { text:'P(bus late)', paths:[0,2],
            note:'Late can happen two ways — through rain or through dry. Add both routes.' },
          { text:'Given the bus <em>was</em> late — how likely was rain?', reveal:true,
            note:'' }
        ];
      },
      treeNote:function(){ return 'Notice the second-stage numbers change with the weather — that is a dependent tree, and exactly why trees earn their keep.'; },
      controls:null,
      wrongHint:function(br){
        return br.depth===1 ? 'Which weather are you sitting under? The bus cares.' : 'Check the branch against the story, then try again.';
      }
    },
    {
      id:'coins', chip:'Three coins',
      story:function(){ return 'A fair coin, flipped <b>three times</b>. Eight leaves — the tree scrolls sideways if it must.'; },
      variant:function(){ return 'coins'; },
      spec:coinsSpec,
      questions:function(){
        return [
          { text:'P(H, H, H)', paths:[0],
            note:'Halve, halve, halve. Every leaf of this tree is worth exactly 1/8.' },
          { text:'P(exactly two heads)', paths:[1,2,4],
            note:'Three paths, add them — HHT, HTH, THH. Same product, three orders.' },
          { text:'P(at least one tail)', paths:[1,2,3,4,5,6,7], complementLeaf:0,
            note:'“At least one” is code for 1 − P(none): 1 − 1/8, and you dodge seven paths of adding.' }
        ];
      },
      treeNote:function(){ return 'Fourteen branches, one number. Fair coins are gloriously boring.'; },
      controls:null,
      wrongHint:function(){ return 'It is a fair coin — both branches split the same way, every time.'; }
    },
    {
      id:'custom', chip:'Custom',
      story:function(){ return 'Your bag: <b>'+V.cr+' red</b> and <b>'+V.cb+' blue</b> counters, two draws, '+
        (V.crep ? 'each counter <b>replaced</b> before the next draw.' : '<b>without replacement</b>.')+
        ' Build it, fill it, answer on it.'; },
      variant:function(){ return 'custom-'+V.cr+'-'+V.cb+'-'+(V.crep?'r':'n'); },
      spec:function(){ return countersSpec(V.cr, V.cb, V.crep); },
      questions:function(){ return countersQuestions(V.cr, V.cb, 'red', 'blue'); },
      treeNote:function(){
        return V.crep ? 'Replacement means the bag never remembers — both fans repeat the first.'
          : 'One counter out — every second denominator drops to '+(V.cr+V.cb-1)+'.';
      },
      controls:'custom',
      wrongHint:function(br){
        if(!V.crep && br.depth===1) return 'Count what is actually left in the bag after that first draw.';
        return 'Check the branch against the story, then try again.';
      }
    }
  ];

  /* ══════════ view + per-variant state ══════════ */
  const STATES = {};    // key → {entries:{branchId:enteredString}, qi, phase}
  const V = {
    scen: SCEN[0],
    rep: false,               // scenario 1 toggle
    cr: 4, cb: 2, crep: false, // custom controls
    tree: null, state: null,
    phase: 'fill',            // fill | questions | done
    kpTarget: null, buf: '', attempts: 0, qs: [],
    selected: new Set(),      // leaf indices picked for the working line
    products: {},             // leafIndex → true ('new' = animate in)
    done: {}                  // scenarioId → true (chip tick)
  };
  let timers = [];
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
  function later(fn, ms){ timers.push(setTimeout(fn, REDUCED ? 0 : ms)); }

  function stateFor(key){
    if(!STATES[key]) STATES[key] = {entries:{}, qi:0, phase:'fill'};
    return STATES[key];
  }

  /* ══════════ DOM refs ══════════ */
  const $ = function(id){ return document.getElementById(id); };
  const chipsEl=$('chips'), storyEl=$('story'), ctlEl=$('ctlrow'), noteEl=$('notebar');
  const kpEl=$('kp'), kpHint=$('kpHint'), kpPrev=$('kpPrev'), kpGrid=$('kpGrid');
  const qcard=$('qcard'), qheadEl=$('qhead'), qtextEl=$('qtext'), qhintEl=$('qhint');
  const workingEl=$('working'), ansSlot=$('ansSlot'), checkBtn=$('checkBtn');
  const revealBtn=$('revealBtn'), nextQBtn=$('nextQBtn'), qfeedEl=$('qfeed');
  const compareEl=$('compare'), donebarEl=$('donebar');

  /* ══════════ keypad ══════════ */
  const KP_KEYS = ['7','8','9','4','5','6','1','2','3','.','0','⁄','C','↵'];
  KP_KEYS.forEach(function(k){
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = k;
    if(k==='⁄'||k==='.') b.className = 'op';
    if(k==='↵'){ b.className = 'enter'; b.textContent = '↵ enter'; b.setAttribute('aria-label','enter'); }
    if(k==='C') b.setAttribute('aria-label','clear entry');
    b.addEventListener('click', function(){ kpPress(k); });
    kpGrid.appendChild(b);
  });

  function kpPress(k){
    if(!V.kpTarget) return;
    if(k==='↵'){ commitEntry(); return; }
    if(k==='C'){ V.buf=''; syncKp(); return; }
    const ch = k==='⁄' ? '/' : k;
    if(ch==='/' && (V.buf.indexOf('/')>=0 || V.buf==='')) return;
    if(ch==='.' && (V.buf.indexOf('.')>=0 || V.buf.indexOf('/')>=0)) return;
    if(ch==='/' && V.buf.indexOf('.')>=0) return;   // no mixed 0.5/2
    if(V.buf.length>=9) return;
    V.buf += ch;
    syncKp();
  }

  function openKeypad(target){
    if(target.type==='branch'){
      const br = V.tree.branches.find(function(b){ return b.id===target.id; });
      if(!br || V.state.entries[br.id]) return;     // already filled
    }
    V.kpTarget = target;
    V.buf = '';
    kpEl.classList.add('open');
    document.body.classList.add('kpopen');
    syncKp();
    renderTree();
  }
  function closeKeypad(){
    V.kpTarget = null; V.buf = '';
    kpEl.classList.remove('open');
    document.body.classList.remove('kpopen');
    syncKp();
  }
  function syncKp(){
    if(!V.kpTarget){
      kpHint.textContent = V.phase==='questions' ? 'tap the answer slot below the tree' : 'tap a dashed ? on the tree';
      kpPrev.innerHTML = '&nbsp;';
    } else {
      kpHint.textContent = V.kpTarget.type==='branch' ? 'this branch’s probability' : 'your answer';
      kpPrev.innerHTML = V.buf ? htmlEntry(V.buf) : '<span style="color:var(--muted)">…</span>';
    }
    if(V.kpTarget && V.kpTarget.type==='answer'){
      ansSlot.classList.add('active');
      ansSlot.innerHTML = V.buf ? htmlEntry(V.buf) : '?';
    } else if(!ansSlot.classList.contains('okk')){
      ansSlot.classList.remove('active');
    }
  }

  /* commit the keypad buffer to its target */
  function commitEntry(){
    const ent = parseEntry(V.buf);
    if(V.kpTarget && V.kpTarget.type==='branch'){
      const br = V.tree.branches.find(function(b){ return b.id===V.kpTarget.id; });
      if(!br) return;
      if(!ent){ flashBad(br); setNote('That is not a number yet — a fraction needs both a top and a bottom.', false); return; }
      if(entryMatches(ent, br.p)){
        V.state.entries[br.id] = V.buf;
        setNote(pickAffirm(), true);
        closeKeypad();
        renderTree();
        checkTreeComplete();
      } else {
        flashBad(br);
        setNote(V.scen.wrongHint(br), false);
        V.buf=''; syncKp();
      }
    } else if(V.kpTarget && V.kpTarget.type==='answer'){
      checkAnswer(ent);
    }
  }
  function flashBad(br){
    if(!br.slotEl || REDUCED) return;
    br.slotEl.classList.remove('bad');
    br.slotEl.getBoundingClientRect();      // restart the animation
    br.slotEl.classList.add('bad');
  }
  const AFFIRM = ['Clean.','That’s the one.','Tidy.','Yes — on it goes.','Good counting.'];
  let affirmI = 0;
  function pickAffirm(){ return AFFIRM[(affirmI++) % AFFIRM.length]; }
  function setNote(msg, good){
    noteEl.textContent = msg;
    noteEl.classList.toggle('good', !!good);
  }

  /* ══════════ questions ══════════ */
  function buildQuestions(){
    const qs = V.scen.questions();
    qs.forEach(function(q){
      if(q.paths) q.ans = q.paths.reduce(function(acc, li){
        return fadd(acc, V.tree.leaves[li].prob);
      }, fr(0,1));
    });
    V.qs = qs;
  }

  function checkTreeComplete(){
    const all = V.tree.branches.every(function(b){ return V.state.entries[b.id]; });
    if(!all) return;
    if(V.phase==='fill'){
      V.phase = 'questions';
      V.state.phase = 'questions';
      setNote(V.scen.treeNote(), true);
      updateCompare();
    }
    showQuestion();
  }

  function showQuestion(){
    clearTimers();
    V.selected.clear(); V.products = {}; V.attempts = 0;
    renderTree();
    const qi = V.state.qi;
    if(qi >= V.qs.length){ finishScenario(); return; }
    const q = V.qs[qi];
    qcard.hidden = false; donebarEl.hidden = true;
    qheadEl.textContent = 'Question ('+String.fromCharCode(97+qi)+') · '+(qi+1)+' of '+V.qs.length;
    qtextEl.innerHTML = q.text;
    qhintEl.textContent = q.reveal
      ? '(JC preview — conditional probability)'
      : 'Tap the paths you think are involved — the working assembles here as you go.';
    workingEl.innerHTML = '—';
    qfeedEl.textContent = ''; qfeedEl.className = 'qfeed';
    ansSlot.className = 'ansslot'; ansSlot.innerHTML = '?';
    nextQBtn.hidden = true;
    const bits = document.querySelector('.entrybits');
    if(q.reveal){
      bits.style.display = 'none';
      revealBtn.hidden = false;
      revealBtn.textContent = 'Reveal the idea';
    } else {
      bits.style.display = '';
      revealBtn.hidden = true;
    }
    syncKp();
  }

  function termHtml(lv){
    const d = V.tree.spec.disp;
    return lv.pathBranches.map(function(bid){
      const b = V.tree.branches.find(function(x){ return x.id===bid; });
      return htmlNum(b.p, d);
    }).join('<span class="dimx"> × </span>');
  }
  function updateWorking(){
    if(!V.selected.size){ workingEl.innerHTML = '<span class="dimx">—</span>'; return; }
    const parts = [];
    Array.from(V.selected).sort(function(a,b){ return a-b; }).forEach(function(li){
      parts.push(termHtml(V.tree.leaves[li]));
    });
    workingEl.innerHTML = parts.join('<span class="dimx"> &nbsp;+&nbsp; </span>')+'<span class="dimx"> &nbsp;= …</span>';
  }

  function toggleLeaf(li){
    if(V.phase!=='questions') return;
    const q = V.qs[V.state.qi];
    if(!q || q.reveal || !nextQBtn.hidden) return;
    if(V.selected.has(li)) V.selected.delete(li); else V.selected.add(li);
    renderTree();
    updateWorking();
    if(V.selected.has(li)){
      const lv = V.tree.leaves[li];
      lv.pathBranches.forEach(function(bid){
        const b = V.tree.branches.find(function(x){ return x.id===bid; });
        if(b && b.slotEl && !REDUCED) b.slotEl.classList.add('pulse1');
      });
    }
  }

  /* draw one leaf's product without a full re-render (used mid-animation) */
  function drawProduct(li){
    if(V.products[li]) return;
    V.products[li] = true;
    const lv = V.tree.leaves[li];
    const n = lv.branch.node;
    const str = fShow(lv.prob, V.tree.spec.disp);
    const pg = el('g', {'class': REDUCED ? '' : 'fadein'}, svg);
    tEl(pg, lv.labelEndX+4, n.y+4.5, '=', {size:12, mono:1, fill:'var(--muted)', anchor:'start'});
    svgValue(pg, lv.labelEndX+18+(str.length*3.6), n.y, str, {size:11.5, fill:'var(--orange)'});
  }

  function checkAnswer(ent){
    const q = V.qs[V.state.qi];
    if(!q || q.reveal) return;
    if(!ent){
      qfeedEl.textContent = 'Type a fraction or a decimal first — the keypad is waiting.';
      qfeedEl.className = 'qfeed'; return;
    }
    if(entryMatches(ent, q.ans)){
      clearTimers();
      ansSlot.classList.remove('active'); ansSlot.classList.add('okk');
      ansSlot.innerHTML = htmlEntry(V.buf);
      closeKeypad();
      ansSlot.classList.add('okk');
      // canonical working, completed
      const canon = q.complementLeaf!=null
        ? '<span class="dimx">1 − </span>'+htmlNum(V.tree.leaves[q.complementLeaf].prob, V.tree.spec.disp)
        : q.paths.map(function(li){ return termHtml(V.tree.leaves[li]); }).join('<span class="dimx"> + </span>');
      workingEl.innerHTML = canon+'<span class="dimx"> = </span>'+htmlNum(q.ans, V.tree.spec.disp);
      qfeedEl.innerHTML = '✓ '+pickAffirm()+' '+esc(q.note);
      qfeedEl.className = 'qfeed good';
      nextQBtn.hidden = false;
      nextQBtn.focus();
    } else {
      V.attempts++;
      V.buf=''; syncKp();
      if(V.attempts===1){
        qfeedEl.textContent = 'Not this time. Watch the tree do it — multiply along, add across.';
        qfeedEl.className = 'qfeed bad';
        runReveal(q, false);
      } else {
        qfeedEl.innerHTML = 'Here it is, all the way: answer <b>'+esc(fShow(q.ans, V.tree.spec.disp))+'</b>. '+esc(q.note);
        qfeedEl.className = 'qfeed bad';
        runReveal(q, true);
      }
    }
  }

  /* the lesson animation: light each correct path, product at its leaf,
     then assemble the sum. showAns=true also writes the final value. */
  function runReveal(q, showAns){
    clearTimers();
    V.selected.clear();
    renderTree(); updateWorking();
    const seqPaths = q.complementLeaf!=null ? [q.complementLeaf] : q.paths;
    let t = 200;
    const stepGap = REDUCED ? 0 : 430;
    seqPaths.forEach(function(li){
      const lv = V.tree.leaves[li];
      lv.pathBranches.forEach(function(bid){
        later(function(){
          const b = V.tree.branches.find(function(x){ return x.id===bid; });
          if(b && b.lineEl) b.lineEl.classList.add('lit');
          if(b && b.slotEl && !REDUCED){ b.slotEl.classList.remove('pulse1'); b.slotEl.getBoundingClientRect(); b.slotEl.classList.add('pulse1'); }
        }, t);
        t += stepGap;
      });
      later(function(){ drawProduct(li); }, t);
      t += REDUCED ? 0 : 520;
    });
    later(function(){
      const d = V.tree.spec.disp;
      let html;
      if(q.complementLeaf!=null){
        html = '<span class="dimx">1 − </span>'+htmlNum(V.tree.leaves[q.complementLeaf].prob, d);
      } else {
        html = q.paths.map(function(li){ return termHtml(V.tree.leaves[li]); }).join('<span class="dimx"> + </span>');
      }
      html += showAns ? '<span class="dimx"> = </span>'+htmlNum(q.ans, d)
                      : '<span class="dimx"> = ?</span>';
      workingEl.innerHTML = html;
      if(showAns){ nextQBtn.hidden = false; }
      else if(q.complementLeaf!=null){
        qfeedEl.textContent = 'Those paths cover it — or subtract the one path that fails. Your call; type the value.';
        qfeedEl.className = 'qfeed';
      } else {
        qfeedEl.textContent = 'Multiply along each glowing path, add the products — then type the value.';
        qfeedEl.className = 'qfeed';
      }
    }, t+100);
  }

  /* scenario 3(c): conditional-probability reveal */
  function runCondReveal(){
    clearTimers();
    V.selected.clear(); V.products = {};
    renderTree();
    const num = V.tree.leaves[0].prob;                    // rain ∧ late
    const den = fadd(V.tree.leaves[0].prob, V.tree.leaves[2].prob);   // late
    const cond = fr(num.n*den.d, num.d*den.n);
    // light the two "late" paths; the rain one is the star
    [0,2].forEach(function(li, k){
      const lv = V.tree.leaves[li];
      lv.pathBranches.forEach(function(bid, j){
        later(function(){
          const b = V.tree.branches.find(function(x){ return x.id===bid; });
          if(b && b.lineEl) b.lineEl.classList.add(k===0 ? 'lit' : 'sel');
        }, 200 + (k*2+j)*380);
      });
      later(function(){ drawProduct(li); }, 200 + (k*2+2)*380);
    });
    later(function(){
      workingEl.innerHTML =
        'P(rain | late) <span class="dimx">=</span> '+
        '<span class="frac"><span class="fn">'+esc(fdec(num))+'</span><span class="fd">'+esc(fdec(den))+'</span></span>'+
        '<span class="dimx"> = </span>'+htmlNum(cond,'frac')+
        '<span class="dimx"> ≈ </span>'+esc(String(sig3(fnum(cond))));
      qfeedEl.innerHTML = 'Of all the late days (both glowing paths), the share that came through rain is the orange one. '+
        'That is conditional probability — the denominator shrinks to “late”. It waits for you at JC.';
      qfeedEl.className = 'qfeed good';
      revealBtn.hidden = true;
      nextQBtn.hidden = false;
    }, 200 + 4*380 + 450);
  }

  function nextQ(){
    V.state.qi++;
    showQuestion();
  }

  function finishScenario(){
    V.phase = 'done'; V.state.phase = 'done';
    V.done[V.scen.id] = true;
    qcard.hidden = true;
    donebarEl.hidden = false;
    donebarEl.textContent = V.scen.controls==='repToggle'
      ? '✓ Scenario complete. Flip the replacement toggle and feel the denominators change — or pick another chip.'
      : '✓ All questions answered. Pick another scenario when you are ready.';
    renderChips();
    updateCompare();
    clearTimers();
    closeKeypad();
  }

  /* ══════════ scenario-1 side-by-side compare ══════════ */
  function updateCompare(){
    const a = STATES['counters-norep'], b = STATES['counters-rep'];
    const both = a && b && a.phase!=='fill' && b.phase!=='fill';
    compareEl.classList.toggle('show', both && V.scen.id==='counters');
    if(!(both && V.scen.id==='counters')) return;
    const n1 = countersSpec(5,3,false), n2 = countersSpec(5,3,true);
    const p1 = fmul(n1.branchesFor([])[0].p, n1.branchesFor([0])[0].p);
    const p2 = fmul(n2.branchesFor([])[0].p, n2.branchesFor([0])[0].p);
    compareEl.innerHTML =
      '<div class="cbox"><h4>P(both red) — without replacement</h4>'+
      '<div class="big">'+htmlNum(fr(5,8),'frac')+' × '+htmlNum(fr(4,7),'frac')+' = '+htmlNum(p1,'frac')+
      ' <span style="color:var(--muted)">≈ '+sig3(fnum(p1))+'</span></div></div>'+
      '<div class="cbox"><h4>P(both red) — with replacement</h4>'+
      '<div class="big">'+htmlNum(fr(5,8),'frac')+' × '+htmlNum(fr(5,8),'frac')+' = '+htmlNum(p2,'frac')+
      ' <span style="color:var(--muted)">≈ '+sig3(fnum(p2))+'</span></div></div>'+
      '<div class="cbox" style="flex-basis:100%"><h4>why they differ</h4>'+
      'Taking a red out makes the second red <em>slightly</em> harder to get — '+
      htmlNum(fr(4,7),'frac')+' &lt; '+htmlNum(fr(5,8),'frac')+'. The bag remembers.</div>';
  }

  /* ══════════ chips / story / controls ══════════ */
  function renderChips(){
    chipsEl.textContent = '';
    SCEN.forEach(function(s){
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role','tab');
      b.setAttribute('aria-selected', s.id===V.scen.id ? 'true' : 'false');
      b.innerHTML = esc(s.chip)+(V.done[s.id] ? '<span class="tk">✓</span>' : '');
      if(s.id===V.scen.id) b.classList.add('on');
      b.addEventListener('click', function(){ if(s.id!==V.scen.id) applyScenario(s); });
      chipsEl.appendChild(b);
    });
  }

  function renderControls(){
    ctlEl.textContent = '';
    if(V.scen.controls==='repToggle'){
      const seg = document.createElement('div'); seg.className='seg';
      [['without replacement', false], ['with replacement', true]].forEach(function(opt){
        const b = document.createElement('button');
        b.type='button'; b.textContent = opt[0];
        if(V.rep===opt[1]) b.classList.add('on');
        b.addEventListener('click', function(){
          if(V.rep===opt[1]) return;
          V.rep = opt[1];
          applyScenario(V.scen);
        });
        seg.appendChild(b);
      });
      ctlEl.appendChild(seg);
    }
    if(V.scen.controls==='custom'){
      function numInput(labelTxt, val, set){
        const w = document.createElement('label');
        w.append(labelTxt+' ');
        const inp = document.createElement('input');
        inp.type='number'; inp.min='1'; inp.max='9'; inp.step='1'; inp.value=val;
        inp.inputMode='numeric';
        inp.addEventListener('change', function(){
          let v = Math.round(parseFloat(inp.value));
          if(!isFinite(v)) v = 1;
          v = Math.max(1, Math.min(9, v));
          inp.value = v;
          set(v);
          applyScenario(V.scen);
        });
        w.appendChild(inp);
        return w;
      }
      ctlEl.appendChild(numInput('red', V.cr, function(v){ V.cr=v; }));
      ctlEl.appendChild(numInput('blue', V.cb, function(v){ V.cb=v; }));
      const seg = document.createElement('div'); seg.className='seg';
      [['no replacement', false], ['replacement', true]].forEach(function(opt){
        const b = document.createElement('button');
        b.type='button'; b.textContent = opt[0];
        if(V.crep===opt[1]) b.classList.add('on');
        b.addEventListener('click', function(){
          if(V.crep===opt[1]) return;
          V.crep = opt[1];
          applyScenario(V.scen);
        });
        seg.appendChild(b);
      });
      ctlEl.appendChild(seg);
    }
  }

  function applyScenario(s){
    clearTimers();
    V.scen = s;
    V.tree = buildTree(typeof s.spec==='function' ? s.spec() : s.spec);
    V.state = stateFor(s.variant());
    V.phase = V.state.phase;
    V.selected.clear(); V.products = {}; V.attempts = 0;
    closeKeypad();
    buildQuestions();
    renderChips();
    storyEl.innerHTML = s.story();
    renderControls();
    renderTree();
    qcard.hidden = true; donebarEl.hidden = true;
    if(V.phase==='fill'){
      const left = V.tree.branches.filter(function(b){ return !V.state.entries[b.id]; }).length;
      setNote(left===V.tree.branches.length
        ? 'Tap any dashed ? and give that branch its probability.'
        : left+' branch'+(left===1?'':'es')+' still waiting.', false);
    } else if(V.phase==='questions'){
      setNote(V.scen.treeNote(), true);
      showQuestion();
    } else {
      setNote(V.scen.treeNote(), true);
      finishScenario();
    }
    updateCompare();
  }

  /* ══════════ wiring ══════════ */
  ansSlot.addEventListener('click', function(){
    const q = V.qs && V.qs[V.state.qi];
    if(V.phase!=='questions' || !q || q.reveal || !nextQBtn.hidden) return;
    openKeypad({type:'answer'});
  });
  checkBtn.addEventListener('click', function(){
    if(V.kpTarget && V.kpTarget.type==='answer'){ commitEntry(); }
    else ansSlot.click();
  });
  revealBtn.addEventListener('click', runCondReveal);
  nextQBtn.addEventListener('click', nextQ);

  document.addEventListener('keydown', function(e){
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.target && (e.target.tagName==='INPUT')) return;
    if(!V.kpTarget) return;
    if(/^[0-9]$/.test(e.key)){ e.preventDefault(); kpPress(e.key); }
    else if(e.key==='/'){ e.preventDefault(); kpPress('⁄'); }
    else if(e.key==='.'){ e.preventDefault(); kpPress('.'); }
    else if(e.key==='Enter'){ e.preventDefault(); commitEntry(); }
    else if(e.key==='Backspace'){ e.preventDefault(); V.buf = V.buf.slice(0,-1); syncKp(); }
    else if(e.key==='Escape'){ e.preventDefault(); closeKeypad(); renderTree(); }
  });

  let rafPending = false;
  function onResize(){
    if(rafPending) return;
    rafPending = true;
    requestAnimationFrame(function(){ rafPending = false; if(V.tree) renderTree(); });
  }
  window.addEventListener('resize', onResize);
  if(typeof ResizeObserver!=='undefined') new ResizeObserver(onResize).observe(treewrap);

  applyScenario(SCEN[0]);
})();
</script>
</body>
