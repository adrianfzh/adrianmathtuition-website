<script>
(function(){
  "use strict";
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const ro = document.getElementById('ro');
  const stmt = document.getElementById('stmt');
  const hintEl = document.getElementById('hint');

  const TAU = Math.PI*2;
  const COL = {bg:'#F8FAFC', ink:'#142033', muted:'#5A6B80', line:'#AEBDCE',
               rose:'#B04A62', teal:'#1F6F84', orange:'#C85A2E', plum:'#6B4E9C'};
  const GRAB = 26;        // generous grab radius (px)
  const SNAP_PX = 7;      // snap when within this many px of a nice ratio

  // ---- state ----------------------------------------------------------
  let mode  = 'bases';            // 'bases' | 'similar'
  let scene = 'split';            // mode 1: 'split' | 'trap' | 'cut'
  const sp  = {t: 0.4, ax: 0.13}; // 1a: P at BP/BC = t; apex offset ax (fraction of half-base *2)
  const tz  = {a: 2, b: 3};       // 1b: parallel side lengths (abstract units)
  const cut = {k: 2/3};           // 1c: AP/AB
  const sim = {k: 1.5, reverse: false, vols: true, A1: 81, A2: 121};

  // ---- sizing ---------------------------------------------------------
  let W=0, H=0, DPR=1;
  function resize(){
    const r = cv.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio||1, 2.5);
    W = r.width; H = r.height;
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    redraw();
  }
  window.addEventListener('resize', resize);
  // the stage box also changes when the statement/readout heights change
  // (they are flex siblings) — a window 'resize' never fires for that.
  if(window.ResizeObserver){
    new ResizeObserver(()=>{
      const r=cv.getBoundingClientRect();
      if(Math.abs(r.width-W)>0.5 || Math.abs(r.height-H)>0.5) resize();
    }).observe(cv);
  }

  function stageBox(){
    // keep the figures clear of the readout panel, whatever its current height
    const roH = ro ? ro.offsetHeight : 0;
    const top = Math.max(W < 700 ? 120 : 90, 12 + roH + 14);
    return {x:16, y:top, w:W-32, h:Math.max(H-top-16, 150)};
  }

  // ---- pure geometry (shared by drawing AND the check harness) --------
  function lerp(p,q,t){ return {x:p.x+(q.x-p.x)*t, y:p.y+(q.y-p.y)*t}; }
  function dist(p,q){ return Math.hypot(p.x-q.x, p.y-q.y); }
  function lineX(p1,p2,p3,p4){ // intersection of lines p1p2 and p3p4
    const d1x=p2.x-p1.x, d1y=p2.y-p1.y, d2x=p4.x-p3.x, d2y=p4.y-p3.y;
    const den = d1x*d2y - d1y*d2x;
    const t = ((p3.x-p1.x)*d2y - (p3.y-p1.y)*d2x)/den;
    return {x:p1.x+t*d1x, y:p1.y+t*d1y};
  }
  function areaPoly(pts){ // shoelace, always positive
    let s=0;
    for(let i=0;i<pts.length;i++){
      const p=pts[i], q=pts[(i+1)%pts.length];
      s += p.x*q.y - q.x*p.y;
    }
    return Math.abs(s)/2;
  }
  function polyCentroid(pts){
    let a=0, cx=0, cy=0;
    for(let i=0;i<pts.length;i++){
      const p=pts[i], q=pts[(i+1)%pts.length];
      const cr = p.x*q.y - q.x*p.y;
      a += cr; cx += (p.x+q.x)*cr; cy += (p.y+q.y)*cr;
    }
    a /= 2;
    return {x: cx/(6*a), y: cy/(6*a)};
  }
  function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a; }

  // Scene 1a: triangle ABC, base BC horizontal, P on BC at parameter t = BP/BC.
  function splitGeom(t, ax, bx){
    const baseY = bx.y + bx.h - 46;
    const half  = Math.min(bx.w*0.44, 340);
    const cxm   = bx.x + bx.w/2;
    const B = {x: cxm - half, y: baseY};
    const C = {x: cxm + half, y: baseY};
    const A = {x: cxm + ax*2*half, y: bx.y + 22};
    const P = {x: B.x + t*(C.x - B.x), y: baseY};
    const F = {x: A.x, y: baseY};       // foot of the height from A (BC is horizontal)
    return {A,B,C,P,F, half, cxm, baseY};
  }

  // Scene 1b: isosceles trapezium, AB = a (top) ∥ DC = b (bottom); X = diagonals' meet.
  function trapGeom(a, b, bx){
    const u    = bx.w / 6.6;                       // px per abstract unit
    const yBot = bx.y + bx.h - 42;
    const yTop = yBot - Math.min(bx.h - 76, bx.h*0.72);
    const cxm  = bx.x + bx.w/2;
    const A = {x: cxm - a*u/2, y: yTop}, B = {x: cxm + a*u/2, y: yTop};
    const C = {x: cxm + b*u/2, y: yBot}, D = {x: cxm - b*u/2, y: yBot};
    const X = lineX(A, C, B, D);
    return {A,B,C,D,X, u, yTop, yBot, cxm};
  }

  // Scene 1c: triangle ABC cut by PQ ∥ BC at parameter k = AP/AB.
  function cutGeom(k, bx){
    const baseY = bx.y + bx.h - 46;
    const half  = Math.min(bx.w*0.42, 330);
    const cxm   = bx.x + bx.w/2;
    const B = {x: cxm - half, y: baseY};
    const C = {x: cxm + half, y: baseY};
    const A = {x: cxm + 0.10*half, y: bx.y + 22};
    const P = lerp(A, B, k), Q = lerp(A, C, k);
    return {A,B,C,P,Q, baseY};
  }

  // Mode 2 layout: two L-shapes on one ground line, unit tiles at the SAME absolute unit.
  const K_MAX = 3;
  function simLayout(bx){
    const gap = Math.max(24, bx.w*0.045);
    const s1  = Math.min((bx.w - gap - 12)/(2 + 2*K_MAX), (bx.h - 68)/(2*K_MAX));
    const gy  = bx.y + bx.h - 46;   // room below for the two label rows
    const o1  = {x: bx.x + 6, y: gy};
    const o2  = {x: o1.x + 2*s1 + gap, y: gy};
    return {s1, gap, gy, o1, o2};
  }
  function lshapePts(o, s){ // unit outline (0,0)(2,0)(2,1)(1,1)(1,2)(0,2), area 3 u²; y up → canvas y down
    return [[0,0],[2,0],[2,1],[1,1],[1,2],[0,2]].map(u => ({x:o.x+u[0]*s, y:o.y-u[1]*s}));
  }

  // ---- nice-ratio snap tables -----------------------------------------
  // 1a: P snaps to BP:PC = m:n with m+n ≤ 9 (lowest terms).
  const SPLIT_SNAPS = (()=>{ const out=[];
    for(let s=2; s<=9; s++) for(let m=1; m<s; m++){ const n=s-m; if(gcd(m,n)===1) out.push({v:m/s, m, n}); }
    return out; })();
  // 1b: a : b snaps to m : n with m,n ≤ 5.
  const TRAP_PAIRS = (()=>{ const out=[];
    for(let m=1; m<=5; m++) for(let n=1; n<=5; n++){ if(gcd(m,n)===1) out.push({m, n}); }
    return out; })();
  // 1c: k snaps to m/n, n ≤ 6.
  const CUT_SNAPS = (()=>{ const out=[];
    for(let n=2; n<=6; n++) for(let m=1; m<n; m++){ if(gcd(m,n)===1) out.push({v:m/n, m, n}); }
    return out; })();
  // Mode 2: k snaps to p/q with q ≤ 4, 1 ≤ k ≤ 3.
  const K_SNAPS = (()=>{ const out=[];
    for(let q=1; q<=4; q++) for(let p=q; p<=3*q; p++){ if(gcd(p,q)===1) out.push({v:p/q, p, q}); }
    return out; })();

  function fracOf(x, list, eps){
    eps = eps || 1e-7;
    for(const f of list){ if(Math.abs(f.v - x) < eps) return f; }
    return null;
  }
  function trapFrac(a, b){
    for(const f of TRAP_PAIRS){ if(Math.abs(a/b - f.m/f.n) < 1e-7) return f; }
    return null;
  }
  function snapValue(raw, list, pxPerUnit){ // snap raw to nearest table value if within SNAP_PX on screen
    let best=null, bd=Infinity;
    for(const f of list){ const d=Math.abs(f.v-raw); if(d<bd){bd=d; best=f;} }
    return (best && bd*pxPerUnit < SNAP_PX) ? best.v : raw;
  }

  // Reverse direction: given surface areas A1:A2, derive lengths and volumes.
  function isqrtExact(n){ const r=Math.round(Math.sqrt(n)); return r*r===n ? r : null; }
  function deriveReverse(A1, A2){
    const r1=isqrtExact(A1), r2=isqrtExact(A2);
    if(r1!==null && r2!==null){
      const g=gcd(r1,r2), L1=r1/g, L2=r2/g;
      return {exact:true, L1, L2, V1:L1*L1*L1, V2:L2*L2*L2, k:L2/L1};
    }
    return {exact:false, k:Math.sqrt(A2/A1)};
  }

  // ---- draw helpers ---------------------------------------------------
  function seg2(p,q,color,w,alpha,dash){
    ctx.save();
    if(dash) ctx.setLineDash(dash);
    ctx.globalAlpha = alpha==null ? 1 : alpha;
    ctx.strokeStyle = color; ctx.lineWidth = w||1.5;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
    ctx.restore();
  }
  function poly(pts, fill, alpha, stroke, sw){
    ctx.save();
    ctx.beginPath();
    pts.forEach((p,i)=> i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
    ctx.closePath();
    if(fill){ ctx.globalAlpha = alpha==null ? .3 : alpha; ctx.fillStyle=fill; ctx.fill(); }
    if(stroke){ ctx.globalAlpha=1; ctx.strokeStyle=stroke; ctx.lineWidth=sw||1.6; ctx.stroke(); }
    ctx.restore();
  }
  function dotAt(p,r,color){
    ctx.fillStyle=color; ctx.beginPath(); ctx.arc(p.x,p.y,r,0,TAU); ctx.fill();
  }
  function handleAt(p, hot){
    ctx.save();
    ctx.beginPath(); ctx.arc(p.x,p.y, hot?9.5:7.5, 0,TAU);
    ctx.fillStyle=COL.orange; ctx.fill();
    ctx.lineWidth=2.2; ctx.strokeStyle='#fff'; ctx.stroke();
    ctx.restore();
  }
  function label(p, str, color, size, align, italic, baseline){
    ctx.fillStyle=color;
    ctx.font=(italic===false ? '' : 'italic ')+(size||16)+'px Georgia, serif';
    ctx.textAlign=align||'center'; ctx.textBaseline=baseline||'middle';
    ctx.fillText(str, p.x, p.y);
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }
  function fmt(n){ return Math.round(n).toLocaleString('en-US'); }

  // ====================================================================
  // MODE 1 — same height ⇒ areas ∝ bases
  // ====================================================================

  // Scene 1a — split a triangle at P on BC
  function drawSplit(){
    const g = splitGeom(sp.t, sp.ax, stageBox());
    const {A,B,C,P,F} = g;

    // sub-triangle fills
    poly([A,B,P], COL.rose, .30);
    poly([A,P,C], COL.teal, .28);

    // shared height, dashed, with right-angle foot
    seg2(A, F, COL.muted, 1.5, .9, [6,5]);
    const s=9, sgn = (F.x < (B.x+C.x)/2) ? 1 : -1; // square opens toward triangle middle
    ctx.save(); ctx.strokeStyle=COL.muted; ctx.globalAlpha=.9; ctx.lineWidth=1.2;
    ctx.strokeRect(Math.min(F.x, F.x+sgn*s), F.y-s, s, s);
    ctx.restore();
    label({x:F.x-12, y:(A.y+F.y)*0.52}, 'h', COL.muted, 15, 'right');

    // edges
    poly([A,B,C], null, 0, COL.ink, 2);
    seg2(A, P, COL.ink, 1.7, .95);

    const sn = fracOf(sp.t, SPLIT_SNAPS);
    const BP = P.x-B.x, PC = C.x-P.x, h = F.y-A.y;
    const a1 = areaPoly([A,B,P]), a2 = areaPoly([A,P,C]);

    // base ruler: when snapped, tick BC into m+n equal parts
    if(sn){
      const parts = sn.m + sn.n;
      for(let i=0; i<=parts; i++){
        const x = B.x + (C.x-B.x)*i/parts;
        seg2({x, y:g.baseY+7}, {x, y:g.baseY+15}, i<=sn.m ? COL.rose : COL.teal, 1.6, .9);
      }
      seg2({x:B.x, y:g.baseY+11}, {x:P.x, y:g.baseY+11}, COL.rose, 1.4, .8);
      seg2({x:P.x, y:g.baseY+11}, {x:C.x, y:g.baseY+11}, COL.teal, 1.4, .8);
      label({x:(B.x+P.x)/2, y:g.baseY+27}, sn.m+' part'+(sn.m>1?'s':''), COL.rose, 13);
      label({x:(P.x+C.x)/2, y:g.baseY+27}, sn.n+' part'+(sn.n>1?'s':''), COL.teal, 13);
    } else {
      label({x:(B.x+P.x)/2, y:g.baseY+24}, 'BP', COL.rose, 13);
      label({x:(P.x+C.x)/2, y:g.baseY+24}, 'PC', COL.teal, 13);
    }

    // vertex labels
    label({x:A.x, y:A.y-13}, 'A', COL.ink, 17);
    label({x:B.x-13, y:B.y+6}, 'B', COL.ink, 17);
    label({x:C.x+13, y:C.y+6}, 'C', COL.ink, 17);
    label({x:P.x, y:P.y-21}, 'P', COL.orange, 16);

    // area numbers at the centroids
    const c1=polyCentroid([A,B,P]), c2=polyCentroid([A,P,C]);
    if(sn){
      label(c1, String(sn.m), COL.rose, 27, 'center', false);
      label(c2, String(sn.n), COL.teal, 27, 'center', false);
    } else {
      label(c1, (a1/a2).toFixed(2), COL.rose, 18, 'center', false);
      label(c2, '1', COL.teal, 18, 'center', false);
    }

    handleAt(P, hover==='P'||dragTok==='P');
    handleAt(A, hover==='A'||dragTok==='A');

    // readout — areas computed from the actual drawn coordinates
    const live = (BP/PC).toFixed(3);
    ro.innerHTML =
      (sn
        ? '<span class="k">BP : PC =</span> <b>'+sn.m+' : '+sn.n+'</b> <span class="k">⇒</span> <span class="k">area</span> <span class="r">△ABP</span> : <span class="t">△APC</span> = <b>'+sn.m+' : '+sn.n+'</b><br>'
        : '<span class="k">BP : PC =</span> <b>'+live+' : 1</b> <span class="k">⇒ areas in the same ratio</span><br>')+
      '<span class="r">△ABP</span> = ½·BP·h = '+fmt(a1)+' px²<br>'+
      '<span class="t">△APC</span> = ½·PC·h = '+fmt(a2)+' px²<br>'+
      '<span class="k">live from coordinates:</span> '+fmt(a1)+' : '+fmt(a2)+' = <b>'+(a1/a2).toFixed(4)+'</b>'+
      '<span class="k"> · bases '+(BP/PC).toFixed(4)+'</span><br>'+
      '<span class="k">same apex A, same height h = '+Math.round(h)+' px — only the bases differ</span>';
  }

  // Scene 1b — trapezium diagonals: a², b², ab, ab
  function drawTrap(){
    const g = trapGeom(tz.a, tz.b, stageBox());
    const {A,B,C,D,X} = g;

    // the four triangles
    poly([A,B,X], COL.rose,   .32);   // top
    poly([D,C,X], COL.teal,   .28);   // bottom
    poly([A,X,D], COL.orange, .30);   // left  — same colour as right: equal areas
    poly([B,C,X], COL.orange, .30);   // right

    // shared-height nod: dashed vertical through X between the parallels
    seg2({x:X.x, y:g.yTop}, {x:X.x, y:g.yBot}, COL.muted, 1.2, .55, [5,5]);

    // outline + diagonals
    poly([A,B,C,D], null, 0, COL.ink, 2);
    seg2(A, C, COL.ink, 1.5, .9);
    seg2(B, D, COL.ink, 1.5, .9);

    const sn = trapFrac(tz.a, tz.b);
    // side labels
    label({x:(A.x+B.x)/2, y:g.yTop-14}, sn ? ('a = '+sn.m) : ('a = '+tz.a.toFixed(2)), COL.ink, 15);
    label({x:(D.x+C.x)/2, y:g.yBot+18}, sn ? ('b = '+sn.n) : ('b = '+tz.b.toFixed(2)), COL.ink, 15);
    label({x:A.x-12, y:A.y-8}, 'A', COL.ink, 16);
    label({x:B.x+12, y:B.y-8}, 'B', COL.ink, 16);
    label({x:C.x+13, y:C.y+8}, 'C', COL.ink, 16);
    label({x:D.x-13, y:D.y+8}, 'D', COL.ink, 16);
    label({x:X.x+14, y:X.y-2}, 'X', COL.ink, 14);

    // live areas from the drawn coordinates
    const top=areaPoly([A,B,X]), bot=areaPoly([D,C,X]),
          left=areaPoly([A,X,D]), right=areaPoly([B,C,X]);

    const cT=polyCentroid([A,B,X]), cB=polyCentroid([D,C,X]),
          cL=polyCentroid([A,X,D]), cR=polyCentroid([B,C,X]);
    if(sn){
      const m=sn.m, n=sn.n;
      label({x:cT.x, y:cT.y+2}, String(m*m), COL.rose, 24, 'center', false);
      label({x:cB.x, y:cB.y+4}, String(n*n), COL.teal, 24, 'center', false);
      label(cL, String(m*n), COL.orange, 22, 'center', false);
      label(cR, String(m*n), COL.orange, 22, 'center', false);
    } else {
      const s = left; // normalise to a side triangle = 1
      label({x:cT.x, y:cT.y+2}, (top/s).toFixed(2), COL.rose, 15, 'center', false);
      label({x:cB.x, y:cB.y+4}, (bot/s).toFixed(2), COL.teal, 15, 'center', false);
      label(cL, '1', COL.orange, 15, 'center', false);
      label(cR, (right/s).toFixed(2), COL.orange, 15, 'center', false);
    }

    handleAt(B, hover==='a'||dragTok==='a');
    handleAt(C, hover==='b'||dragTok==='b');

    if(sn){
      const m=sn.m, n=sn.n, sum=(m+n)*(m+n);
      ro.innerHTML =
        '<span class="k">a : b =</span> <b>'+m+' : '+n+'</b><br>'+
        '<span class="r">top △ABX</span> : <span class="t">bottom △CDX</span> = a² : b² = <b>'+(m*m)+' : '+(n*n)+'</b>'+
        ' <span class="k">— △ABX ∼ △CDX (AB ∥ DC)</span><br>'+
        '<span class="o">side △AXD = △BXC</span> = a·b = <b>'+(m*n)+' each</b>'+
        ' <span class="k">— each shares a height with top &amp; bottom</span><br>'+
        '<span class="k">check:</span> '+(m*m)+' + '+(n*n)+' + '+(m*n)+' + '+(m*n)+' = <b>'+sum+'</b> = (a+b)²<br>'+
        '<span class="k">live px² from coordinates: '+fmt(top)+' : '+fmt(bot)+' : '+fmt(left)+' : '+fmt(right)+'</span>';
    } else {
      const r=tz.a/tz.b;
      ro.innerHTML =
        '<span class="k">a : b =</span> <b>'+r.toFixed(3)+' : 1</b><br>'+
        '<span class="r">top</span> : <span class="t">bottom</span> = a² : b² = <b>'+(r*r).toFixed(3)+' : 1</b><br>'+
        '<span class="o">sides</span> = a·b <span class="k">(equal by shared heights)</span><br>'+
        '<span class="k">live px²: '+fmt(top)+' : '+fmt(bot)+' : '+fmt(left)+' : '+fmt(right)+'</span>';
    }
  }

  // Scene 1c — cut parallel to the base: k² and 1−k²
  function drawCut(){
    const g = cutGeom(cut.k, stageBox());
    const {A,B,C,P,Q} = g;

    poly([A,P,Q], COL.rose, .32);
    poly([P,B,C,Q], COL.teal, .26);

    poly([A,B,C], null, 0, COL.ink, 2);
    seg2(P, Q, COL.orange, 2.6, .95);

    // ∥ chevrons on PQ and BC
    function chev(p, q){
      const mx=(p.x+q.x)/2, my=(p.y+q.y)/2;
      const a=Math.atan2(q.y-p.y, q.x-p.x), L=7;
      ctx.save(); ctx.strokeStyle=COL.ink; ctx.globalAlpha=.75; ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(mx - L*Math.cos(a-0.5), my - L*Math.sin(a-0.5));
      ctx.lineTo(mx, my);
      ctx.lineTo(mx - L*Math.cos(a+0.5), my - L*Math.sin(a+0.5));
      ctx.stroke(); ctx.restore();
    }
    chev(P,Q); chev(B,C);

    label({x:A.x, y:A.y-13}, 'A', COL.ink, 17);
    label({x:B.x-13, y:B.y+6}, 'B', COL.ink, 17);
    label({x:C.x+13, y:C.y+6}, 'C', COL.ink, 17);
    label({x:P.x-14, y:P.y}, 'P', COL.orange, 16, 'right');
    label({x:Q.x+14, y:Q.y}, 'Q', COL.orange, 16, 'left');

    const sn = fracOf(cut.k, CUT_SNAPS);
    const aS=areaPoly([A,P,Q]), aW=areaPoly([A,B,C]);
    const cS=polyCentroid([A,P,Q]), cStrip=polyCentroid([P,B,C,Q]);
    if(sn){
      label(cS, String(sn.m*sn.m), COL.rose, 24, 'center', false);
      label(cStrip, String(sn.n*sn.n - sn.m*sn.m), COL.teal, 24, 'center', false);
    } else {
      label(cS, (cut.k*cut.k).toFixed(2), COL.rose, 16, 'center', false);
      label(cStrip, (1-cut.k*cut.k).toFixed(2), COL.teal, 16, 'center', false);
    }

    handleAt(P, hover==='k'||dragTok==='k');
    handleAt(Q, hover==='k'||dragTok==='k');

    if(sn){
      const m=sn.m, n=sn.n;
      ro.innerHTML =
        '<span class="k">AP : AB = k =</span> <b>'+m+'/'+n+'</b> <span class="k">('+cut.k.toFixed(3)+')</span><br>'+
        '<span class="r">△APQ</span> : <span class="k">whole</span> △ABC = k² = <b>'+(m*m)+' : '+(n*n)+'</b><br>'+
        '<span class="t">strip PBCQ</span> : whole = 1 − k² = <b>'+(n*n-m*m)+' : '+(n*n)+'</b><br>'+
        '<span class="k">live from coordinates: △APQ '+fmt(aS)+' px² · △ABC '+fmt(aW)+' px² · ratio '+(aS/aW).toFixed(4)+' = k²</span>';
    } else {
      ro.innerHTML =
        '<span class="k">AP : AB = k =</span> <b>'+cut.k.toFixed(3)+'</b><br>'+
        '<span class="r">△APQ</span> : whole = k² = <b>'+(cut.k*cut.k).toFixed(3)+'</b><br>'+
        '<span class="t">strip</span> : whole = 1 − k² = <b>'+(1-cut.k*cut.k).toFixed(3)+'</b><br>'+
        '<span class="k">live: '+fmt(aS)+' px² / '+fmt(aW)+' px² = '+(aS/aW).toFixed(4)+'</span>';
    }
  }

  // ====================================================================
  // MODE 2 — similar figures: k, k², k³
  // ====================================================================
  function tileFill(pts, origin, step, fill){
    ctx.save();
    ctx.beginPath();
    pts.forEach((p,i)=> i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
    ctx.closePath();
    ctx.globalAlpha=.16; ctx.fillStyle=fill; ctx.fill();
    ctx.clip();
    // unit-square grid at the SAME absolute unit for both figures
    let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
    for(const p of pts){ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y); }
    ctx.globalAlpha=.55; ctx.strokeStyle=COL.muted; ctx.lineWidth=1;
    ctx.beginPath();
    for(let x=origin.x; x<=maxX+0.5; x+=step){ ctx.moveTo(x, minY-1); ctx.lineTo(x, maxY+1); }
    for(let y=origin.y; y>=minY-0.5; y-=step){ ctx.moveTo(minX-1, y); ctx.lineTo(maxX+1, y); }
    ctx.stroke();
    ctx.restore();
  }

  function cuboid(o, s, colr){ // o = front bottom-left corner, s = edge px, cabinet oblique
    const d=s*0.52, dx=d*0.85, dy=-d*0.5;
    const f=[{x:o.x,y:o.y},{x:o.x+s,y:o.y},{x:o.x+s,y:o.y-s},{x:o.x,y:o.y-s}];
    const b=f.map(p=>({x:p.x+dx, y:p.y+dy}));
    poly([f[3],f[2],b[2],b[3]], colr, .13, colr, 1.2);  // top
    poly([f[1],b[1],b[2],f[2]], colr, .22, colr, 1.2);  // right
    poly(f, colr, .09, colr, 1.4);                      // front
    return dx;
  }

  function drawSimilar(){
    const bx = stageBox();
    const L = simLayout(bx);
    const rev = sim.reverse ? deriveReverse(sim.A1, sim.A2) : null;
    const k = sim.reverse ? rev.k : sim.k;
    const f = sim.reverse
      ? (rev.exact ? {v:k, p:rev.L2, q:rev.L1} : null)
      : fracOf(sim.k, K_SNAPS);

    const P1 = lshapePts(L.o1, L.s1);
    const P2 = lshapePts(L.o2, L.s1*k);

    // ground line
    seg2({x:bx.x, y:L.gy}, {x:bx.x+bx.w, y:L.gy}, COL.line, 1.4, .9);

    tileFill(P1, L.o1, L.s1, COL.teal);
    tileFill(P2, L.o2, L.s1, COL.teal);
    poly(P1, null, 0, COL.ink, 2);
    poly(P2, null, 0, COL.ink, 2);

    // bottom-edge length callouts (lengths ×k)
    const isInt = f && f.q===1 && Number.isInteger(f.v);
    label({x:L.o1.x + L.s1, y:L.gy+16},
          '2', COL.orange, 14, 'center', false);
    const twoK = 2*k;
    label({x:L.o2.x + L.s1*k, y:L.gy+16},
          '2·k = '+(Math.abs(twoK-Math.round(twoK))<1e-9 ? String(Math.round(twoK)) : twoK.toFixed(2)),
          COL.orange, 14, 'center', false);

    // tile counts under the figures
    const t2 = 3*k*k;
    label({x:L.o1.x + L.s1, y:L.gy+34}, '3 tiles', COL.teal, 13, 'center', false);
    label({x:L.o2.x + L.s1*k, y:L.gy+34},
          isInt ? (t2.toFixed(0)+' tiles — count them') : (t2.toFixed(2)+' unit²'),
          COL.teal, 13, 'center', false);

    // corner drag handle (forward mode only)
    if(!sim.reverse){
      handleAt({x:L.o2.x + 2*L.s1*k, y:L.gy}, hover==='k2'||dragTok==='k2');
    }

    // similar cuboids, drawn obliquely (volumes row)
    if(sim.vols){
      const cs = Math.min(L.s1*0.52, (bx.w*0.30)/(1.45*(1+k)));
      const yc = bx.y + 12 + cs*k;
      const x2 = bx.x + bx.w - 8 - cs*k*1.45;
      const x1 = x2 - cs*1.45 - 18;
      cuboid({x:x1, y:yc}, cs, COL.plum);
      cuboid({x:x2, y:yc}, cs*k, COL.plum);
      label({x:x1+cs*0.7, y:yc+14}, f ? String(f.q) : '1', COL.plum, 13, 'center', false);
      label({x:x2+cs*k*0.7, y:yc+14}, f ? String(f.p) : k.toFixed(2), COL.plum, 13, 'center', false);
      label({x:(x1+x2+cs*k*1.45)/2 - 8, y:yc+32},
            f ? ('volumes '+(f.q**3)+' : '+(f.p**3)) : ('volumes 1 : '+(k**3).toFixed(2)),
            COL.plum, 13, 'center', false);
    }

    // readout — the chain
    const NB='&nbsp;';
    if(sim.reverse){
      const d = rev;
      const kStr = d.k.toFixed(3);
      ro.innerHTML =
        '<span class="k">GIVEN</span> <span class="t">surface areas</span> = <b>'+sim.A1+' : '+sim.A2+'</b><br>'+
        '<span class="k">√ both ⇒</span> <span class="o">lengths</span>'+NB+'= <b>'+
          (d.exact ? d.L1+' : '+d.L2 : '1 : '+kStr)+'</b> <span class="k">(k = '+kStr+')</span><br>'+
        '<span class="k">cube ⇒</span>'+NB+' <span class="p">volumes</span> = <b>'+
          (d.exact ? d.V1+' : '+d.V2 : '1 : '+(d.k**3).toFixed(3))+'</b><br>'+
        '<span class="k">area ratio first: root it for lengths, only then cube for volumes</span>';
    } else {
      const len = f ? f.q+' : '+f.p : '1 : '+k.toFixed(2);
      const ar  = f ? (f.q*f.q)+' : '+(f.p*f.p) : '1 : '+(k*k).toFixed(2);
      const vol = f ? (f.q**3)+' : '+(f.p**3) : '1 : '+(k**3).toFixed(2);
      ro.innerHTML =
        '<span class="k">k (length scale factor) =</span> <b>'+k.toFixed(3)+'</b><br>'+
        '<span class="o">lengths</span>'+NB+NB+'<b>'+len+'</b> <span class="k">×k</span><br>'+
        '<span class="t">areas</span>'+NB+NB+NB+NB+'<b>'+ar+'</b> <span class="k">×k² = '+(k*k).toFixed(3)+'</span><br>'+
        (sim.vols ? '<span class="p">volumes</span>'+NB+NB+'<b>'+vol+'</b> <span class="k">×k³ = '+(k**3).toFixed(3)+'</span><br>' : '')+
        (isInt
          ? '<span class="k">tiles:</span> 3 → <b>'+(3*k*k).toFixed(0)+'</b> <span class="k">— literally ×'+(k*k).toFixed(0)+' the tiles</span>'
          : '<span class="k">areas: 3 u² → '+(3*k*k).toFixed(2)+' u² (×'+(k*k).toFixed(2)+')</span>');
    }
  }

  // ====================================================================
  // Wiring — view switching, pointer drags with snapping, controls
  // ====================================================================
  const modeSeg = document.getElementById('modeSeg');
  const sceneSeg = document.getElementById('sceneSeg');
  const dirSeg = document.getElementById('dirSeg');
  const presetSeg = document.getElementById('presetSeg');
  const kGrp = document.getElementById('kGrp');
  const volGrp = document.getElementById('volGrp');
  const kRange = document.getElementById('kRange');
  const kVal = document.getElementById('kVal');
  const volBtn = document.getElementById('volBtn');
  const resetBtn = document.getElementById('reset');

  const PRESETS = [[4,9],[9,16],[16,25],[25,36],[49,64],[81,121],[9,25],[4,25]];
  PRESETS.forEach(pr=>{
    const b=document.createElement('button');
    b.textContent = pr[0]+' : '+pr[1];
    b.dataset.a1=pr[0]; b.dataset.a2=pr[1];
    if(pr[0]===sim.A1 && pr[1]===sim.A2) b.classList.add('on');
    presetSeg.appendChild(b);
  });

  const STMTS = {
    split: '<b>Same apex, same height.</b> △ABP = ½·BP·h and △APC = ½·PC·h share the height h from A — so area △ABP : area △APC = BP : PC. The bases carry the whole ratio.',
    trap:  'AB ∥ DC ⇒ <b>△ABX ∼ △CDX</b> with ratio a : b ⇒ areas a² : b². Each side triangle shares a height with top and bottom (bases along the same diagonal) ⇒ area a·b each. Total = (a+b)².',
    cut:   'PQ ∥ BC ⇒ <b>△APQ ∼ △ABC</b> with length ratio k = AP/AB ⇒ area ratio k², <i>not</i> k. The strip is what is left: 1 − k².',
    fwd:   '<b>k multiplies every length.</b> Area = length × length ⇒ ×k². Volume = length × length × length ⇒ ×k³. Lengths 2 : 3 means areas 4 : 9 — never 2 : 3.',
    rev:   '<b>The exam gives AREAS.</b> Take square roots for lengths, then cube for volumes: 81 : 121 ⇒ 9 : 11 ⇒ 729 : 1331. Writing 81³ : 121³ (cubing the areas) is the classic slip.'
  };
  const HINTS = {
    split: 'drag P along BC · drag apex A sideways',
    trap:  'drag corner B (top) or C (bottom) to change a : b',
    cut:   'drag the cut line P–Q up and down',
    fwd:   'drag the big figure’s corner · or use the k slider',
    rev:   'pick a surface-area ratio in the row above'
  };

  function applyView(){
    [...modeSeg.children].forEach(b=>b.classList.toggle('on', b.dataset.m===mode));
    sceneSeg.style.display  = mode==='bases' ? '' : 'none';
    dirSeg.style.display    = mode==='similar' ? '' : 'none';
    presetSeg.style.display = (mode==='similar' && sim.reverse) ? '' : 'none';
    kGrp.style.display      = (mode==='similar' && !sim.reverse) ? '' : 'none';
    volGrp.style.display    = mode==='similar' ? '' : 'none';
    [...sceneSeg.children].forEach(b=>b.classList.toggle('on', b.dataset.s===scene));
    [...dirSeg.children].forEach(b=>b.classList.toggle('on', (b.dataset.d==='rev')===sim.reverse));
    const key = mode==='bases' ? scene : (sim.reverse ? 'rev' : 'fwd');
    stmt.innerHTML = STMTS[key];
    hintEl.textContent = HINTS[key];
    document.getElementById('hint2').textContent = HINTS[key];
    redraw();
  }

  let redrawDepth=0;
  function redraw(){
    if(!W || !H) return;
    const topUsed = stageBox().y;
    ctx.clearRect(0,0,W,H);
    if(mode==='bases'){
      if(scene==='split') drawSplit();
      else if(scene==='trap') drawTrap();
      else drawCut();
    } else {
      drawSimilar();
    }
    // writing the readout can change its height → settle the layout once
    if(redrawDepth<2 && stageBox().y!==topUsed){
      redrawDepth++; redraw(); redrawDepth--;
    }
  }

  modeSeg.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    mode=b.dataset.m; applyView();
  });
  sceneSeg.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    scene=b.dataset.s; applyView();
  });
  dirSeg.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    sim.reverse = b.dataset.d==='rev'; applyView();
  });
  presetSeg.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    sim.A1=parseInt(b.dataset.a1,10); sim.A2=parseInt(b.dataset.a2,10);
    [...presetSeg.children].forEach(c=>c.classList.toggle('on', c===b));
    redraw();
  });
  function setK(v){
    sim.k = Math.max(1, Math.min(3, v));
    kRange.value = sim.k.toFixed(2);
    kVal.textContent = sim.k.toFixed(2);
  }
  kRange.addEventListener('input', e=>{
    let v=parseFloat(e.target.value);
    const f=fracOf(v, K_SNAPS, 0.035);
    if(f) v=f.v;
    setK(v); redraw();
  });
  volBtn.addEventListener('click', ()=>{
    sim.vols=!sim.vols;
    volBtn.classList.toggle('on', sim.vols);
    volBtn.textContent='volumes: '+(sim.vols?'on':'off');
    redraw();
  });
  resetBtn.addEventListener('click', ()=>{
    if(mode==='bases'){
      if(scene==='split'){ sp.t=0.4; sp.ax=0.13; }
      else if(scene==='trap'){ tz.a=2; tz.b=3; }
      else cut.k=2/3;
    } else {
      setK(1.5); sim.A1=81; sim.A2=121;
      [...presetSeg.children].forEach(c=>c.classList.toggle('on', c.dataset.a1==='81'));
    }
    redraw();
  });

  // ---- pointer handling ----------------------------------------------
  let dragTok=null, hover=null;
  function canvasXY(e){
    const r=cv.getBoundingClientRect();
    return {x:e.clientX-r.left, y:e.clientY-r.top};
  }
  function hitTest(m){
    const bx=stageBox();
    if(mode==='bases'){
      if(scene==='split'){
        const g=splitGeom(sp.t, sp.ax, bx);
        if(dist(m,g.P)<GRAB) return 'P';
        if(dist(m,g.A)<GRAB) return 'A';
      } else if(scene==='trap'){
        const g=trapGeom(tz.a, tz.b, bx);
        if(dist(m,g.B)<GRAB || dist(m,g.A)<GRAB) return 'a';
        if(dist(m,g.C)<GRAB || dist(m,g.D)<GRAB) return 'b';
      } else {
        const g=cutGeom(cut.k, bx);
        if(dist(m,g.P)<GRAB || dist(m,g.Q)<GRAB) return 'k';
        // anywhere near the PQ line (it is horizontal)
        if(m.y>g.A.y+12 && m.y<g.baseY-6 && Math.abs(m.y-g.P.y)<16 &&
           m.x>Math.min(g.P.x,g.Q.x)-10 && m.x<Math.max(g.P.x,g.Q.x)+10) return 'k';
      }
    } else if(!sim.reverse){
      const L=simLayout(bx);
      const h={x:L.o2.x + 2*L.s1*sim.k, y:L.gy};
      if(dist(m,h)<GRAB+4) return 'k2';
    }
    return null;
  }
  function applyDrag(m){
    const bx=stageBox();
    if(dragTok==='P'){
      const g=splitGeom(sp.t, sp.ax, bx);
      const BCw=g.C.x-g.B.x;
      let t=Math.max(0.05, Math.min(0.95, (m.x-g.B.x)/BCw));
      sp.t=snapValue(t, SPLIT_SNAPS, BCw);
    } else if(dragTok==='A'){
      const g=splitGeom(sp.t, sp.ax, bx);
      let ax=(m.x-g.cxm)/(2*g.half);
      ax=Math.max(-0.38, Math.min(0.38, ax));
      if(Math.abs(ax*2*g.half)<6) ax=0;          // snap the apex to centre
      sp.ax=ax;
    } else if(dragTok==='a' || dragTok==='b'){
      const g=trapGeom(tz.a, tz.b, bx);
      let raw=Math.max(0.7, Math.min(6, Math.abs(m.x-g.cxm)*2/g.u));
      // snap this side so a : b hits m : n (m,n ≤ 5)
      const other = dragTok==='a' ? tz.b : tz.a;
      let best=null, bd=Infinity;
      for(const f of TRAP_PAIRS){
        const cand = dragTok==='a' ? other*f.m/f.n : other*f.n/f.m;
        if(cand<0.7 || cand>6) continue;
        const d=Math.abs(cand-raw);
        if(d<bd){ bd=d; best=cand; }
      }
      if(best!==null && bd*g.u/2 < SNAP_PX) raw=best;
      if(dragTok==='a') tz.a=raw; else tz.b=raw;
    } else if(dragTok==='k'){
      const g=cutGeom(cut.k, bx);
      const hFull=g.baseY-g.A.y;
      let k=Math.max(0.12, Math.min(0.92, (m.y-g.A.y)/hFull));
      cut.k=snapValue(k, CUT_SNAPS, hFull);
    } else if(dragTok==='k2'){
      const L=simLayout(bx);
      let k=Math.max(1, Math.min(3, (m.x-L.o2.x)/(2*L.s1)));
      setK(snapValue(k, K_SNAPS, 2*L.s1));
    }
    redraw();
  }
  cv.addEventListener('pointerdown', e=>{
    const m=canvasXY(e);
    dragTok=hitTest(m);
    if(!dragTok) return;
    cv.classList.add('drag');
    cv.setPointerCapture(e.pointerId);
    applyDrag(m);
  });
  cv.addEventListener('pointermove', e=>{
    const m=canvasXY(e);
    if(dragTok){ applyDrag(m); return; }
    const h=hitTest(m);
    if(h!==hover){ hover=h; cv.classList.toggle('pt', !!h); redraw(); }
  });
  function endDrag(){
    if(!dragTok) return;
    dragTok=null; cv.classList.remove('drag'); redraw();
  }
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  // ====================================================================
  // Check harness — asserts the page's own geometry, from coordinates
  // ====================================================================
  function runChecks(){
    const fails=[];
    const ck=(name,x,y,eps)=>{ if(Math.abs(x-y)>eps) fails.push(name+': got '+x+', want '+y); };
    const bx={x:0, y:0, w:800, h:520};

    // 1) shared height at BP:PC = 2:3 ⇒ areas exactly 2:3, from shoelace on drawn coords
    { const g=splitGeom(0.4, 0.13, bx);
      const r=areaPoly([g.A,g.B,g.P])/areaPoly([g.A,g.P,g.C]);
      ck('split areas 2:3', r, 2/3, 1e-9);
      ck('split areas track bases', r, (g.P.x-g.B.x)/(g.C.x-g.P.x), 1e-9); }

    // 2) trapezium a:b = 2:3 ⇒ 4 : 9 : 6 : 6 (sum 25 = (2+3)²), from real intersection X
    { const g=trapGeom(2,3,bx);
      const top=areaPoly([g.A,g.B,g.X]), bot=areaPoly([g.D,g.C,g.X]),
            left=areaPoly([g.A,g.X,g.D]), right=areaPoly([g.B,g.C,g.X]);
      const s=(top+bot+left+right)/25;
      ck('trap top = 4',    top/s,   4, 1e-9);
      ck('trap bottom = 9', bot/s,   9, 1e-9);
      ck('trap left = 6',   left/s,  6, 1e-9);
      ck('trap right = 6',  right/s, 6, 1e-9); }

    // 3) parallel cut at k = 2/3 ⇒ small : whole = 4 : 9; strip = 5 : 9
    { const g=cutGeom(2/3,bx);
      const small=areaPoly([g.A,g.P,g.Q]), whole=areaPoly([g.A,g.B,g.C]);
      ck('cut small/whole = 4/9', small/whole, 4/9, 1e-9);
      ck('cut strip/whole = 5/9', areaPoly([g.P,g.B,g.C,g.Q])/whole, 5/9, 1e-9); }

    // 4) reverse: surface areas 81:121 ⇒ lengths 9:11 ⇒ volumes 729:1331 (exact integers)
    { const d=deriveReverse(81,121);
      if(!(d.exact && d.L1===9 && d.L2===11 && d.V1===729 && d.V2===1331))
        fails.push('reverse 81:121 → '+JSON.stringify(d)); }

    // 5) forward chain at k = 1.5 ⇒ lengths 2:3, areas 4:9, volumes 8:27
    { const f=fracOf(1.5, K_SNAPS);
      if(!(f && f.q===2 && f.p===3 && f.q*f.q===4 && f.p*f.p===9 &&
           Math.pow(f.q,3)===8 && Math.pow(f.p,3)===27))
        fails.push('k=1.5 chain → '+JSON.stringify(f)); }

    window.__areaRatiosChecks = {pass: fails.length===0, fails};
    if(fails.length) console.error('[area-ratios] CHECK FAILURES:', fails);
    else console.log('[area-ratios] all geometry checks passed (split 2:3 · trapezium 4:9:6:6 · cut 4:9+5:9 · reverse 81:121→9:11→729:1331 · chain 2:3→4:9→8:27)');
  }

  // ---- init -----------------------------------------------------------
  resize();
  applyView();
  runChecks();
})();
</script>
